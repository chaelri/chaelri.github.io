<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lakad</title>
<style>
  :root { --chip: rgba(255,255,255,.78); --ink: #4a3f55; --mute: #8a7f95; --accent: #f28db2; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #cfe8ff; color: var(--ink);
               font: 14px/1.4 ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, sans-serif; }
  canvas { display: block; touch-action: none; }
  .keys { position: fixed; left: 16px; bottom: 16px; background: var(--chip); backdrop-filter: blur(10px);
          -webkit-backdrop-filter: blur(10px); border-radius: 16px; padding: 10px 14px; font-size: 13px; color: var(--mute);
          display: grid; grid-template-columns: auto auto; gap: 3px 12px; }
  .keys b { color: var(--ink); font-weight: 600; }
  .state { position: fixed; top: 16px; left: 50%; transform: translateX(-50%); background: var(--chip);
           backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-radius: 999px; padding: 6px 16px;
           font-weight: 600; letter-spacing: .04em; }
  #skel { position: fixed; right: 16px; bottom: 16px; border: 0; background: var(--chip); color: var(--ink);
          font: inherit; font-weight: 600; padding: 10px 14px; border-radius: 14px; cursor: pointer; }
  #skel.on { background: var(--accent); color: #fff; }
  #note { position: fixed; top: 60px; left: 50%; transform: translateX(-50%); background: var(--chip); padding: 8px 14px;
          border-radius: 12px; font-size: 13px; color: var(--mute); }
  [hidden] { display: none !important; }
</style>
<script type="importmap">
  { "imports": {
      "three": "../splat/vendor/three/three.module.js",
      "three/addons/": "../splat/vendor/three/addons/"
  } }
</script>
</head>
<body>
<div class="state" id="state">idle</div>
<div class="keys">
  <b>WASD</b><span>walk</span>
  <b>Shift</b><span>sprint</span>
  <b>Space</b><span>jump (hold = higher)</span>
  <b>Drag</b><span>turn camera · scroll zoom</span>
  <b>K</b><span>show skeleton</span>
</div>
<button id="skel">Skeleton</button>
<script type="module" src="js/main.js"></script>
</body>
</html>
