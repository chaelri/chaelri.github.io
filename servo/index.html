<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffd9ec">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Servo Buddy ♡</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Gaegu:wght@400;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  :root{
    --pink:#ff8fc4; --pink-soft:#ffd0e6; --lav:#c8b6ff; --peach:#ffd6a5;
    --cream:#fff6fb; --ink:#8a5a76; --mint:#a7f3d0;
  }
  body{
    font-family:"Fredoka",system-ui,sans-serif;
    color:var(--ink);
    min-height:100dvh;
    display:flex;flex-direction:column;align-items:center;justify-content:space-between;
    padding:calc(env(safe-area-inset-top) + 1.2rem) 1.25rem calc(env(safe-area-inset-bottom) + 1.4rem);
    overflow:hidden;position:relative;
    background:linear-gradient(160deg,#ffe3f1 0%,#f3e2ff 45%,#e2f0ff 100%);
    background-size:200% 200%;
    animation:bgDrift 18s ease-in-out infinite;
  }
  @keyframes bgDrift{0%,100%{background-position:0% 0%}50%{background-position:100% 100%}}

  /* floating cuties in the background */
  .sky{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0}
  .float{position:absolute;bottom:-3rem;font-size:1.4rem;opacity:0;animation:rise linear infinite;filter:drop-shadow(0 2px 4px rgba(255,150,200,.25))}
  @keyframes rise{
    0%{transform:translateY(0) rotate(0deg) scale(.7);opacity:0}
    12%{opacity:.9}
    88%{opacity:.9}
    100%{transform:translateY(-112vh) rotate(220deg) scale(1.05);opacity:0}
  }

  .wrap{position:relative;z-index:1;width:100%;max-width:24rem;display:flex;flex-direction:column;align-items:center;gap:.35rem;flex:1;justify-content:center}

  header{position:relative;z-index:1;text-align:center;margin-top:.2rem}
  .title{font-size:1.5rem;font-weight:700;letter-spacing:.02em;color:#ff6fb0;text-shadow:0 2px 0 #fff,0 3px 8px rgba(255,120,180,.25)}
  .subtitle{font-family:"Gaegu",cursive;font-size:1rem;color:#b58bd0;margin-top:-.15rem}

  /* ---- the mascot ---- */
  .stage{width:min(66vw,15rem);aspect-ratio:1;position:relative;margin:.4rem 0 .2rem}
  .shadow{
    position:absolute;left:50%;bottom:-.4rem;width:52%;height:1.1rem;transform:translateX(-50%);
    background:radial-gradient(ellipse at center,rgba(180,120,160,.28),rgba(180,120,160,0) 70%);
    animation:shadowPulse 3s ease-in-out infinite;
  }
  @keyframes shadowPulse{0%,100%{transform:translateX(-50%) scale(1);opacity:.8}50%{transform:translateX(-50%) scale(.86);opacity:.55}}

  /* leans mirror the real servo: LEFT/RIGHT tilt the whole buddy */
  .buddy{width:100%;height:100%;transform-origin:50% 82%;transition:transform .85s cubic-bezier(.34,1.4,.5,1);animation:bob 3s ease-in-out infinite}
  .buddy.lean-left{transform:rotate(-15deg)}
  .buddy.lean-right{transform:rotate(15deg)}
  @keyframes bob{0%,100%{translate:0 0}50%{translate:0 -3%}}

  /* sleepy state: stop bobbing, dim a touch */
  body.off .buddy{animation:sleepBreathe 4s ease-in-out infinite;filter:saturate(.75) brightness(1.02)}
  @keyframes sleepBreathe{0%,100%{transform:rotate(0deg) scale(1)}50%{transform:rotate(0deg) scale(1.02)}}
  body.off .shadow{animation:none;opacity:.5}

  .eye-open{transition:opacity .25s}
  .eye-closed{opacity:0;transition:opacity .25s}
  body.off .eye-open{opacity:0}
  body.off .eye-closed{opacity:1}
  .sparkle-eye{animation:twinkle 2.4s ease-in-out infinite}
  @keyframes twinkle{0%,100%{opacity:.9}50%{opacity:.4}}

  /* zzz only while sleeping */
  .zzz{position:absolute;top:8%;right:6%;font-family:"Gaegu",cursive;font-weight:700;color:#b58bd0;opacity:0;pointer-events:none}
  .zzz span{display:inline-block;opacity:0}
  body.off .zzz{opacity:1}
  body.off .zzz span{animation:zfloat 2.6s ease-in-out infinite}
  body.off .zzz span:nth-child(1){animation-delay:0s;font-size:.9rem}
  body.off .zzz span:nth-child(2){animation-delay:.5s;font-size:1.1rem}
  body.off .zzz span:nth-child(3){animation-delay:1s;font-size:1.35rem}
  @keyframes zfloat{0%{opacity:0;transform:translateY(6px) rotate(-8deg)}30%{opacity:1}100%{opacity:0;transform:translateY(-16px) rotate(8deg)}}

  /* little wand hearts fly when awake + moving */
  .hearts{position:absolute;inset:0;pointer-events:none}

  /* ---- status pill ---- */
  .status{
    display:inline-flex;align-items:center;gap:.5rem;
    padding:.5rem 1.1rem;border-radius:999px;background:rgba(255,255,255,.72);
    box-shadow:0 6px 16px -6px rgba(255,120,180,.45),inset 0 0 0 1.5px rgba(255,255,255,.9);
    backdrop-filter:blur(6px);
    font-size:.92rem;font-weight:600;color:#c76fa0;
  }
  .status .dot{width:.6rem;height:.6rem;border-radius:50%;background:#f0abca;box-shadow:0 0 8px #ffa5cc;animation:beat 1.4s ease-in-out infinite}
  body.off .status .dot{background:#c9c3d6;box-shadow:none;animation:none}
  body.off .status{color:#a99ec0}
  @keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.35)}}

  /* ---- big cute toggle ---- */
  .toggle{
    position:relative;z-index:1;
    width:min(76vw,17rem);height:5.4rem;border-radius:2.7rem;border:none;cursor:pointer;
    padding:.5rem;display:flex;align-items:center;
    font-family:inherit;
    background:linear-gradient(180deg,#e7dcff,#d9c9ff);
    box-shadow:inset 0 4px 10px rgba(150,120,200,.35),inset 0 -3px 6px rgba(255,255,255,.6),0 10px 24px -10px rgba(150,110,190,.6);
    transition:background .4s ease;
  }
  body:not(.off) .toggle{background:linear-gradient(180deg,#ffd0e6,#ffb3d6)}
  .knob{
    position:absolute;top:.5rem;left:.5rem;height:calc(100% - 1rem);aspect-ratio:1;border-radius:50%;
    background:radial-gradient(circle at 34% 30%,#ffffff,#fff0f7 60%,#ffd9ec);
    box-shadow:0 6px 14px -3px rgba(200,120,170,.6),inset 0 -3px 6px rgba(255,180,215,.5),inset 0 3px 6px #fff;
    display:flex;align-items:center;justify-content:center;font-size:1.9rem;
    transition:left .45s cubic-bezier(.34,1.5,.5,1),transform .2s;
  }
  body:not(.off) .knob{left:calc(100% - .5rem - (5.4rem - 1rem))}
  .toggle:active .knob{transform:scale(.92)}
  .toggle-label{position:absolute;font-weight:700;font-size:1.15rem;letter-spacing:.04em;transition:opacity .3s,color .3s}
  .lbl-on{right:1.7rem;color:#ff5fa8;opacity:0}
  .lbl-off{left:1.9rem;color:#9a86c4;opacity:1}
  body:not(.off) .lbl-on{opacity:1}
  body:not(.off) .lbl-off{opacity:0}

  .hint{position:relative;z-index:1;font-family:"Gaegu",cursive;font-size:1rem;color:#b58bd0;text-align:center;min-height:1.3em}

  .foot{position:relative;z-index:1;font-family:"Gaegu",cursive;font-size:.82rem;color:#cbb6df;display:flex;align-items:center;gap:.4rem}
  .foot .link-dot{width:.4rem;height:.4rem;border-radius:50%;background:#e6b8d8}

  .tap-pop{animation:pop .4s ease}
  @keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.06)}100%{transform:scale(1)}}
</style>
</head>
<body class="off">
  <div class="sky" id="sky"></div>

  <header>
    <div class="title">Servo Buddy</div>
    <div class="subtitle">tap to make me poke ♡</div>
  </header>

  <div class="wrap">
    <div class="stage" id="stage" role="button" aria-label="toggle servo">
      <div class="shadow"></div>
      <div class="buddy" id="buddy">
        <svg viewBox="0 0 200 200" width="100%" height="100%" aria-hidden="true">
          <defs>
            <radialGradient id="face" cx="42%" cy="34%" r="72%">
              <stop offset="0%" stop-color="#fffdfe"/>
              <stop offset="60%" stop-color="#fff2f8"/>
              <stop offset="100%" stop-color="#ffd9ec"/>
            </radialGradient>
            <linearGradient id="ear" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#ffe0ef"/>
              <stop offset="100%" stop-color="#ffbcdd"/>
            </linearGradient>
          </defs>

          <!-- tail -->
          <path d="M158 150 q34 4 30 -32 q-3 -22 -20 -20 q14 6 12 24 q-2 22 -22 16 Z" fill="#ffc7e2"/>

          <!-- ears -->
          <path d="M56 58 L44 20 L86 44 Z" fill="url(#ear)" stroke="#ffaad3" stroke-width="3" stroke-linejoin="round"/>
          <path d="M144 58 L156 20 L114 44 Z" fill="url(#ear)" stroke="#ffaad3" stroke-width="3" stroke-linejoin="round"/>
          <path d="M60 50 L53 30 L74 42 Z" fill="#ff9ec9"/>
          <path d="M140 50 L147 30 L126 42 Z" fill="#ff9ec9"/>

          <!-- head/body blob -->
          <ellipse cx="100" cy="112" rx="66" ry="62" fill="url(#face)" stroke="#ffb3d6" stroke-width="3.5"/>

          <!-- blush -->
          <ellipse cx="62" cy="120" rx="12" ry="8" fill="#ffb3d1" opacity=".8"/>
          <ellipse cx="138" cy="120" rx="12" ry="8" fill="#ffb3d1" opacity=".8"/>

          <!-- eyes: open -->
          <g class="eye-open">
            <ellipse cx="78" cy="102" rx="8.5" ry="11" fill="#6b4a63"/>
            <ellipse cx="122" cy="102" rx="8.5" ry="11" fill="#6b4a63"/>
            <circle class="sparkle-eye" cx="81" cy="98" r="3.2" fill="#fff"/>
            <circle class="sparkle-eye" cx="125" cy="98" r="3.2" fill="#fff"/>
          </g>
          <!-- eyes: closed (sleeping) -->
          <g class="eye-closed" fill="none" stroke="#a86f92" stroke-width="3.5" stroke-linecap="round">
            <path d="M70 104 q8 8 16 0"/>
            <path d="M114 104 q8 8 16 0"/>
          </g>

          <!-- nose + mouth :3 -->
          <path d="M96 114 h8 l-4 5 Z" fill="#ff86b8"/>
          <path d="M100 119 q-7 8 -14 3 M100 119 q7 8 14 3" fill="none" stroke="#c76fa0" stroke-width="2.6" stroke-linecap="round"/>

          <!-- whiskers -->
          <g stroke="#e7a9c9" stroke-width="2" stroke-linecap="round" opacity=".8">
            <path d="M40 108 q-16 -3 -24 -8"/><path d="M40 118 q-17 1 -25 -1"/>
            <path d="M160 108 q16 -3 24 -8"/><path d="M160 118 q17 1 25 -1"/>
          </g>

          <!-- little wand paw holding a heart -->
          <g id="paw">
            <circle cx="150" cy="150" r="13" fill="#fff2f8" stroke="#ffb3d6" stroke-width="3"/>
            <path d="M150 138 l6 -14" stroke="#ffb3d6" stroke-width="4" stroke-linecap="round" fill="none"/>
            <path d="M156 120 c-4 -6 -12 -2 -10 4 c1 3 6 7 10 10 c4 -3 9 -7 10 -10 c2 -6 -6 -10 -10 -4 Z" fill="#ff6fb0"/>
          </g>
        </svg>
      </div>
      <div class="zzz"><span>z</span><span>z</span><span>z</span></div>
      <div class="hearts" id="hearts"></div>
    </div>

    <div class="status" id="status">
      <span class="dot"></span><span id="statusText">tucked in &amp; sleepy</span>
    </div>
  </div>

  <button class="toggle" id="toggle" aria-label="toggle servo sweep">
    <span class="toggle-label lbl-off">OFF</span>
    <span class="toggle-label lbl-on">ON</span>
    <span class="knob" id="knob">🌙</span>
  </button>

  <div class="hint" id="hint">i poke 90° right every 3 seconds ~</div>

  <div class="foot"><span class="link-dot"></span>servo ⋅ chaelri<span class="link-dot"></span></div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
  import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js";
  import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";

  // Shared project test-database-55379 — same public web config as the other repo apps.
  const app = initializeApp({
    apiKey: "AIzaSyB8ahT56WbEUaGAymsRNNA-DrfZnUnWIwk",
    authDomain: "test-database-55379.firebaseapp.com",
    databaseURL: "https://test-database-55379-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "test-database-55379"
  });
  const db = getDatabase(app), auth = getAuth(app);
  const flagRef = ref(db, "servo/enabled");   // boolean gate the firmware listens on
  const posRef  = ref(db, "servo/pos");        // live position the firmware publishes

  const $ = id => document.getElementById(id);
  const body = document.body, buddy = $("buddy"), knob = $("knob");
  const statusText = $("statusText"), hint = $("hint");
  let enabled = false, gotFlag = false;

  // gate writes behind anonymous auth so the first tap isn't dropped
  const authReady = new Promise(res => {
    const unsub = onAuthStateChanged(auth, u => { if (u) { unsub(); res(u); } });
  });
  signInAnonymously(auth).catch(e => console.warn("anon signin:", e));

  // ---- live sync from Firebase ----
  onValue(flagRef, snap => {
    enabled = snap.val() === true;
    gotFlag = true;
    render();
  });

  onValue(posRef, snap => {
    const p = (snap.val() ?? "").toString().toUpperCase();
    setLean(p);
  });

  function render() {
    body.classList.toggle("off", !enabled);
    knob.textContent = enabled ? "☀️" : "🌙";
    statusText.textContent = enabled ? "poking happily ♪" : "tucked in & sleepy";
    hint.textContent = enabled ? "poke! poke! poke! ♪" : "i poke 90° right every 3 seconds ~";
    if (!enabled) setLean("STOPPED");
  }

  function setLean(p) {
    buddy.classList.remove("lean-left", "lean-right");
    if (!enabled) return;                 // stay centered while sleeping
    if (p === "LEFT")  { buddy.classList.add("lean-left");  spawnHeart(); }
    else if (p === "RIGHT") { buddy.classList.add("lean-right"); spawnHeart(); }
  }

  // ---- tap to toggle (both the toggle pill and the buddy work) ----
  async function flip() {
    if (!gotFlag) return;
    if (navigator.vibrate) navigator.vibrate(18);
    body.classList.add("tap-pop");
    setTimeout(() => body.classList.remove("tap-pop"), 400);
    await authReady;
    await set(flagRef, !enabled);          // onValue re-renders
  }
  $("toggle").addEventListener("click", flip);
  $("stage").addEventListener("click", flip);

  // ---- little hearts that puff out on each sweep ----
  const hearts = $("hearts");
  const puff = ["💕","💖","✨","🌸","💗"];
  function spawnHeart() {
    const h = document.createElement("div");
    h.textContent = puff[Math.floor(Math.random() * puff.length)];
    h.style.cssText = `position:absolute;left:${30 + Math.random()*40}%;top:${20 + Math.random()*30}%;
      font-size:${0.9 + Math.random()*0.6}rem;pointer-events:none;
      animation:heartPuff 1.1s ease-out forwards;`;
    hearts.appendChild(h);
    setTimeout(() => h.remove(), 1150);
  }

  // ---- background floaty cuties ----
  const sky = $("sky");
  const cuties = ["🌸","✨","💗","☁️","🎀","⭐","🫧"];
  for (let i = 0; i < 14; i++) {
    const s = document.createElement("div");
    s.className = "float";
    s.textContent = cuties[i % cuties.length];
    s.style.left = Math.random() * 100 + "%";
    s.style.fontSize = (0.9 + Math.random() * 1.3) + "rem";
    s.style.animationDuration = (9 + Math.random() * 9) + "s";
    s.style.animationDelay = (-Math.random() * 12) + "s";
    sky.appendChild(s);
  }
</script>

<style>
  @keyframes heartPuff{
    0%{opacity:0;transform:translateY(0) scale(.5)}
    25%{opacity:1}
    100%{opacity:0;transform:translateY(-46px) scale(1.15) rotate(12deg)}
  }
</style>
</body>
</html>
