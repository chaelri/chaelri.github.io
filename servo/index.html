<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffd9ec">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Servo Buddy ♡</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Gaegu:wght@400;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  :root{--ink:#8a5a76}
  body{
    font-family:"Fredoka",system-ui,sans-serif;color:var(--ink);
    min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:space-between;
    padding:calc(env(safe-area-inset-top) + .9rem) 1rem calc(env(safe-area-inset-bottom) + 1rem);
    overflow:hidden;position:relative;
    background:linear-gradient(160deg,#ffe3f1 0%,#f3e2ff 45%,#e2f0ff 100%);
    background-size:200% 200%;animation:bgDrift 18s ease-in-out infinite;
  }
  @keyframes bgDrift{0%,100%{background-position:0% 0%}50%{background-position:100% 100%}}

  .sky{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0}
  .float{position:absolute;bottom:-3rem;font-size:1.3rem;opacity:0;animation:rise linear infinite;filter:drop-shadow(0 2px 4px rgba(255,150,200,.25))}
  @keyframes rise{0%{transform:translateY(0) rotate(0) scale(.7);opacity:0}12%{opacity:.85}88%{opacity:.85}100%{transform:translateY(-112vh) rotate(220deg) scale(1.05);opacity:0}}

  header{position:relative;z-index:1;text-align:center;margin-top:.1rem}
  .title{font-size:1.35rem;font-weight:700;color:#ff6fb0;text-shadow:0 2px 0 #fff,0 3px 8px rgba(255,120,180,.25)}
  .subtitle{font-family:"Gaegu",cursive;font-size:.95rem;color:#b58bd0;margin-top:-.15rem}

  /* ---- control row: ◀  cat  ▶ ---- */
  .controls-row{position:relative;z-index:1;display:flex;align-items:center;justify-content:center;gap:.5rem;width:100%;max-width:24rem}
  .jog{
    flex:0 0 auto;width:4.2rem;height:4.2rem;border-radius:50%;border:none;cursor:pointer;
    font-size:1.9rem;color:#fff;display:flex;align-items:center;justify-content:center;font-family:inherit;
    background:radial-gradient(circle at 34% 30%,#d7c6ff,#b79bff 60%,#9a86e0);
    box-shadow:0 8px 20px -6px rgba(150,110,190,.6),inset 0 -4px 8px rgba(120,90,180,.35),inset 0 3px 6px rgba(255,255,255,.5);
    transition:transform .1s;
  }
  .jog:active{transform:scale(.9)}
  .jog:disabled{opacity:.35;cursor:default}

  .stage{flex:0 0 auto;width:min(44vw,10.5rem);aspect-ratio:1;position:relative}
  .shadow{position:absolute;left:50%;bottom:-.3rem;width:52%;height:.9rem;transform:translateX(-50%);background:radial-gradient(ellipse at center,rgba(180,120,160,.28),rgba(180,120,160,0) 70%)}
  .buddy{width:100%;height:100%;transform-origin:50% 82%;transition:transform .35s cubic-bezier(.34,1.4,.5,1);animation:bob 3s ease-in-out infinite}
  @keyframes bob{0%,100%{translate:0 0}50%{translate:0 -3%}}
  .sparkle-eye{animation:twinkle 2.4s ease-in-out infinite}
  @keyframes twinkle{0%,100%{opacity:.9}50%{opacity:.4}}

  .angle-read{position:relative;z-index:1;font-weight:700;font-size:1.5rem;color:#c76fa0;margin-top:.1rem;letter-spacing:.02em}
  .angle-sub{font-family:"Gaegu",cursive;font-size:.85rem;color:#b58bd0;font-weight:400}

  .status{position:relative;z-index:1;display:inline-flex;align-items:center;gap:.5rem;padding:.42rem 1rem;border-radius:999px;background:rgba(255,255,255,.72);box-shadow:0 6px 16px -6px rgba(255,120,180,.4),inset 0 0 0 1.5px rgba(255,255,255,.9);backdrop-filter:blur(6px);font-size:.85rem;font-weight:600;color:#c76fa0}
  .status .dot{width:.55rem;height:.55rem;border-radius:50%;background:#c9c3d6}
  .status.live .dot{background:#68d391;box-shadow:0 0 8px #7ee0a4;animation:beat 1.4s ease-in-out infinite}
  .status.rec .dot{background:#ff5b7f;box-shadow:0 0 8px #ff8fa8;animation:beat .8s ease-in-out infinite}
  .status.play .dot{background:#f6c453;box-shadow:0 0 8px #ffd77a;animation:beat 1s ease-in-out infinite}
  @keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.35)}}

  /* ---- record / play / loop panel ---- */
  .panel{position:relative;z-index:1;width:100%;max-width:24rem;background:rgba(255,255,255,.66);border-radius:1.4rem;padding:.9rem;box-shadow:0 10px 30px -12px rgba(200,120,170,.55),inset 0 0 0 1.5px rgba(255,255,255,.8);backdrop-filter:blur(8px);display:flex;flex-direction:column;gap:.7rem}
  .progress{height:.5rem;border-radius:999px;background:rgba(200,160,200,.25);overflow:hidden}
  .progress > i{display:block;height:100%;width:0;border-radius:999px;background:linear-gradient(90deg,#ff9ec9,#ff6fb0)}
  .btn-row{display:flex;gap:.6rem}
  .cbtn{flex:1;border:none;cursor:pointer;font-family:inherit;font-weight:700;font-size:.95rem;padding:.85rem .5rem;border-radius:1rem;color:#fff;display:flex;align-items:center;justify-content:center;gap:.35rem;transition:transform .1s,filter .2s;box-shadow:0 6px 14px -5px rgba(0,0,0,.28),inset 0 -3px 6px rgba(0,0,0,.15),inset 0 2px 4px rgba(255,255,255,.4)}
  .cbtn:active{transform:scale(.95)}
  .cbtn:disabled{opacity:.4;cursor:default;filter:grayscale(.3)}
  .cbtn.rec{background:linear-gradient(180deg,#ff8fb0,#ff5b7f)}
  .cbtn.rec.armed{background:linear-gradient(180deg,#ff6f90,#e23b60);animation:recpulse 1s ease-in-out infinite}
  @keyframes recpulse{0%,100%{filter:brightness(1)}50%{filter:brightness(1.15)}}
  .cbtn.play{background:linear-gradient(180deg,#7fe3a6,#3fbf7a)}
  .cbtn.play.on{background:linear-gradient(180deg,#f6c453,#e0a020)}
  .speed-row{display:flex;align-items:center;justify-content:space-between;gap:.8rem;padding:0 .3rem}
  .speed{-webkit-appearance:none;appearance:none;flex:1;height:.55rem;border-radius:999px;background:linear-gradient(90deg,#ffd0e6,#ff8fc4);outline:none;cursor:pointer}
  .speed::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:1.5rem;height:1.5rem;border-radius:50%;background:radial-gradient(circle at 34% 30%,#fff,#ffd9ec);box-shadow:0 2px 6px rgba(200,120,170,.6),inset 0 -2px 4px rgba(255,180,215,.5);cursor:pointer}
  .speed::-moz-range-thumb{width:1.5rem;height:1.5rem;border:none;border-radius:50%;background:radial-gradient(circle at 34% 30%,#fff,#ffd9ec);box-shadow:0 2px 6px rgba(200,120,170,.6);cursor:pointer}
  .loop-row{display:flex;align-items:center;justify-content:space-between;padding:0 .3rem}
  .loop-label{font-weight:600;font-size:.95rem;color:#a06fb0;display:flex;align-items:center;gap:.4rem}
  .lswitch{width:3.4rem;height:1.9rem;border-radius:999px;border:none;cursor:pointer;background:#e0d3f0;position:relative;transition:background .3s;flex:0 0 auto}
  .lswitch.on{background:linear-gradient(90deg,#ffb3d6,#ff8fc4)}
  .lswitch::after{content:"";position:absolute;top:.2rem;left:.2rem;width:1.5rem;height:1.5rem;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.25);transition:left .3s cubic-bezier(.34,1.5,.5,1)}
  .lswitch.on::after{left:calc(100% - .2rem - 1.5rem)}

  .hint{position:relative;z-index:1;font-family:"Gaegu",cursive;font-size:.95rem;color:#b58bd0;text-align:center;min-height:1.2em}
</style>
</head>
<body>
  <div class="sky" id="sky"></div>

  <header>
    <div class="title">Servo Buddy</div>
    <div class="subtitle">turn me, record it, play it back ♡</div>
  </header>

  <div class="controls-row">
    <button class="jog" id="left" aria-label="turn left">◀</button>
    <div class="stage">
      <div class="shadow"></div>
      <div class="buddy" id="buddy">
        <svg viewBox="0 0 200 200" width="100%" height="100%" aria-hidden="true">
          <defs>
            <radialGradient id="face" cx="42%" cy="34%" r="72%"><stop offset="0%" stop-color="#fffdfe"/><stop offset="60%" stop-color="#fff2f8"/><stop offset="100%" stop-color="#ffd9ec"/></radialGradient>
            <linearGradient id="ear" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#ffe0ef"/><stop offset="100%" stop-color="#ffbcdd"/></linearGradient>
          </defs>
          <path d="M158 150 q34 4 30 -32 q-3 -22 -20 -20 q14 6 12 24 q-2 22 -22 16 Z" fill="#ffc7e2"/>
          <path d="M56 58 L44 20 L86 44 Z" fill="url(#ear)" stroke="#ffaad3" stroke-width="3" stroke-linejoin="round"/>
          <path d="M144 58 L156 20 L114 44 Z" fill="url(#ear)" stroke="#ffaad3" stroke-width="3" stroke-linejoin="round"/>
          <path d="M60 50 L53 30 L74 42 Z" fill="#ff9ec9"/><path d="M140 50 L147 30 L126 42 Z" fill="#ff9ec9"/>
          <ellipse cx="100" cy="112" rx="66" ry="62" fill="url(#face)" stroke="#ffb3d6" stroke-width="3.5"/>
          <ellipse cx="62" cy="120" rx="12" ry="8" fill="#ffb3d1" opacity=".8"/><ellipse cx="138" cy="120" rx="12" ry="8" fill="#ffb3d1" opacity=".8"/>
          <ellipse cx="78" cy="102" rx="8.5" ry="11" fill="#6b4a63"/><ellipse cx="122" cy="102" rx="8.5" ry="11" fill="#6b4a63"/>
          <circle class="sparkle-eye" cx="81" cy="98" r="3.2" fill="#fff"/><circle class="sparkle-eye" cx="125" cy="98" r="3.2" fill="#fff"/>
          <path d="M96 114 h8 l-4 5 Z" fill="#ff86b8"/>
          <path d="M100 119 q-7 8 -14 3 M100 119 q7 8 14 3" fill="none" stroke="#c76fa0" stroke-width="2.6" stroke-linecap="round"/>
          <g stroke="#e7a9c9" stroke-width="2" stroke-linecap="round" opacity=".8"><path d="M40 108 q-16 -3 -24 -8"/><path d="M40 118 q-17 1 -25 -1"/><path d="M160 108 q16 -3 24 -8"/><path d="M160 118 q17 1 25 -1"/></g>
        </svg>
      </div>
      <div class="hearts" id="hearts" style="position:absolute;inset:0;pointer-events:none"></div>
    </div>
    <button class="jog" id="right" aria-label="turn right">▶</button>
  </div>

  <div class="angle-read"><span id="angleVal">90</span>°<span class="angle-sub" id="angleSub"> · center</span></div>

  <div class="status" id="status"><span class="dot"></span><span id="statusText">connecting…</span></div>

  <div class="panel">
    <div class="progress"><i id="progBar"></i></div>
    <div class="btn-row">
      <button class="cbtn rec" id="recBtn">● Record 5s</button>
      <button class="cbtn play" id="playBtn" disabled>▶ Play</button>
    </div>
    <div class="speed-row">
      <span class="loop-label">🐢 Turn speed 🐇</span>
      <input type="range" id="speed" class="speed" min="1" max="5" step="1" value="3" aria-label="turn speed">
    </div>
    <div class="loop-row">
      <span class="loop-label">🔁 Loop / auto-repeat</span>
      <button class="lswitch" id="loopSwitch" aria-label="toggle loop"></button>
    </div>
  </div>

  <div class="hint" id="hint">tap ◀ ▶ to turn me left &amp; right ~</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
  import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js";
  import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";

  const app = initializeApp({
    apiKey: "AIzaSyB8ahT56WbEUaGAymsRNNA-DrfZnUnWIwk",
    authDomain: "test-database-55379.firebaseapp.com",
    databaseURL: "https://test-database-55379-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "test-database-55379"
  });
  const db = getDatabase(app), auth = getAuth(app);
  const angleRef = ref(db, "servo/angle");   // firmware follows this integer
  const posRef   = ref(db, "servo/pos");      // firmware echoes what it applied

  const $ = id => document.getElementById(id);
  const buddy = $("buddy"), angleVal = $("angleVal"), angleSub = $("angleSub");
  const status = $("status"), statusText = $("statusText"), hint = $("hint");
  const recBtn = $("recBtn"), playBtn = $("playBtn"), loopSwitch = $("loopSwitch"), progBar = $("progBar");

  const MIN = 0, MAX = 180, CENTER = 90, RECORD_MS = 5000;
  const SPEED_STEPS = [4, 8, 15, 24, 36];   // degrees per turn, 🐢 -> 🐇
  let jogStep = SPEED_STEPS[2];             // default = middle speed
  let angle = CENTER;
  let authed = false;

  const authReady = new Promise(res => { const u = onAuthStateChanged(auth, x => { if (x) { u(); res(x); } }); });
  signInAnonymously(auth).catch(e => console.warn(e));
  authReady.then(() => { authed = true; setLive(); pushAngle(); });

  // live device confirmation
  onValue(posRef, () => { if (authed) setLive(); });

  // ---- core: set + write angle ----
  async function pushAngle() { await authReady; set(angleRef, angle); }
  function renderAngle() {
    angleVal.textContent = angle;
    angleSub.textContent = angle === CENTER ? " · center" : (angle < CENTER ? " · left" : " · right");
    // map 0..90 -> lean -20°..+20° (mascot mirrors the servo)
    const lean = ((angle - CENTER) / (MAX - CENTER)) * 20;
    buddy.style.transform = `rotate(${lean}deg)`;
  }
  function setAngle(a, { log = true } = {}) {
    angle = Math.max(MIN, Math.min(MAX, a));
    renderAngle();
    pushAngle();
    if (recording && log) recEvents.push({ t: Date.now() - recStart, a: angle });
    spawnHeart();
  }

  // ---- manual jog (tap = 1 step, hold = repeat) ----
  function jog(dir) { if (playing) return; setAngle(angle + dir * jogStep); }
  function bindJog(btn, dir) {
    let iv = null;
    const start = e => { e.preventDefault(); if (navigator.vibrate) navigator.vibrate(12);
      jog(dir); iv = setInterval(() => jog(dir), 260); };
    const stop = () => { if (iv) { clearInterval(iv); iv = null; } };
    btn.addEventListener("pointerdown", start);
    btn.addEventListener("pointerup", stop);
    btn.addEventListener("pointerleave", stop);
    btn.addEventListener("pointercancel", stop);
  }
  bindJog($("left"), -1);
  bindJog($("right"), +1);

  // ---- record (5 s) ----
  let recording = false, recEvents = [], recStart = 0, recTimer = null, progAnim = null;
  function startRecord() {
    if (playing) return;
    recEvents = [{ t: 0, a: angle }];      // capture starting pose
    recStart = Date.now(); recording = true;
    recBtn.classList.add("armed"); recBtn.textContent = "● REC…";
    setStatus("rec", "recording… move me!");
    hint.textContent = "recording your moves for 5 seconds ~";
    // progress bar fills over 5 s
    progBar.style.transition = "none"; progBar.style.width = "0%";
    requestAnimationFrame(() => { progBar.style.transition = `width ${RECORD_MS}ms linear`; progBar.style.width = "100%"; });
    recTimer = setTimeout(stopRecord, RECORD_MS);
  }
  function stopRecord() {
    recording = false; clearTimeout(recTimer);
    recBtn.classList.remove("armed"); recBtn.textContent = "● Record 5s";
    progBar.style.transition = "width .3s"; progBar.style.width = "0%";
    playBtn.disabled = recEvents.length <= 1;
    setLive(); hint.textContent = recEvents.length > 1 ? "got it! tap ▶ Play to replay ♪" : "tap ◀ ▶ to turn me left & right ~";
  }
  recBtn.addEventListener("click", () => { if (recording) stopRecord(); else startRecord(); });

  // ---- playback + loop ----
  let playing = false, loop = false, playTimers = [];
  function play() {
    if (!recEvents.length || recording) return;
    playing = true;
    playBtn.classList.add("on"); playBtn.textContent = "■ Stop";
    $("left").disabled = $("right").disabled = recBtn.disabled = true;
    setStatus("play", "playing back ♪");
    hint.textContent = loop ? "looping your recording ~ ♪" : "replaying your moves ~ ♪";
    playOnce();
  }
  function playOnce() {
    clearTimers();
    recEvents.forEach(ev => playTimers.push(setTimeout(() => setAngle(ev.a, { log: false }), ev.t)));
    playTimers.push(setTimeout(() => { if (loop && playing) playOnce(); else stopPlay(); }, RECORD_MS + 60));
  }
  function stopPlay() {
    playing = false; clearTimers();
    playBtn.classList.remove("on"); playBtn.textContent = "▶ Play";
    $("left").disabled = $("right").disabled = recBtn.disabled = false;
    setLive(); hint.textContent = "tap ◀ ▶ to turn me, or record again ~";
  }
  function clearTimers() { playTimers.forEach(clearTimeout); playTimers = []; }
  playBtn.addEventListener("click", () => { if (playing) stopPlay(); else play(); });

  loopSwitch.addEventListener("click", () => {
    loop = !loop; loopSwitch.classList.toggle("on", loop);
    if (navigator.vibrate) navigator.vibrate(10);
  });

  // ---- turn-speed slider ----
  $("speed").addEventListener("input", e => {
    jogStep = SPEED_STEPS[(+e.target.value) - 1];
    if (!recording && !playing) hint.textContent = "speed set — hold ◀ ▶ to feel it ~";
  });

  // ---- status helpers ----
  function setStatus(cls, txt) { status.className = "status " + cls; statusText.textContent = txt; }
  function setLive() { if (!recording && !playing) setStatus("live", "connected ♡"); }

  // ---- little hearts ----
  const hearts = $("hearts"), puff = ["💕","💖","✨","🌸"];
  function spawnHeart() {
    const h = document.createElement("div");
    h.textContent = puff[Math.floor(Math.random() * puff.length)];
    h.style.cssText = `position:absolute;left:${35 + Math.random()*30}%;top:${25 + Math.random()*25}%;font-size:${0.8+Math.random()*0.5}rem;pointer-events:none;animation:heartPuff 1s ease-out forwards`;
    hearts.appendChild(h); setTimeout(() => h.remove(), 1050);
  }

  // ---- background floaties ----
  const sky = $("sky"), cuties = ["🌸","✨","💗","☁️","🎀","⭐","🫧"];
  for (let i = 0; i < 12; i++) {
    const s = document.createElement("div"); s.className = "float"; s.textContent = cuties[i % cuties.length];
    s.style.left = Math.random()*100 + "%"; s.style.fontSize = (0.9+Math.random()*1.2)+"rem";
    s.style.animationDuration = (9+Math.random()*9)+"s"; s.style.animationDelay = (-Math.random()*12)+"s";
    sky.appendChild(s);
  }

  renderAngle();
</script>

<style>
  @keyframes heartPuff{0%{opacity:0;transform:translateY(0) scale(.5)}25%{opacity:1}100%{opacity:0;transform:translateY(-40px) scale(1.15) rotate(12deg)}}
</style>
</body>
</html>
