<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffd9ec">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Servo Buddy ♡</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Gaegu:wght@400;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  :root{--ink:#8a5a76}
  body{
    font-family:"Fredoka",system-ui,sans-serif;color:var(--ink);
    min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:space-between;
    padding:calc(env(safe-area-inset-top) + 1.1rem) 1.25rem calc(env(safe-area-inset-bottom) + 1.4rem);
    overflow:hidden;position:relative;
    background:linear-gradient(160deg,#ffe3f1 0%,#f3e2ff 45%,#e2f0ff 100%);
    background-size:200% 200%;animation:bgDrift 18s ease-in-out infinite;
  }
  @keyframes bgDrift{0%,100%{background-position:0% 0%}50%{background-position:100% 100%}}

  .sky{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0}
  .float{position:absolute;bottom:-3rem;font-size:1.4rem;opacity:0;animation:rise linear infinite;filter:drop-shadow(0 2px 4px rgba(255,150,200,.25))}
  @keyframes rise{0%{transform:translateY(0) rotate(0) scale(.7);opacity:0}12%{opacity:.9}88%{opacity:.9}100%{transform:translateY(-112vh) rotate(220deg) scale(1.05);opacity:0}}

  .wrap{position:relative;z-index:1;width:100%;max-width:24rem;display:flex;flex-direction:column;align-items:center;gap:.4rem;flex:1;justify-content:center}
  header{position:relative;z-index:1;text-align:center;margin-top:.2rem}
  .title{font-size:1.5rem;font-weight:700;color:#ff6fb0;text-shadow:0 2px 0 #fff,0 3px 8px rgba(255,120,180,.25)}
  .subtitle{font-family:"Gaegu",cursive;font-size:1rem;color:#b58bd0;margin-top:-.15rem}

  /* mascot */
  .stage{width:min(52vw,12rem);aspect-ratio:1;position:relative;margin:.2rem 0}
  .shadow{position:absolute;left:50%;bottom:-.3rem;width:52%;height:1rem;transform:translateX(-50%);background:radial-gradient(ellipse at center,rgba(180,120,160,.28),rgba(180,120,160,0) 70%);animation:shadowPulse 3s ease-in-out infinite}
  @keyframes shadowPulse{0%,100%{transform:translateX(-50%) scale(1);opacity:.8}50%{transform:translateX(-50%) scale(.86);opacity:.55}}
  .buddy{width:100%;height:100%;transform-origin:50% 82%;transition:transform .18s cubic-bezier(.34,1.6,.5,1);animation:bob 3s ease-in-out infinite}
  .buddy.poke{transform:rotate(16deg)}
  @keyframes bob{0%,100%{translate:0 0}50%{translate:0 -3%}}
  .sparkle-eye{animation:twinkle 2.4s ease-in-out infinite}
  @keyframes twinkle{0%,100%{opacity:.9}50%{opacity:.4}}
  .hearts{position:absolute;inset:0;pointer-events:none}

  /* big CLICK button */
  .clickwrap{position:relative;z-index:1;margin:.3rem 0 .1rem}
  .glow{position:absolute;-inset:0;inset:-18%;border-radius:50%;background:radial-gradient(circle,rgba(255,143,196,.4),rgba(255,143,196,0) 65%);animation:glowPulse 3s ease-in-out infinite;pointer-events:none}
  @keyframes glowPulse{0%,100%{transform:scale(1);opacity:.85}50%{transform:scale(1.1);opacity:1}}
  .click-btn{
    position:relative;width:min(58vw,13.5rem);aspect-ratio:1;border-radius:50%;border:none;cursor:pointer;
    font-family:inherit;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.25rem;
    background:radial-gradient(circle at 34% 28%,#ffe0ef,#ff8fc4 42%,#ff5fa8 72%,#e83c8a 100%);
    box-shadow:0 18px 44px -12px rgba(255,95,168,.7),0 0 0 8px rgba(255,143,196,.14),inset 0 -12px 26px rgba(180,40,110,.4),inset 0 8px 16px rgba(255,255,255,.4);
    transition:transform .1s,box-shadow .2s;user-select:none;
  }
  .click-btn:active{transform:scale(.95);box-shadow:0 8px 22px -8px rgba(255,95,168,.7),0 0 0 4px rgba(255,143,196,.2),inset 0 -6px 16px rgba(180,40,110,.5),inset 0 10px 20px rgba(255,255,255,.3)}
  .click-btn .ic{font-size:2.6rem;line-height:1}
  .click-btn .lbl{font-weight:700;font-size:1.5rem;letter-spacing:.14em}
  .click-btn .sub{font-family:"Gaegu",cursive;font-size:.9rem;opacity:.9;font-weight:400}
  .ring{position:absolute;inset:0;border-radius:50%;border:3px solid rgba(255,95,168,.7);pointer-events:none;opacity:0}
  .ring.fire{animation:pulseRing .6s cubic-bezier(.22,.61,.36,1)}
  @keyframes pulseRing{0%{transform:scale(1);opacity:.8}100%{transform:scale(1.5);opacity:0}}

  .status{position:relative;z-index:1;display:inline-flex;align-items:center;gap:.5rem;padding:.5rem 1.1rem;border-radius:999px;background:rgba(255,255,255,.72);box-shadow:0 6px 16px -6px rgba(255,120,180,.4),inset 0 0 0 1.5px rgba(255,255,255,.9);backdrop-filter:blur(6px);font-size:.85rem;font-weight:600;color:#c76fa0}
  .status .dot{width:.55rem;height:.55rem;border-radius:50%;background:#c9c3d6}
  .status.live .dot{background:#68d391;box-shadow:0 0 8px #7ee0a4;animation:beat 1.6s ease-in-out infinite}
  .status.go .dot{background:#f6a5c6;box-shadow:0 0 8px #ff8fc4;animation:beat .7s ease-in-out infinite}
  @keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.35)}}
  .hint{position:relative;z-index:1;font-family:"Gaegu",cursive;font-size:1rem;color:#b58bd0;text-align:center;min-height:1.2em}
  .auto-toggle{position:relative;z-index:1;display:flex;align-items:center;gap:.8rem;padding:.55rem 1.1rem;border-radius:999px;border:none;cursor:pointer;font-family:inherit;font-weight:600;font-size:.9rem;color:#a06fb0;background:rgba(255,255,255,.66);box-shadow:0 6px 16px -6px rgba(255,120,180,.4),inset 0 0 0 1.5px rgba(255,255,255,.85);backdrop-filter:blur(6px)}
  .auto-toggle:active{transform:scale(.97)}
  .lswitch{width:3rem;height:1.7rem;border-radius:999px;background:#e0d3f0;position:relative;transition:background .3s;flex:0 0 auto}
  .lswitch.on{background:linear-gradient(90deg,#ffb3d6,#ff8fc4)}
  .lswitch::after{content:"";position:absolute;top:.18rem;left:.18rem;width:1.34rem;height:1.34rem;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.25);transition:left .3s cubic-bezier(.34,1.5,.5,1)}
  .lswitch.on::after{left:calc(100% - .18rem - 1.34rem)}
</style>
</head>
<body>
  <div class="sky" id="sky"></div>

  <header>
    <div class="title">Servo Buddy</div>
    <div class="subtitle">tap CLICK — i go, then come back ♡</div>
  </header>

  <div class="wrap">
    <div class="stage">
      <div class="shadow"></div>
      <div class="buddy" id="buddy">
        <svg viewBox="0 0 200 200" width="100%" height="100%" aria-hidden="true">
          <defs>
            <radialGradient id="face" cx="42%" cy="34%" r="72%"><stop offset="0%" stop-color="#fffdfe"/><stop offset="60%" stop-color="#fff2f8"/><stop offset="100%" stop-color="#ffd9ec"/></radialGradient>
            <linearGradient id="ear" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#ffe0ef"/><stop offset="100%" stop-color="#ffbcdd"/></linearGradient>
          </defs>
          <path d="M158 150 q34 4 30 -32 q-3 -22 -20 -20 q14 6 12 24 q-2 22 -22 16 Z" fill="#ffc7e2"/>
          <path d="M56 58 L44 20 L86 44 Z" fill="url(#ear)" stroke="#ffaad3" stroke-width="3" stroke-linejoin="round"/>
          <path d="M144 58 L156 20 L114 44 Z" fill="url(#ear)" stroke="#ffaad3" stroke-width="3" stroke-linejoin="round"/>
          <path d="M60 50 L53 30 L74 42 Z" fill="#ff9ec9"/><path d="M140 50 L147 30 L126 42 Z" fill="#ff9ec9"/>
          <ellipse cx="100" cy="112" rx="66" ry="62" fill="url(#face)" stroke="#ffb3d6" stroke-width="3.5"/>
          <ellipse cx="62" cy="120" rx="12" ry="8" fill="#ffb3d1" opacity=".8"/><ellipse cx="138" cy="120" rx="12" ry="8" fill="#ffb3d1" opacity=".8"/>
          <ellipse cx="78" cy="102" rx="8.5" ry="11" fill="#6b4a63"/><ellipse cx="122" cy="102" rx="8.5" ry="11" fill="#6b4a63"/>
          <circle class="sparkle-eye" cx="81" cy="98" r="3.2" fill="#fff"/><circle class="sparkle-eye" cx="125" cy="98" r="3.2" fill="#fff"/>
          <path d="M96 114 h8 l-4 5 Z" fill="#ff86b8"/>
          <path d="M100 119 q-7 8 -14 3 M100 119 q7 8 14 3" fill="none" stroke="#c76fa0" stroke-width="2.6" stroke-linecap="round"/>
          <g stroke="#e7a9c9" stroke-width="2" stroke-linecap="round" opacity=".8"><path d="M40 108 q-16 -3 -24 -8"/><path d="M40 118 q-17 1 -25 -1"/><path d="M160 108 q16 -3 24 -8"/><path d="M160 118 q17 1 25 -1"/></g>
        </svg>
      </div>
      <div class="hearts" id="hearts"></div>
    </div>

    <div class="clickwrap">
      <div class="glow"></div>
      <button class="click-btn" id="clickBtn" aria-label="click the servo">
        <span class="ic">👆</span>
        <span class="lbl">CLICK</span>
        <span class="sub">go &amp; back</span>
      </button>
      <span class="ring" id="ring"></span>
    </div>

    <div class="status" id="status"><span class="dot"></span><span id="statusText">connecting…</span></div>

    <button class="auto-toggle" id="autoBtn" aria-label="toggle auto click">
      <span>🔁 Auto-click every 30s</span>
      <span class="lswitch" id="lsw"></span>
    </button>
  </div>

  <div class="hint" id="hint">tap the big button to make me click ~</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
  import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js";
  import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";

  const app = initializeApp({
    apiKey: "AIzaSyB8ahT56WbEUaGAymsRNNA-DrfZnUnWIwk",
    authDomain: "test-database-55379.firebaseapp.com",
    databaseURL: "https://test-database-55379-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "test-database-55379"
  });
  const db = getDatabase(app), auth = getAuth(app);
  const cmdRef  = ref(db, "servo/command");   // firmware listens here for "click"
  const autoRef = ref(db, "servo/auto");       // firmware auto-clicks while true

  const $ = id => document.getElementById(id);
  const buddy = $("buddy"), ring = $("ring"), status = $("status"), statusText = $("statusText"), hint = $("hint");
  let authed = false;

  const authReady = new Promise(res => { const u = onAuthStateChanged(auth, x => { if (x) { u(); res(x); } }); });
  signInAnonymously(auth).catch(e => console.warn(e));
  authReady.then(() => { authed = true; setStatus("live", "connected ♡"); });

  function setStatus(cls, txt) { status.className = "status " + cls; statusText.textContent = txt; }

  async function click() {
    if (navigator.vibrate) navigator.vibrate(18);
    ring.classList.remove("fire"); void ring.offsetWidth; ring.classList.add("fire");
    buddy.classList.add("poke"); setTimeout(() => buddy.classList.remove("poke"), 260);
    spawnHeart();
    setStatus("go", "click! going & back ~");
    hint.textContent = "wheee~ 👆";
    try {
      await authReady;
      await set(cmdRef, "click");
      setTimeout(() => { setStatus("live", "connected ♡"); hint.textContent = "tap again anytime ~"; }, 900);
    } catch (e) {
      setStatus("live", "oops, try again");
    }
  }
  $("clickBtn").addEventListener("click", click);

  // ---- auto mode ----
  const autoBtn = $("autoBtn"), lsw = $("lsw");
  let autoOn = false;
  onValue(autoRef, snap => {
    autoOn = snap.val() === true;
    lsw.classList.toggle("on", autoOn);
    if (authed) hint.textContent = autoOn ? "auto on — clicking every 30s ~ ♪" : "tap the big button to make me click ~";
  });
  autoBtn.addEventListener("click", async () => {
    if (navigator.vibrate) navigator.vibrate(12);
    await authReady;
    set(autoRef, !autoOn);   // onValue re-renders
  });

  const hearts = $("hearts"), puff = ["💕","💖","✨","🌸"];
  function spawnHeart() {
    const h = document.createElement("div");
    h.textContent = puff[Math.floor(Math.random() * puff.length)];
    h.style.cssText = `position:absolute;left:${35 + Math.random()*30}%;top:${20 + Math.random()*30}%;font-size:${0.9+Math.random()*0.5}rem;pointer-events:none;animation:heartPuff 1s ease-out forwards`;
    hearts.appendChild(h); setTimeout(() => h.remove(), 1050);
  }

  const sky = $("sky"), cuties = ["🌸","✨","💗","☁️","🎀","⭐","🫧"];
  for (let i = 0; i < 12; i++) {
    const s = document.createElement("div"); s.className = "float"; s.textContent = cuties[i % cuties.length];
    s.style.left = Math.random()*100 + "%"; s.style.fontSize = (0.9+Math.random()*1.2)+"rem";
    s.style.animationDuration = (9+Math.random()*9)+"s"; s.style.animationDelay = (-Math.random()*12)+"s";
    sky.appendChild(s);
  }
</script>

<style>@keyframes heartPuff{0%{opacity:0;transform:translateY(0) scale(.5)}25%{opacity:1}100%{opacity:0;transform:translateY(-40px) scale(1.15) rotate(12deg)}}</style>
</body>
</html>
