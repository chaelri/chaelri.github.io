<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Household Budget 22k</title>
<style>
  :root{
    --paper:#F3EEE4; --ink:#1F2A2E; --muted:#4A565A; --primary:#2F5D50; --shape:#DCE6D5; --accent:#A8341C;
    --line:#D9D2C3; --on-dark:#fff; --card:#fbf8f1; --sage:#DDAE45;
    --s0:1rem; --s1:1.618rem; --s2:2.618rem; --s3:4.236rem; --s4:6.854rem;   /* x1.618 */
    --r1:8px; --r2:13px; --r3:21px;                              /* x1.618 */
    --cols:minmax(0,1fr) 104px 128px 144px;
    --font:"Outfit","Avenir Next",system-ui,-apple-system,"Segoe UI",sans-serif;
  }
  @media(min-width:1024px){html{zoom:.8}} /* house density on desktop; phones stay at 100% */
  *{box-sizing:border-box}
  /* centred with equal breathing room above and below: when the content is shorter than the screen it sits in the middle, when it is taller the top and bottom margins stay equal */
  body{margin:0;background:var(--paper);color:var(--ink);font:400 var(--s0)/1.4 var(--font);min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
  main{width:100%;max-width:1440px;margin:auto;padding:32px 16px}
  @media(min-width:1024px){body{min-height:calc(100vh / .8)}}
  @media(min-width:1100px){main{padding:56px 32px}}
  .num{font-variant-numeric:tabular-nums}
  .muted{color:var(--muted)}

  /* header */
  .top{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:8px}
  h1{font-size:var(--s1);line-height:1;letter-spacing:-.01em;font-weight:700;margin:0}
  .ctl{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  .tgt{display:flex;align-items:center;gap:8px}
  .seg{display:flex;border:1px solid var(--line);border-radius:var(--r1);overflow:hidden}
  button{font:inherit;color:var(--ink);cursor:pointer}
  .seg button{border:0;background:transparent;padding:0 16px;height:40px}
  .seg button[aria-pressed=true]{background:var(--primary);color:var(--on-dark);font-weight:700}
  .btn{border:1px solid var(--line);background:var(--card);border-radius:var(--r1);padding:0 16px;height:40px}
  .btn:hover{border-color:var(--primary)}
  #modeBtn{width:112px;padding:0;display:inline-flex;align-items:center;justify-content:center}
  .ex{display:inline-flex;align-items:center;gap:8px}
  .ex .fld input{width:96px}
  body:not(.present) .pvonly{display:none}
  .sync{color:var(--muted)}
  .btn.on{background:var(--primary);color:var(--on-dark);border-color:var(--primary);font-weight:700}
  button:focus-visible,input:focus-visible,.tog:focus-visible{outline:2px solid var(--primary);outline-offset:2px}

  /* fields: input in edit mode, plain text in present mode */
  .fld{display:inline-flex;align-items:center;justify-content:flex-end}
  .fld input{width:100%;min-width:64px;padding:0 16px;border:1px solid var(--line);border-radius:var(--r1);
             background:var(--paper);color:var(--ink);font:inherit;text-align:right;height:32px}
  .pv{display:none}
  body.present .fld input{display:none}
  body.present .pv{display:inline}
  body.present .edit-only{display:none !important}
  .tgt .fld input{width:128px}

  /* strip */
  .strip{display:grid;gap:16px;grid-template-columns:repeat(2,minmax(0,1fr));margin-bottom:16px}
  @media(min-width:900px){.strip{grid-template-columns:repeat(4,minmax(0,1fr))}}
  .tile{border-radius:var(--r3);padding:16px 24px;display:flex;flex-direction:column;justify-content:center;min-height:104px}
  .tile .k{font-size:var(--s0)}
  .tile .v{font-size:var(--s2);font-weight:700;line-height:1;letter-spacing:-.01em;margin:4px 0}
  .tile .k::after{content:", per month";font-weight:700}
  .tile .s{font-size:var(--s0)}
  .t-ch{background:var(--primary);color:var(--on-dark)}
  .t-ku{background:var(--sage);color:var(--ink)}
  .t-gro{background:var(--ink);color:var(--on-dark)}
  .t-mp{background:var(--accent);color:var(--on-dark)}

  /* layout */
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r3);padding:16px 24px}
  .layout{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
  @media(min-width:1100px){.layout{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);align-items:stretch}}
  .left,.right{display:flex;flex-direction:column}
  h2{font-size:var(--s0);font-weight:700;letter-spacing:.2em;text-transform:uppercase;margin:0 0 16px;color:var(--muted)}

  /* table */
  .rows{flex:1;display:flex;flex-direction:column}
  .row{display:grid;grid-template-columns:var(--cols);column-gap:8px;align-items:center;border-bottom:1px solid var(--line)}
  .row > div{display:flex;align-items:center;min-width:0}
  .row .r{justify-content:flex-end;text-align:right}
  .row.hd{min-height:32px;font-weight:700;color:var(--muted);flex:none}
  .row.hd .cv-h{color:var(--accent)}
  .row.grp{min-height:32px;flex:none;background:var(--shape);border-radius:var(--r1);border-bottom:0;margin-top:8px;padding:0 8px;font-weight:700}
  .row.it{flex:1 0 40px}
  .row.sp{margin-top:8px}
  .row.it > div:first-child{padding-left:8px}
  .row.kid{display:none;flex:1 0 40px}
  .rows.open .row.kid{display:grid}
  .row.kid > div:first-child{padding-left:32px}
  .gone{color:var(--muted);text-decoration:line-through;text-decoration-thickness:1px}
  .row.kid .pv{color:var(--muted)}
  .row.tot{flex:none;min-height:48px;border-bottom:0;font-weight:700}
  .row.tot > div:first-child{padding-left:8px}
  .cov,.cvf .pv{color:var(--accent);font-weight:700}
  .tog{cursor:pointer}
  .tog:hover{background:rgba(0,0,0,.03)}
  .mer{display:inline-flex;align-items:center;gap:8px;margin-left:8px;flex-wrap:wrap}
  .mer .fld input{min-width:0;width:72px;padding:0 8px}
  /* phone: every row is two lines, name + after on top, was + Mama and Papa below */
  @media(max-width:640px){
    .top{align-items:flex-start}
    .ctl{width:100%;gap:8px}
    .tgt{flex:1 1 auto}
    .ctl .btn{flex:1 1 auto;padding:0 12px}
    #modeBtn{flex:0 0 96px;width:96px}
    .card{padding:16px}
    .row{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"n a" "b b" "c c";column-gap:12px;padding:8px 0}
    .row > :nth-child(1){grid-area:n}
    .row > :nth-child(2){grid-area:b}
    .row > :nth-child(3){grid-area:a}
    .row > :nth-child(4){grid-area:c;justify-content:flex-start;text-align:left;padding-left:8px}
    .row > .b{justify-content:flex-start;text-align:left;color:var(--muted);padding-left:8px}
    .row.kid > .b{padding-left:32px}
    .row.tot > .b{padding-left:8px}
    .row > .b::before{content:"was ";white-space:pre}
    .row .cov:empty{display:none}
    .row .cov:not(:empty)::before{content:"Mama and Papa ";font-weight:400;white-space:pre}
    .row.hd > .b,.row.hd > .cv-h,.row.grp > .b{display:none}
    .row.grp{min-height:40px;padding:0 8px}
    .row.it,.row.kid{flex:none;min-height:56px}
    .row.tot{min-height:64px}
    .fld input{height:44px}
    .row .r .fld{width:112px}
    .row > div:first-child{display:block}
    .mer{display:flex;margin:8px 0 0}
    .mer .fld{width:auto}
    .mer .fld input{width:72px}
  }

  /* chart */
  .chart{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:24px;align-content:center}
  .col{display:flex;flex-direction:column;gap:16px;min-width:0}
  .col .pie{flex:1}
  .pie svg{display:block;width:100%;max-width:280px;aspect-ratio:1;margin:0 auto}
  .pie path{stroke:var(--card);stroke-width:3;stroke-linejoin:round}
  .pie text{font:700 14px var(--font);text-anchor:middle;dominant-baseline:central;pointer-events:none}
  .p-ch{fill:var(--primary)} .p-ku{fill:var(--sage)} .p-mp{fill:var(--accent)}
  .lg{list-style:none;margin:16px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
  .lg li{display:grid;grid-template-columns:16px minmax(0,1fr) auto;align-items:center;gap:8px}
  .lg .sw{width:16px;height:16px;border-radius:50%;display:block}
  .lg .sw.p-ch{background:var(--primary)} .lg .sw.p-ku{background:var(--sage)} .lg .sw.p-mp{background:var(--accent)}
  .lg b{font-variant-numeric:tabular-nums}
  .lg em{font-style:normal;color:var(--muted);font-variant-numeric:tabular-nums;margin-left:8px}
  .cl{display:flex;justify-content:space-between;margin-top:auto;padding-top:8px;border-top:1px solid var(--line);gap:8px}
  @media(max-width:640px){.chart{grid-template-columns:1fr;gap:32px}}
  .s-ch{background:var(--primary);color:var(--on-dark)}
  .s-ku{background:var(--sage);color:var(--ink)}
  .s-mp{background:var(--accent);color:var(--on-dark)}
  @media(max-width:640px){.tile .v{font-size:var(--s1)}.tile{padding:16px}}

  /* presentation mode: one line at a time, quick transition */
  #pres{position:fixed;inset:0;z-index:50;background:var(--paper);display:none;flex-direction:column}
  body.presenting{overflow:hidden}
  body.presenting #pres{display:flex}
  .p-bar{height:8px;background:var(--line);flex:none}
  .p-bar i{display:block;height:100%;width:0;background:var(--primary);transition:width .3s cubic-bezier(.2,.8,.2,1)}
  .p-top{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:16px 32px;flex:none}
  .p-top b{font-weight:700}
  .p-main{flex:1;display:flex;align-items:center;justify-content:center;padding:16px 32px;min-height:0}
  .sl{width:100%;max-width:960px;opacity:0;transform:translateY(16px)}
  .sl.in{opacity:1;transform:none;transition:opacity .22s ease-out,transform .22s ease-out}
  .sl.out{opacity:0;transform:translateY(-8px);transition:opacity .12s ease-in,transform .12s ease-in}
  .sl h2{font-size:var(--s2);line-height:.95;letter-spacing:-.01em;font-weight:700;margin:0 0 32px}
  .sl-row{display:flex;align-items:flex-end;gap:32px;flex-wrap:wrap}
  .sl-b{display:flex;flex-direction:column;gap:8px;color:var(--muted)}
  .sl-b .bn{font-size:var(--s3);line-height:.9;font-weight:700;letter-spacing:-.02em}
  .sl-a::before{content:"After";display:block;font-size:var(--s0);font-weight:400;letter-spacing:0;line-height:1.4;margin-bottom:8px;color:var(--muted)}
  .arr{flex:none;color:var(--primary);margin-bottom:8px;display:inline-flex}
  .arr svg{width:48px;height:48px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .pair .sl-b .bn{font-size:var(--s2)}
  .pair .arr svg{width:32px;height:32px}
  .sl-h{display:flex;align-items:center;gap:24px;margin:0 0 32px}
  .sl-h h2{margin:0}
  .ico{flex:none;width:88px;height:88px;border-radius:50%;background:var(--shape);color:var(--primary);display:inline-flex;align-items:center;justify-content:center}
  .ico svg{width:48px;height:48px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .ico.rm{background:var(--line);color:var(--muted)}
  .pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:32px}
  .pair .sl-a{font-size:var(--s3)}
  .pair h3{font-size:var(--s1);margin:0 0 16px;font-weight:700}
  .sl-a{font-size:var(--s4);line-height:.9;font-weight:700;color:var(--primary);letter-spacing:-.02em}
  .sl-a.gone{color:var(--muted)}
  .sl-s{font-size:var(--s1);margin:32px 0 0;color:var(--primary);font-weight:700}
  .sl-s.same{color:var(--muted);font-weight:400}
  .sl-c{display:inline-block;margin-top:32px;background:var(--accent);color:var(--on-dark);border-radius:var(--r2);padding:16px 24px;font-size:var(--s1);font-weight:700}
  .sl-g{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:32px}
  .sl-g .tile{min-height:104px}
  .p-nav{display:flex;justify-content:space-between;gap:16px;padding:16px 32px 32px;flex:none}
  .p-nav .btn{height:48px;min-width:128px;font-weight:700}
  .p-nav .btn.go{background:var(--primary);color:var(--on-dark);border-color:var(--primary)}
  .p-nav .btn[disabled]{opacity:.4;cursor:default}
  @media(max-width:640px){
    .p-top,.p-main,.p-nav{padding-left:16px;padding-right:16px}
    .sl h2{font-size:var(--s1)}
    .sl-a{font-size:var(--s3)}
    .sl-row{gap:16px}
    .sl-b .bn{font-size:var(--s2)}.arr svg{width:32px;height:32px}.pair .sl-b .bn{font-size:var(--s1)}.pair .arr svg{width:24px;height:24px}
    .ico{width:56px;height:56px}.ico svg{width:28px;height:28px}
    .sl-h{gap:16px}
    .pair{gap:16px}.pair .sl-a{font-size:var(--s2)}.pair h3{font-size:var(--s0)}
    .sl-g{grid-template-columns:1fr}
    .p-nav .btn{flex:1;height:48px}
  }
  @media(prefers-reduced-motion:reduce){.sl.in,.sl.out,.p-bar i{transition:none}}
</style>
</head>
<body class="">
<main>
  <div class="top">
    <h1>Household budget</h1>
    <div class="ctl">
      <label class="tgt">Monthly budget <span id="tgtBox"></span></label>
      <span class="sync" id="sync" aria-live="polite"></span>
      <button class="btn" id="reset">Back to default</button>
      <button class="btn" id="copy">Copy summary</button>
      <button class="btn" id="presBtn">Presentation</button>
      <button class="btn" id="modeBtn"></button>
    </div>
  </div>

  <div class="strip">
    <div class="tile t-ch"><div class="k">Charlie</div><div class="v num" id="tCh">0</div><div class="s num" id="sCh"></div></div>
    <div class="tile t-ku"><div class="k">Kuya</div><div class="v num" id="tKu">0</div><div class="s num"><span class="pvonly" id="sKuT"></span><label class="edit-only ex">Extra help <span id="kxBox"></span></label></div></div>
    <div class="tile t-gro"><div class="k">Left for groceries</div><div class="v num" id="tGr">0</div><div class="s" id="sGr"></div></div>
    <div class="tile t-mp"><div class="k">Mama and Papa</div><div class="v num" id="tMp">0</div><div class="s" id="sMp"></div></div>
  </div>

  <div class="layout">
    <section class="card left">
      <div class="rows" id="rows"></div>
    </section>

    <section class="card right">
      <h2>Who pays per month, before and after</h2>
      <div class="chart">
        <div class="col"><div class="pie" id="stB"></div><div class="cl"><b>Before</b><span class="num" id="tB"></span></div></div>
        <div class="col"><div class="pie" id="stA"></div><div class="cl"><b>After</b><span class="num" id="tA"></span></div></div>
      </div>
    </section>
  </div>
</main>

<div id="pres" role="dialog" aria-modal="true" aria-label="Presentation">
  <div class="p-bar"><i id="pBar"></i></div>
  <div class="p-top"><b id="pGrp"></b><span class="muted num" id="pCnt"></span><button class="btn" id="pX">Exit</button></div>
  <div class="p-main"><div class="sl" id="sl"></div></div>
  <div class="p-nav"><button class="btn" id="pBack">Back</button><button class="btn go" id="pNext">Next</button></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, onValue, update, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
const firebaseConfig = {
  apiKey: "AIzaSyB8ahT56WbEUaGAymsRNNA-DrfZnUnWIwk",
  authDomain: "test-database-55379.firebaseapp.com",
  databaseURL: "https://test-database-55379-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "test-database-55379",
  storageBucket: "test-database-55379.firebasestorage.app",
  messagingSenderId: "933688602756",
  appId: "1:933688602756:web:392a3a4ce040cb9d4452d1"
};
const db = getDatabase(initializeApp(firebaseConfig));
const PATH = "budget22k_v1"; // own path, shared by Charlie and Kuya
const vRef = ref(db, PATH + "/v");
const $ = id => document.getElementById(id);
const r2 = n => Math.round(n*100)/100;
const fmt = n => r2(n).toLocaleString('en-PH',{minimumFractionDigits:0,maximumFractionDigits:2});

const DEF = {papa:5000,mama:6040,papaal:0,mamaal:0,daddy:0,lola:0,maint:0,gas:1410,dw:820,mw:800,pldt:900,tax:510.25,rice:1000,kwh:260,rate:13.5,target:22000,ggoal:17333.33,kx:0};
const BEFORE = {papa:5000,mama:6040,papaal:1500,mamaal:1500,daddy:3500,lola:0,maint:0,gas:1410,dw:820,mw:1000,pldt:1900,tax:510.25,rice:1519};
const MER_B = 6000, GROC_B = 17333.33;
const LABEL = {papa:'Papa medicine',mama:'Mama medicine',papaal:'Papa allowance',mamaal:'Mama allowance',daddy:'Daddy pakinabang',lola:'Lola Nanay',maint:'Maintenance',gas:'Gas',dw:'Drinking water',mw:'Manila Water',pldt:'PLDT, now GOMO Fiber',tax:'Land tax and dues',rice:'Rice'};
const KIDS = ['papaal','mamaal','lola','maint'];
const KEY = 'b22kv6';
const store = {
  get(){ try{ return JSON.parse(localStorage.getItem(KEY)||'{}') }catch(e){ return {} } },
  set(o){ try{ localStorage.setItem(KEY,JSON.stringify(o)) }catch(e){} }
};
const saved = store.get();
const ST = Object.assign({}, DEF, saved.v||{});
let mode = 'present';

const fld = (id,label,cls='') => `<span class="fld ${cls}"><input id="${id}" type="text" inputmode="decimal" value="${fmt(ST[id])}" aria-label="${label||LABEL[id]||id}"><span class="pv" id="pv-${id}"></span></span>`;
const cellB = (t,c='') => `<div class="r num b ${c}">${t}</div>`;

function itemRow(k,x=''){
  return `<div class="row it ${x}"><div>${LABEL[k]}</div>${cellB(fmt(BEFORE[k]))}<div class="r">${fld(k)}</div><div class="r num cov" id="cv-${k}"></div></div>`;
}
function grp(name,id){
  return `<div class="row grp"><div>${name}</div><div class="r num b" id="${id}-b"></div><div class="r num" id="${id}-a"></div><div></div></div>`;
}

$('tgtBox').innerHTML = fld('target','Monthly budget');
$('kxBox').innerHTML = fld('kx','Kuya extra help');
$('rows').innerHTML =
  `<div class="row hd"><div>Item, per month</div><div class="r b">Before</div><div class="r">After</div><div class="r cv-h">Mama and Papa</div></div>` +
  grp('Medicine','gM') + itemRow('papa') + itemRow('mama') +
  grp('Bills','gB') + itemRow('gas') + itemRow('dw') + itemRow('mw') + itemRow('pldt') + itemRow('tax') +
  `<div class="row it"><div>Meralco<span class="mer">${fld('kwh','kWh')}<span class="muted">kWh x</span>${fld('rate','rate per kWh')}</span></div>${cellB(fmt(MER_B))}<div class="r num" id="mer-a"></div><div></div></div>` +
  grp('Food','gF') + itemRow('rice') +
  `<div class="row it"><div><b>Groceries</b>&nbsp;<span class="muted">what's left</span></div>${cellB(fmt(GROC_B))}<div class="r num" id="gr-a"></div><div class="r num cov" id="gr-c"></div></div>` +
  `<div class="row it edit-only"><div>Grocery goal&nbsp;<span class="muted">what they want to spend</span></div>${cellB('')}<div class="r">${fld('ggoal','Grocery goal')}</div><div></div></div>` +
  itemRow('daddy','sp') +
  `<div class="row it tog" id="tog" role="button" tabindex="0" aria-expanded="false"><div><span id="tgl">+</span>&nbsp;Removed lines (4)</div><div class="r num b" id="rm-b"></div><div class="r num" id="rm-a"></div><div></div></div>` +
  KIDS.map(k=>`<div class="row kid"><div class="gone">${LABEL[k]}</div>${BEFORE[k]>0 ? cellB(fmt(BEFORE[k]),'gone') : cellB('-')}<div class="r">${fld(k)}</div><div></div></div>`).join('') +
  `<div class="row tot"><div>Total</div><div class="r num b" id="tot-b"></div><div class="r num" id="tot-a"></div><div class="r num cov" id="tot-c"></div></div>`;

const num = id => parseFloat(String($(id).value).replace(/,/g,'')) || 0;
const setCov = (el,v) => { v=r2(Math.max(v,0)); el.textContent = v? fmt(v):''; };
const ids = Object.keys(DEF);

let last = {};
function calc(){
  const v = {}; ids.forEach(k=>v[k]=num(k));
  const mer = v.kwh*v.rate;
  const items = ['papa','mama','papaal','mamaal','daddy','lola','maint','gas','dw','mw','pldt','tax','rice'];
  const A = k => v[k], Bf = k => BEFORE[k];
  const sumA = ks => ks.reduce((a,k)=>a+A(k),0), sumB = ks => ks.reduce((a,k)=>a+Bf(k),0);
  const fixedA = sumA(items) + mer;
  const budget = v.target + v.kx;
  const groc = budget - fixedA;
  const fixedB = sumB(items) + MER_B + GROC_B;

  const gm=['papa','mama'], gb=['gas','dw','mw','pldt','tax'];
  $('gM-b').textContent=fmt(sumB(gm)); $('gM-a').textContent=fmt(sumA(gm));
  $('gB-b').textContent=fmt(sumB(gb)+MER_B); $('gB-a').textContent=fmt(sumA(gb)+mer);
  $('gF-b').textContent=fmt(Bf('rice')+GROC_B); $('gF-a').textContent=fmt(A('rice')+groc);
  $('rm-b').textContent=fmt(sumB(KIDS)); $('rm-b').classList.add('gone'); $('rm-a').textContent = sumA(KIDS)===0 ? 'Removed' : fmt(sumA(KIDS)); $('rm-a').style.color = sumA(KIDS)===0 ? 'var(--muted)' : '';
  $('mer-a').textContent=fmt(mer);
  $('gr-a').innerHTML=`<b>${fmt(groc)}</b>`;

  const daddyBase = Math.max(Bf('daddy')-A('daddy'),0);
  ['papa','mama','gas','dw','mw','pldt','tax','rice'].forEach(k=>$('cv-'+k).textContent='');
  const gcov = Math.max(v.ggoal - groc, 0);
  const surplus = Math.max(groc - v.ggoal, 0);   // help beyond the grocery goal goes to Daddy next
  const daddyCov = Math.max(daddyBase - surplus, 0);
  setCov($('cv-daddy'),daddyCov); setCov($('gr-c'),gcov);
  const coverTotal = daddyCov + gcov;

  const totalA = fixedA + Math.max(groc,0);
  $('tot-b').textContent=fmt(fixedB); $('tot-a').textContent=fmt(totalA); $('tot-c').textContent=fmt(coverTotal);

  const each = v.target/2, eb = fixedB/2;
  $('tCh').textContent=fmt(each); $('tKu').textContent=fmt(each+v.kx);
  $('sCh').textContent='was '+fmt(eb); $('sKuT').textContent = v.kx>0 ? 'includes '+fmt(v.kx)+' extra help' : 'was '+fmt(eb);
  $('tGr').textContent=fmt(groc);
  $('sGr').textContent = groc<0 ? 'over budget' : groc>=v.ggoal ? 'covers the '+fmt(v.ggoal)+' grocery goal' : 'of the '+fmt(budget)+' a month';
  $('tMp').textContent=fmt(coverTotal);
  $('sMp').textContent = (daddyCov>0 ? 'Daddy '+fmt(daddyCov) : '') + (daddyCov>0&&gcov>0 ? ' + ' : '') + (gcov>0 ? 'groceries '+fmt(gcov) : '') || 'Nothing to cover';

  const afterAll = budget + coverTotal;
  // pie charts: Before / After, same colours as the tiles (Charlie, Kuya, Mama and Papa)
  const pie = (cls, parts) => {
    const list = parts.filter(p => p.val > 0), total = list.reduce((a, p) => a + p.val, 0);
    if (!total) return '<p class="muted">Nothing to show</p>';
    const R = 96, C = 100, pt = (ang, rad) => [C + rad * Math.sin(ang), C - rad * Math.cos(ang)];
    let ang = 0, paths = '', texts = '';
    list.forEach(p => {
      const frac = p.val / total, a0 = ang, a1 = ang + frac * Math.PI * 2; ang = a1;
      if (list.length === 1) paths += `<circle cx="${C}" cy="${C}" r="${R}" class="${p.c}" stroke="var(--card)" stroke-width="3"><title>${p.name} ${fmt(p.val)}</title></circle>`;
      else { const [x0, y0] = pt(a0, R), [x1, y1] = pt(a1, R); paths += `<path class="${p.c}" d="M${C} ${C} L${x0.toFixed(2)} ${y0.toFixed(2)} A${R} ${R} 0 ${frac > .5 ? 1 : 0} 1 ${x1.toFixed(2)} ${y1.toFixed(2)} Z"><title>${p.name} ${fmt(p.val)}</title></path>`; }
      if (frac >= .07) { const [tx, ty] = pt((a0 + a1) / 2, list.length === 1 ? 0 : R * .6); texts += `<text x="${tx.toFixed(1)}" y="${ty.toFixed(1)}" fill="${p.ink}">${Math.round(frac * 100)}%</text>`; }
    });
    const legend = list.map(p => `<li><i class="sw ${p.c}"></i><span>${p.name}</span><span><b>${fmt(p.val)}</b><em>${Math.round(p.val / total * 100)}%</em></span></li>`).join('');
    return `<svg viewBox="0 0 200 200" role="img" aria-label="${list.map(p => p.name + ' ' + Math.round(p.val / total * 100) + '%').join(', ')}">${paths}${texts}</svg><ul class="lg">${legend}</ul>`;
  };
  const W_ = 'var(--on-dark)', K_ = 'var(--ink)';
  $('stB').innerHTML = pie('b', [{c:'p-ch', name:'Charlie', val:eb, ink:W_}, {c:'p-ku', name:'Kuya', val:eb, ink:K_}]);
  $('stA').innerHTML = pie('a', [{c:'p-ch', name:'Charlie', val:each, ink:W_}, {c:'p-ku', name:'Kuya', val:each + v.kx, ink:K_}, {c:'p-mp', name:'Mama and Papa', val:coverTotal, ink:W_}]);
  $('tB').textContent=fmt(fixedB); $('tA').textContent=fmt(afterAll);

  document.querySelectorAll('.fld').forEach(f=>{ const i=f.querySelector('input'); f.querySelector('.pv').textContent = (KIDS.includes(i.id) && num(i.id)===0) ? 'Removed' : fmt(num(i.id)); });

  const vv={}; ids.forEach(k=>vv[k]=v[k]);
  store.set({v:vv});
  last = {v,mer,groc,daddyCov,gcov,coverTotal,afterAll,fixedB,each};
}

function summary(){
  const {v,mer,groc,daddyCov,gcov,coverTotal,each} = last;
  const L = [];
  L.push(`Monthly budget ${fmt(v.target+v.kx)}: Charlie ${fmt(each)} + Kuya ${fmt(each+v.kx)}`);
  L.push(`Left for groceries: ${fmt(groc)}`);
  L.push(`Mama and Papa: ${fmt(coverTotal)} (Daddy pakinabang ${fmt(daddyCov)} + groceries ${fmt(gcov)})`);
  L.push('');
  const line = (n,b,a)=>{ if(b>0||a>0) L.push(`${n}: ${fmt(b)} -> ${fmt(a)}`); };
  Object.keys(BEFORE).forEach(k=>line(LABEL[k],BEFORE[k],v[k]));
  line('Meralco',MER_B,mer); line('Groceries',GROC_B,groc);
  return L.join('\n');
}

function setMode(m){
  mode = m; document.body.classList.toggle('present', m==='present');
  const b = $('modeBtn');
  b.classList.toggle('on', m==='edit');
  b.innerHTML = m==='edit' ? '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="vertical-align:-2px;margin-right:8px"><path d="M3 8.5l3.5 3.5L13 4.5"/></svg>Check' : 'Edit';
  b.setAttribute('aria-label', m==='edit' ? 'Check, back to presenting view' : 'Edit the numbers');
}
function toggleKids(){
  const o = $('rows').classList.toggle('open');
  $('tgl').textContent = o ? '-' : '+'; $('tog').setAttribute('aria-expanded', o);
}

document.querySelectorAll('.fld input').forEach(i=>{
  i.addEventListener('input',()=>{ calc(); mark(i.id); });
  i.addEventListener('blur',()=>{ i.value = fmt(num(i.id)); calc(); });
  i.addEventListener('focus',()=>i.select());
});

/* presentation mode */
let steps = [], si = 0, busy = false;
const P = d => `<svg viewBox="0 0 24 24" aria-hidden="true">${d}</svg>`;
const ICON = {
  med:P('<rect x="1.500" y="8" width="21" height="8" rx="4" transform="rotate(-45 12 12)"/><path d="M8.500 8.500l7 7"/>'),
  gas:P('<path d="M12 2.500c1 3 5 5.500 5 10a5 5 0 0 1-10 0c0-2 1-3 2-4 .3 1.500 1 2 1.800 2.200C10.500 8 11 5 12 2.500z"/><path d="M9.500 20.500h5"/>'),
  dw:P('<path d="M12 3s6 6.2 6 10.5A6 6 0 0 1 6 13.5C6 9.2 12 3 12 3z"/>'),
  mw:P('<path d="M5 8h9a3 3 0 0 1 3 3v1"/><path d="M8 8V5h4"/><path d="M17 15s2 2.2 2 3.5a2 2 0 0 1-4 0c0-1.300 2-3.500 2-3.500z"/><path d="M5 8v3"/>'),
  pldt:P('<path d="M2.500 9a14 14 0 0 1 19 0"/><path d="M5.500 12.500a9.500 9.500 0 0 1 13 0"/><path d="M9 16a5 5 0 0 1 6 0"/><circle cx="12" cy="19.500" r=".8"/>'),
  tax:P('<path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/>'),
  mer:P('<path d="M13 2L4 14h7l-1 8 9-12h-7z"/>'),
  rice:P('<path d="M3 12h18a9 9 0 0 1-18 0z"/><path d="M8 21h8"/><path d="M8 9c0-2 1-3 2-4M12 9c0-2 1-3 2-4M16 9c0-2 1-3 2-4"/>'),
  cart:P('<path d="M3 4h2.500l2.200 11h10.500l2-8H6.500"/><circle cx="9" cy="19.500" r="1.200"/><circle cx="17" cy="19.500" r="1.200"/>'),
  dad:P('<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>'),
  rm:P('<path d="M6 6l12 12M18 6L6 18"/>')
};
const ARR = '<svg viewBox="0 0 24 24"><path d="M4 12h16M14 6l6 6-6 6"/></svg>';
const ico = (k,c='') => `<span class="ico ${c}">${ICON[k]}</span>`;
function buildSteps(){
  const {v,mer,groc,daddyCov,gcov,coverTotal,each,fixedB} = last;
  const out = [{g:'Overview', kind:'intro'}];
  const item = (g,name,b,a,cov,removed,ic) => out.push({g,kind:'item',name,b,a,cov,removed,ic});
  out.push({g:'Medicine',kind:'pair',ic:'med',items:[{name:'Papa',b:BEFORE.papa,a:v.papa},{name:'Mama',b:BEFORE.mama,a:v.mama}]});
  ['gas','dw','mw','pldt','tax'].forEach(k=>item('Bills',k==='gas'?'Gas, for cooking':LABEL[k],BEFORE[k],v[k],0,false,k));
  item('Bills','Meralco',MER_B,mer,0,false,'mer');
  item('Food',LABEL.rice,BEFORE.rice,v.rice,0,false,'rice');
  item('Food','Groceries, what is left',GROC_B,groc,gcov,false,'cart');
  item('Mama and Papa',LABEL.daddy,BEFORE.daddy,v.daddy,daddyCov,false,'dad');
  ['papaal','mamaal'].forEach(k=>item('Removed',LABEL[k],BEFORE[k],v[k],0,v[k]===0,'rm'));
  out.push({g:'Summary',kind:'end'});
  return out;
}
function slideHTML(s){
  const {v,groc,daddyCov,gcov,coverTotal,each,fixedB,afterAll} = last;
  if(s.kind==='intro') return `<h2>Monthly budget</h2><div class="sl-row"><div class="sl-b"><span>Before</span><span class="num bn">${fmt(fixedB)}</span></div><span class="arr" aria-hidden="true">${ARR}</span><div class="sl-a num" data-v="${v.target+v.kx}">${fmt(v.target+v.kx)}</div></div>
    <div class="sl-g"><div class="tile t-ch"><div class="k">Charlie</div><div class="v num">${fmt(each)}</div></div><div class="tile t-ku"><div class="k">Kuya</div><div class="v num">${fmt(each+v.kx)}</div></div><div class="tile t-mp"><div class="k">Mama and Papa</div><div class="v num">${fmt(coverTotal)}</div></div></div>`;
  if(s.kind==='end') return `<h2>Mama and Papa cover</h2><div class="sl-row"><div class="sl-a num" style="color:var(--accent)" data-v="${coverTotal}">${fmt(coverTotal)}</div></div>
    <p class="sl-s same">${[daddyCov>0?'Daddy pakinabang '+fmt(daddyCov):'',gcov>0?'groceries '+fmt(gcov):''].filter(Boolean).join(' + ')||'Nothing to cover'} a month</p>
    <div class="sl-g"><div class="tile t-ch"><div class="k">Charlie</div><div class="v num">${fmt(each)}</div></div><div class="tile t-ku"><div class="k">Kuya</div><div class="v num">${fmt(each+v.kx)}</div></div><div class="tile t-gro"><div class="k">Left for groceries</div><div class="v num">${fmt(groc)}</div></div></div>`;
  const dnote = (b,a) => { const d = r2(b-a); return d>0 ? 'Saves '+fmt(d)+' a month' : d<0 ? 'Up '+fmt(-d)+' a month' : 'No change'; };
  if(s.kind==='pair') return `<div class="sl-h">${ico(s.ic)}<h2>${s.g}</h2></div><div class="pair">${s.items.map(i=>`<div><h3>${i.name}</h3><div class="sl-row"><div class="sl-b"><span>Before</span><span class="num bn">${fmt(i.b)}</span></div><span class="arr" aria-hidden="true">${ARR}</span><div class="sl-a num" data-v="${i.a}">${fmt(i.a)}</div></div><p class="sl-s ${r2(i.b-i.a)===0?'same':''}">${dnote(i.b,i.a)}</p></div>`).join('')}</div>`;
  const diff = r2(s.b - s.a);
  const note = s.removed ? 'Removed' : diff>0 ? 'Saves '+fmt(diff)+' a month' : diff<0 ? 'Up '+fmt(-diff)+' a month' : 'No change';
  return `<div class="sl-h">${ico(s.ic,s.removed?'rm':'')}<h2>${s.name}</h2></div><div class="sl-row"><div class="sl-b"><span>Before</span><span class="num bn">${fmt(s.b)}</span></div><span class="arr" aria-hidden="true">${ARR}</span>${s.removed?'<div class="sl-a gone">Removed</div>':`<div class="sl-a num" data-v="${s.a}">${fmt(s.a)}</div>`}</div>
    ${s.cov>0?'':`<p class="sl-s ${diff===0&&!s.removed?'same':''}">${s.removed?'Saves '+fmt(s.b)+' a month':note}</p>`}${s.cov>0?`<div class="sl-c">Mama and Papa ${fmt(s.cov)}</div>`:''}`;
}
function countUp(el){
  const to = parseFloat(el.dataset.v); if(!(to>0) || matchMedia('(prefers-reduced-motion:reduce)').matches) return;
  const t0 = performance.now(), D = 420;
  const f = t => { const p = Math.min((t-t0)/D,1), e = 1-Math.pow(1-p,3); el.textContent = fmt(to*e); if(p<1) requestAnimationFrame(f); else el.textContent = fmt(to); };
  requestAnimationFrame(f);
}
function showStep(n, instant){
  si = n; const s = steps[si], sl = $('sl');
  const paint = () => {
    sl.innerHTML = slideHTML(s);
    $('pGrp').textContent = s.g; $('pCnt').textContent = (si+1)+' / '+steps.length;
    $('pBar').style.width = ((si+1)/steps.length*100)+'%';
    $('pBack').disabled = si===0; $('pNext').textContent = si===steps.length-1 ? 'Done' : 'Next';
    sl.classList.remove('out'); void sl.offsetWidth; sl.classList.add('in');
    sl.querySelectorAll('.sl-a[data-v]').forEach(countUp);
    busy = false;
  };
  if(instant){ paint(); return; }
  busy = true; sl.classList.remove('in'); sl.classList.add('out'); setTimeout(paint,120);
}
function openPres(){ calc(); steps = buildSteps(); document.body.classList.add('presenting'); showStep(0,true); }
function closePres(){ document.body.classList.remove('presenting'); $('sl').className='sl'; $('presBtn').focus(); }
function pNext(){ if(busy) return; if(si>=steps.length-1) closePres(); else showStep(si+1); }
function pBack(){ if(busy||si===0) return; showStep(si-1); }
$('presBtn').onclick=openPres; $('pX').onclick=closePres; $('pNext').onclick=pNext; $('pBack').onclick=pBack;
document.addEventListener('keydown',e=>{
  if(!document.body.classList.contains('presenting')) return;
  if(e.key==='Escape'){ closePres(); }
  else if(['ArrowRight','ArrowDown','PageDown',' ','Enter'].includes(e.key)){ e.preventDefault(); pNext(); }
  else if(['ArrowLeft','ArrowUp','PageUp','Backspace'].includes(e.key)){ e.preventDefault(); pBack(); }
});
$('modeBtn').onclick=()=>setMode(mode==='edit'?'present':'edit');
$('tog').onclick=toggleKids; $('tog').onkeydown=e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); toggleKids(); } };
$('copy').onclick=async()=>{
  const b=$('copy'), t=b.textContent;
  try{ await navigator.clipboard.writeText(summary()); b.textContent='Copied'; }catch(e){ b.textContent='Copy failed'; }
  setTimeout(()=>b.textContent=t,1500);
};

/* ---- sync with Firebase (own path only) ---- */
const status = $('sync');
let dirty = {}, timer = null, applying = false, hadRemote = false, armed = false;
function flush(){
  const d = dirty; dirty = {}; timer = null;
  status.textContent = 'Saving';
  update(vRef, d).then(()=>{ status.textContent = 'Saved'; }).catch(()=>{ status.textContent = 'Offline, kept on this device'; });
}
function mark(id){ if(applying) return; dirty[id] = num(id); clearTimeout(timer); timer = setTimeout(flush,400); }
function applyState(r){
  applying = true;
  ids.forEach(k=>{
    const el = $(k); if(!el || document.activeElement===el || (k in dirty)) return;
    const val = r[k]!=null ? r[k] : DEF[k];
    if(num(k)!==val) el.value = fmt(val);
  });
  applying = false; calc();
}
onValue(vRef, snap=>{
  const r = snap.val();
  if(r){ hadRemote = true; applyState(r); status.textContent = 'Synced'; }
  else if(hadRemote){ hadRemote = false; applyState(DEF); status.textContent = 'Synced'; }
  else status.textContent = 'Synced';
}, ()=>{ status.textContent = 'Offline, kept on this device'; });

$('reset').onclick = async ()=>{
  const b = $('reset');
  if(!armed){ armed = true; b.textContent = 'Tap again to reset'; setTimeout(()=>{ armed = false; b.textContent = 'Back to default'; },3000); return; }
  armed = false; b.textContent = 'Back to default';
  try{ localStorage.removeItem(KEY) }catch(e){}
  try{ await remove(vRef) }catch(e){}
  location.reload();
};
calc(); setMode(mode);
</script>
</body>
</html>
