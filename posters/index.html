<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Poster Gallery</title>
<style>
:root{--paper:#EDE9E0;--ink:#16130F;--muted:#5C564C;--card:#FFFFFF;--gold:#D9B96A;--line:#CFC8BA}
@media(prefers-color-scheme:dark){:root{--paper:#14110F;--ink:#EDEAE2;--muted:#A59E92;--card:#1D1915;--line:#332D26}}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.4 system-ui,-apple-system,sans-serif}
.wrap{max-width:1160px;margin:0 auto;padding:48px 16px 64px}
h1{font:700 38px/.95 Georgia,'Times New Roman',serif;letter-spacing:-.01em;margin:0 0 24px}
h2{font:700 24px/1.1 Georgia,serif;margin:0 0 8px}
.sec{margin-top:56px}.sec p{margin:0 0 24px;color:var(--muted);max-width:60ch}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:24px}
.card{display:block;background:var(--card);border:1px solid var(--line);border-radius:13px;overflow:hidden;color:inherit;text-decoration:none;padding:0;text-align:left;cursor:pointer;font:inherit}
.card img{display:block;width:100%;aspect-ratio:4/5;object-fit:cover}
.card .m{padding:16px;display:flex;justify-content:space-between;gap:8px;font-size:15px}
.card .m span{color:var(--muted)}
.card.final{outline:3px solid var(--gold);outline-offset:-3px}
.card:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.pick{align-self:flex-start;background:var(--gold);color:#16130F;border-radius:999px;padding:0 8px;font-weight:700;font-size:12px;line-height:24px;white-space:nowrap}
dialog{border:0;padding:0;background:transparent;max-width:100vw;max-height:100vh;width:100%;height:100%}
dialog::backdrop{background:rgba(10,8,6,.9)}
.lb{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:16px}
.lb img{max-height:calc(100vh - 128px);max-width:100%;border-radius:8px;display:block}
.bar{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.bar button,.bar a{height:40px;padding:0 24px;border-radius:999px;border:1px solid #EDEAE2;background:transparent;color:#EDEAE2;font:700 15px system-ui;text-decoration:none;display:inline-flex;align-items:center;cursor:pointer}
.bar .dl{background:var(--gold);border-color:var(--gold);color:#16130F}
.bar :focus-visible{outline:3px solid #fff;outline-offset:3px}
.cap{color:#EDEAE2;font-size:15px}
</style></head><body>
<main class="wrap"><h1>Poster gallery</h1><div id="root"></div></main>
<dialog id="dlg"><div class="lb"><img id="big" alt=""><div class="cap" id="cap"></div>
<div class="bar"><button id="pv">Back</button><button id="nx">Next</button><a id="dl" class="dl" download>Download HD</a><button id="cl">Close</button></div></div></dialog>
<script src="posters.js"></script>
<script>
const root=document.getElementById('root'),dlg=document.getElementById('dlg');let list=[],i=0;
POSTERS.slice().sort((a,b)=>b.date.localeCompare(a.date)).forEach(p=>{
 const s=document.createElement('section');s.className='sec';
 s.innerHTML=`<h2>${p.title}</h2><p>${p.event}. ${p.note}</p><div class="grid"></div>`;
 const g=s.querySelector('.grid'),base=`posters/${p.slug}/`;
 p.items.forEach((it,n)=>{const b=document.createElement('button');b.className='card'+(it.final?' final':'');
  b.innerHTML=`<img loading="lazy" src="${base}thumb/${it.file}.jpg" alt="${p.title}, ${it.label}, ${it.colour}"><div class="m"><div>${it.label}<br><span>${it.colour}</span></div>${it.final?'<b class="pick">Chosen</b>':''}</div>`;
  b.onclick=()=>{list=p.items.map(x=>({...x,full:`${base}full/${x.file}.png`,t:p.title}));i=n;show();dlg.showModal()};g.appendChild(b)});
 root.appendChild(s)});
function show(){const x=list[i];big.src=x.full;big.alt=`${x.t}, ${x.label}`;cap.textContent=`${x.t} / ${x.label} / ${x.colour}`;dl.href=x.full;dl.download=x.file+'.png'}
pv.onclick=()=>{i=(i+list.length-1)%list.length;show()};nx.onclick=()=>{i=(i+1)%list.length;show()};cl.onclick=()=>dlg.close();
addEventListener('keydown',e=>{if(!dlg.open)return;if(e.key==='ArrowLeft')pv.click();if(e.key==='ArrowRight')nx.click()});
dlg.addEventListener('click',e=>{if(e.target===dlg)dlg.close()});
</script></body></html>
