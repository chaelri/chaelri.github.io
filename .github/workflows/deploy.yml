name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Inject API keys
        run: |
          echo "window.GOOGLE_TTS_KEY = '${{ secrets.GOOGLE_TTS_KEY }}';" > devo/config.js

      # Pages aborts after 10 min of syncing files; keep the artifact small.
      - name: Stage site
        run: |
          rsync -a --exclude='.git' --exclude='.github' --exclude='_site' \
            --exclude='devo-mobile/' \
            --exclude='elevate-eo-campus-unite-2026/assets/tickets/' \
            --exclude='elevate-eo-campus-unite-2026/assets/tickets-all.zip' \
            --exclude='elevate-eo-campus-unite-2026/assets/print-tickets.pdf' \
            ./ _site/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
      - uses: actions/deploy-pages@v4
        id: deployment
