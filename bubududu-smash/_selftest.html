<!DOCTYPE html><html><head><meta charset="utf-8"><title>booting</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">
<style>html,body{margin:0;background:#8fd4ff}canvas{display:block}</style></head>
<body><canvas id="stage"></canvas><canvas id="scene" hidden></canvas>
<pre id="out" style="color:#063;font:12px monospace;position:fixed;bottom:0;left:0;background:rgba(255,255,255,.75)"></pre>
<script type="module">
/*
 * Headless smoke test. Title says SELFTEST OK / SELFTEST FAIL so it greps.
 *
 * Two things this has to do that the first version did not:
 *
 *   - ASSERT ON SWALLOWED DRAW FAULTS. render.js isolates each layer so one
 *     bad number cannot take the frame down. That also means a broken layer no
 *     longer reaches window.onerror, so a test that only listens there will
 *     cheerfully pass on a renderer throwing sixty times a second. It is
 *     exactly how five deleted colour helpers went unnoticed.
 *   - EXERCISE THE THINGS THAT ACTUALLY BREAK. Coins, the fairy, the squad,
 *     the betrayal, the punch, every power-up glyph, and a generated arena
 *     rather than the one authored map.
 */
const log=[]; const fail=(w,e)=>log.push(`FAIL ${w}: ${e&&e.stack?e.stack.split('\n')[0]:e}`);
window.onerror=(m,s,l,c,e)=>fail('window', e||m);
window.onunhandledrejection=(e)=>fail('promise', e.reason);

try {
  const [levels, physics, render, config, chars] = await Promise.all([
    import('./js/levels.js'), import('./js/physics.js'), import('./js/render.js'),
    import('./js/config.js'), import('./js/characters.js')]);
  const { makeArena, readLevel, solidGrid } = levels;
  const { makeActor, stepActor, kill } = physics;
  const { createRenderer, createScene, draw, drawScene, resize, resizeScene, faults, clearFaults } = render;
  const { PLAYERS, FEEL, POWER_ORDER, POWERUPS, GLYPH, SQUAD, DIWATA, COINS, HELPER, BAD_HELPER } = config;
  const { preloadCharacters, CHARACTERS, charById } = chars;

  preloadCharacters();
  await new Promise(r=>setTimeout(r,900)); // let the sprite sheets land

  const r = createRenderer(document.getElementById('stage'));
  resize(r, 1600, 900);

  /* ---------------------------------------------------- generated arenas --- */
  // The generator is validated (mirrored, reachable) inside makeArena; this
  // only proves it answers, never falls back, and never repeats itself.
  let fellBack = 0; const seen = new Set();
  for (let i=0;i<300;i++){
    const lv = makeArena((i*7919)|0);
    if (!lv.id.startsWith('tapakan-gen')) fellBack++;
    seen.add(lv.rows.join('|'));
    for (const row of lv.rows) {
      const norm = t => t.replace(/[AB]/g,'S');
      if (norm(row) !== norm([...row].reverse().join(''))) { fail('mirror', 'seed '+i+' row '+row); break; }
    }
  }
  log.push(`arenas    ok — 300 generated, ${fellBack} fell back, ${seen.size} distinct`);

  /* ------------------------------------------------------------- a round --- */
  function build(ci=0) {
    const level = makeArena(); const meta = readLevel(level);
    const g = { mode:'tapakan', level, meta, grid: solidGrid(level),
      time: 0, shrink: 0, powers: [], shots: [], bursts: [], pops: [], lostHearts: [],
      coins: [], minis: [], helper: null, freeze: 0, slow: 0,
      actors: PLAYERS.map((p,i)=>{
        const a = makeActor(meta.spawns[i].x, meta.spawns[i].y, p.id);
        a.char = ['yhon','bubu'][(i+ci)%2]; a.tint = p.colour; a.label = p.name;
        a.hp = FEEL.hp; a.coins = 0; return a; }) };
    return g;
  }

  let worst=0,total=0,frames=0;
  const g = build();
  const opts = { versus: true, onStomp:(a,v)=>kill(v,{}) };

  // Everything that has its own draw path, on screen at once. If any of these
  // throws, the layer swallows it and faults() is the only place it shows up.
  POWER_ORDER.forEach((t,i)=> g.powers.push({ x: 8+i*3, y: 11.4, type:t, born:-1 }));
  for (let i=0;i<COINS.onField;i++) g.coins.push({ x: 10+i*2.5, y: 12.4, at:0, taken:0 });
  g.coins.push({ x: 20, y: 12.4, at:0, taken:0.001, n:3, by:'p1', milestone:false });
  g.coins.push({ x: 24, y: 12.4, at:0, taken:0.001, n:10, by:'p2', milestone:true });
  g.pops.push({ x: 18, y: 11, at: 0, colour: COINS.colour, glyph: '★' });
  g.bursts.push({ x: 19, y: 11, at: 0, colour: '#ff4d6d', big: true });
  g.lostHearts.push({ x: 19, y: 10, vx:1, vy:-4, rot:0, spin:2, at:0, index:1 });
  g.shots.push({ x: 16, y: 11, vx: 9, vy: 0, owner: 'p1', life: 1 });

  // helpers: Dudu hunting, and the same one mid-betrayal
  const mk = (id) => { const a = makeActor(14, 12, id); a.hp = 99; return a; };
  g.helper = { actor: mk('dudu'), ally:'p1', until: 9, hardUntil: 40, wanderDir:1,
    jumpAt:0, pause:0, locked:true, pouncing:false, leaving:false, waiting:false, wave:0 };

  // the squad, one waiting and one leaving
  for (let i=0;i<SQUAD.count;i++){
    const m = mk('bubu'); m.x = 26+i; m.w *= SQUAD.scale; m.h *= SQUAD.scale;
    g.minis.push({ actor:m, owner: i?null:'p1', home:26+i, until:9, jumpAt:0,
      leaving: i===2, wave: i===2?0.2:0 });
  }

  // a fairy on p1 and a punch in the air on p2
  g.actors[0].fairy = { left:2, next:2, healAt:0, leaving:false, wave:0, phase:1 };
  g.actors[0].glowUntil = 99; g.actors[0].glowColour = COINS.colour;
  g.actors[1].power = { type:'suntok', until: Infinity, ammo: 3 };
  g.actors[1].punch = { at: 0, face: 1, hit: false };

  for (let i=0;i<600;i++) {
    for (const a of g.actors) {
      const dir = Math.sin(i/40 + (a.id==='p2'?2:0));
      stepActor(a, { left: dir<-0.25, right: dir>0.25,
        jumpDown: i%47===(a.id==='p2'?20:0), jumpHeld: (i%47)<14 }, g.grid, 1/120, g.actors, opts);
    }
    g.time += 1/120;
    const t0=performance.now(); draw(r,g,1/120); const ms=performance.now()-t0;
    total+=ms; frames++; if(ms>worst)worst=ms;

    // halfway, flip the helper into a betrayal so that path draws too
    if (i===300) { g.helper.bad = true; g.helper.victim = 'p1';
      g.helper.betrayAt = g.time; g.helper.thrown = false; }
    if (i===480) { g.helper.leaving = true; g.helper.wave = 0; }
  }
  const [a,b] = g.actors;
  log.push(`round     ok — p1 (${a.x.toFixed(1)},${a.y.toFixed(1)}) dead:${a.dead}  p2 (${b.x.toFixed(1)},${b.y.toFixed(1)}) dead:${b.dead}`);
  log.push(`draw      avg ${(total/frames).toFixed(2)}ms worst ${worst.toFixed(2)}ms over ${frames} frames`);

  /* -------------------------------------------------------- the lobby too --- */
  const sc = createScene(document.getElementById('scene'));
  resizeScene(sc, 1600, 900);
  for (let i=0;i<180;i++) drawScene(sc, 1/60);
  log.push(`lobby     ok — ${180} frames`);

  /* ------------------------------------------------------- every glyph set --- */
  const undef = POWER_ORDER.filter(t => !POWERUPS[t]);
  if (undef.length) fail('powerups', 'POWER_ORDER names with no definition: '+undef.join(', '));
  const noGlyph = POWER_ORDER.filter(t => !GLYPH[t]);
  if (noGlyph.length) fail('glyphs', 'spawnable with no glyph (renders "?"): '+noGlyph.join(', '));
  log.push(`powerups  ok — ${POWER_ORDER.length} spawnable, all defined, all have a glyph`);
  log.push(`characters ok — ${CHARACTERS.map(c=>c.id).join(', ')} (+dudu, badudu)`);

  /* ---- the whole point: layers that failed quietly are failures anyway ---- */
  const bad = faults();
  if (bad.length) for (const f of bad) fail('draw layer', f);
  else log.push(`layers    ok — no draw layer threw`);

  // leave a representative frame up
  clearFaults();
  for (let i=0;i<60;i++) draw(r,g,1/60);
} catch(e) { fail('boot', e); }

const bad = log.some(l=>l.startsWith('FAIL'));
document.title = bad ? 'SELFTEST FAIL' : 'SELFTEST OK';
document.getElementById('out').textContent = log.join('\n');
</script></body></html>
