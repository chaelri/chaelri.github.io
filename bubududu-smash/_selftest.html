<!DOCTYPE html><html><head><meta charset="utf-8"><title>booting</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">
<style>html,body{margin:0;background:#8fd4ff}canvas{display:block}</style></head>
<body><canvas id="stage"></canvas><canvas id="scene" hidden></canvas>
<div id="players">
  <div class="pcard" data-p="p1"><canvas class="face" width="132" height="132"></canvas>
    <div class="pinfo"><div class="pname"></div><div class="phearts"></div><div class="pskill"></div><div class="pchips"></div></div></div>
  <div class="pcard right" data-p="p2"><canvas class="face" width="132" height="132"></canvas>
    <div class="pinfo"><div class="pname"></div><div class="phearts"></div><div class="pskill"></div><div class="pchips"></div></div></div>
</div>
<pre id="out" style="color:#063;font:12px monospace;position:fixed;bottom:0;left:0;background:rgba(255,255,255,.75)"></pre>
<script type="module">
/*
 * Headless smoke test. Title says SELFTEST OK / SELFTEST FAIL so it greps.
 *
 * Two things this has to do that the first version did not:
 *
 *   - ASSERT ON SWALLOWED DRAW FAULTS. render.js isolates each layer so one
 *     bad number cannot take the frame down. That also means a broken layer no
 *     longer reaches window.onerror, so a test that only listens there will
 *     cheerfully pass on a renderer throwing sixty times a second. It is
 *     exactly how five deleted colour helpers went unnoticed.
 *   - EXERCISE THE THINGS THAT ACTUALLY BREAK. Coins, the fairy, the squad,
 *     the betrayal, the punch, every power-up glyph, and a generated arena
 *     rather than the one authored map.
 */
const log=[]; const fail=(w,e)=>log.push(`FAIL ${w}: ${e&&e.stack?e.stack.split('\n')[0]:e}`);
window.onerror=(m,s,l,c,e)=>fail('window', e||m);
window.onunhandledrejection=(e)=>fail('promise', e.reason);

try {
  const [levels, physics, render, config, chars, marks] = await Promise.all([
    import('./js/levels.js'), import('./js/physics.js'), import('./js/render.js'),
    import('./js/config.js'), import('./js/characters.js'), import('./js/marks.js')]);
  const { makeArena, readLevel, solidGrid } = levels;
  const { makeActor, stepActor, kill } = physics;
  const { createRenderer, createScene, draw, drawScene, resize, resizeScene, faults, clearFaults } = render;
  const { PLAYERS, FEEL, POWER_ORDER, POWERUPS, SQUAD, DIWATA, COINS, HELPER, BAD_HELPER, ABILITY } = config;
  const { preloadCharacters, CHARACTERS, charById } = chars;

  preloadCharacters();
  await new Promise(r=>setTimeout(r,900)); // let the sprite sheets land

  const r = createRenderer(document.getElementById('stage'));
  resize(r, 1600, 900);

  /* ---------------------------------------------------- generated arenas --- */
  // The generator is validated (mirrored, reachable) inside makeArena; this
  // only proves it answers, never falls back, and never repeats itself.
  let fellBack = 0; const seen = new Set();
  for (let i=0;i<300;i++){
    const lv = makeArena((i*7919)|0);
    if (!lv.id.startsWith('tapakan-gen')) fellBack++;
    seen.add(lv.rows.join('|'));
    for (const row of lv.rows) {
      const norm = t => t.replace(/[AB]/g,'S');
      if (norm(row) !== norm([...row].reverse().join(''))) { fail('mirror', 'seed '+i+' row '+row); break; }
    }
  }
  log.push(`arenas    ok — 300 generated, ${fellBack} fell back, ${seen.size} distinct`);

  /* ------------------------------------------------------------- a round --- */
  function build(ci=0) {
    const level = makeArena(); const meta = readLevel(level);
    const g = { mode:'tapakan', level, meta, grid: solidGrid(level),
      time: 0, shrink: 0, powers: [], shots: [], bursts: [], pops: [], lostHearts: [],
      coins: [], minis: [], helper: null, wildFairy: null, freeze: 0, slow: 0,
      actors: PLAYERS.map((p,i)=>{
        const a = makeActor(meta.spawns[i].x, meta.spawns[i].y, p.id);
        a.char = ['yhon','bubu'][(i+ci)%2]; a.tint = p.colour; a.label = p.name;
        a.hp = FEEL.hp; a.coins = 0; return a; }) };
    return g;
  }

  // Every frame's time, kept, so the summary can report a MEDIAN.
  //
  // The average alone is useless here: one 500ms stall — the tile atlas
  // baking on the first frame, a GC, or this tab being backgrounded by the
  // browser — moves a 0.7ms frame time to 10ms and looks exactly like a
  // rendering regression. The median ignores all three.
  const times=[];
  const g = build();
  const opts = { versus: true, onStomp:(a,v)=>kill(v,{}) };

  // Everything that has its own draw path, on screen at once. If any of these
  // throws, the layer swallows it and faults() is the only place it shows up.
  POWER_ORDER.forEach((t,i)=> g.powers.push({ x: 8+i*3, y: 11.4, type:t, born:-1 }));
  for (let i=0;i<COINS.onField;i++) g.coins.push({ x: 10+i*2.5, y: 12.4, at:0, taken:0 });
  g.coins.push({ x: 20, y: 12.4, at:0, taken:0.001, n:3, by:'p1', milestone:false });
  g.coins.push({ x: 24, y: 12.4, at:0, taken:0.001, n:10, by:'p2', milestone:true });
  g.pops.push({ x: 18, y: 11, at: 0, colour: COINS.colour, glyph: '★' });
  g.bursts.push({ x: 19, y: 11, at: 0, colour: '#ff4d6d', big: true });
  g.lostHearts.push({ x: 19, y: 10, vx:1, vy:-4, rot:0, spin:2, at:0, index:1 });
  g.shots.push({ x: 16, y: 11, vx: 9, vy: 0, owner: 'p1', life: 1 });

  // helpers: Dudu hunting, and the same one mid-betrayal
  const mk = (id) => { const a = makeActor(14, 12, id); a.hp = 99; return a; };
  g.helpers = [];
  const hero = { actor: mk('dudu'), ally:'p1', until: 9, hardUntil: 40, wanderDir:1,
    jumpAt:0, pause:0, locked:true, pouncing:false, leaving:false, waiting:false, wave:0 };
  // A SECOND Dudu, unclaimed, on the field at the same time — which is only
  // possible since a bought one stopped deleting the wild one.
  const stray = { actor: mk('dudu'), ally:null, until: 20, hardUntil: 40, wanderDir:-1,
    jumpAt:0, pause:0, locked:false, pouncing:false, leaving:false, waiting:false, wave:0 };
  stray.actor.x = 34;
  g.helpers.push(hero, stray);

  // the squad, one waiting and one leaving
  for (let i=0;i<SQUAD.count;i++){
    const m = mk('bubu'); m.x = 26+i; m.w *= SQUAD.scale; m.h *= SQUAD.scale;
    g.minis.push({ actor:m, owner: i?null:'p1', home:26+i, until:9, jumpAt:0,
      leaving: i===2, wave: i===2?0.2:0 });
  }

  // a fairy on p1 and a punch in the air on p2 — plus the WILD one, drifting,
  // which is a different draw path with its own ring and spark trail
  g.actors[0].fairy = { left:2, next:2, healAt:0, leaving:false, wave:0, phase:1 };
  g.wildFairy = { x: 20, y: 6, tx: 30, ty: 5, hold: 0, born: 0, until: 40,
                  phase: 0.7, face: 1, leaving: false, wave: 0 };
  g.actors[0].glowUntil = 99; g.actors[0].glowColour = COINS.colour;
  g.actors[1].power = { type:'suntok', until: Infinity, ammo: 3 };
  g.actors[1].punch = { at: 0, face: 1, hit: false };

  for (let i=0;i<600;i++) {
    for (const a of g.actors) {
      const dir = Math.sin(i/40 + (a.id==='p2'?2:0));
      stepActor(a, { left: dir<-0.25, right: dir>0.25,
        jumpDown: i%47===(a.id==='p2'?20:0), jumpHeld: (i%47)<14 }, g.grid, 1/120, g.actors, opts);
    }
    g.time += 1/120;
    const t0=performance.now(); draw(r,g,1/120); const ms=performance.now()-t0;
    times.push(ms);

    // halfway, flip the helper into a betrayal so that path draws too
    if (i===300) { hero.bad = true; hero.victim = 'p1';
      hero.betrayAt = g.time; hero.thrown = false; }
    if (i===480) { hero.leaving = true; hero.wave = 0; }
  }
  const [a,b] = g.actors;
  log.push(`round     ok — p1 (${a.x.toFixed(1)},${a.y.toFixed(1)}) dead:${a.dead}  p2 (${b.x.toFixed(1)},${b.y.toFixed(1)}) dead:${b.dead}`);
  {
    // Drop the first 20 — the atlas, the gradients and the sprite decode all
    // happen once, and none of them is a per-frame cost.
    const warm = times.slice(20).sort((x,y)=>x-y);
    const med = warm[Math.floor(warm.length/2)];
    const p95 = warm[Math.floor(warm.length*0.95)];
    log.push(`draw      median ${med.toFixed(2)}ms  p95 ${p95.toFixed(2)}ms  worst ${warm[warm.length-1].toFixed(2)}ms over ${times.length} frames`);
    if (med > 6) fail('draw', `median frame ${med.toFixed(2)}ms — too slow for a phone`);
  }

  /* -------------------------------------------------------- the lobby too --- */
  const sc = createScene(document.getElementById('scene'));
  resizeScene(sc, 1600, 900);
  for (let i=0;i<180;i++) drawScene(sc, 1/60);
  log.push(`lobby     ok — ${180} frames`);

  /* ------------------------------------------------------- every glyph set --- */
  const undef = POWER_ORDER.filter(t => !POWERUPS[t]);
  if (undef.length) fail('powerups', 'POWER_ORDER names with no definition: '+undef.join(', '));
  /* Every symbol the game asks for has to exist as a drawn path.
   *
   * It used to be a character set in Nunito, and a missing one rendered a
   * visible "?". markSVG() returns an EMPTY STRING for an id it does not
   * know, so a missing mark is now invisible rather than obviously wrong —
   * which is exactly the failure this check was written for in the first
   * place, and why it also covers the panel's own marks and not just the
   * power-ups. */
  const MARK_IDS = [...POWER_ORDER, 'gem', 'plus', 'safe', 'squad', 'dudu',
                    ...CHARACTERS.map(c => ABILITY[c.ability].mark)];
  const noMark = MARK_IDS.filter(t => !marks.MARKS[t] || !marks.markPath(t));
  if (noMark.length) fail('marks', 'asked for with no drawn path (renders nothing): '+noMark.join(', '));
  const emptySVG = MARK_IDS.filter(t => !marks.markSVG(t).includes('<path'));
  if (emptySVG.length) fail('marks', 'no inline svg for: '+emptySVG.join(', '));
  log.push(`marks     ok — ${MARK_IDS.length} drawn, canvas and DOM`);
  log.push(`powerups  ok — ${POWER_ORDER.length} spawnable, all defined`);
  const noAbility = CHARACTERS.filter(c => !c.ability || !ABILITY[c.ability]);
  if (noAbility.length) fail('characters', 'playable with no ability — their fire button does nothing: ' + noAbility.map(c=>c.id).join(', '));
  log.push(`characters ok — ${CHARACTERS.map(c=>`${c.id} (${ABILITY[c.ability].name})`).join(', ')} (+badudu)`);

  /* ------------------------------------------------- the sprites LOADED --- */
  // Not "did we ask for them" but "did the bytes arrive". drawSprite falls back
  // to a pale blob when an image is missing, which looks like a rendering
  // quirk rather than a 404 — that is how every sprite character shipped
  // invisible on /duo/ while Yhon Yhon, who needs no image, hid the problem.
  const wanted = [];
  for (const dir of ['bubu', 'dudu']) {
    for (let i = 1; i <= 6; i++) {
      wanted.push(new Promise((res) => {
        const img = new Image();
        img.onload = () => res(null);
        img.onerror = () => res(`${dir}/${i}.png`);
        img.src = new URL(`../assets/${dir}/${i}.png`, new URL('./js/characters.js', location.href)).href;
      }));
    }
  }
  const missingArt = (await Promise.all(wanted)).filter(Boolean);
  if (missingArt.length) fail('sprites', 'did not load: ' + missingArt.join(', '));
  else log.push(`sprites   ok — ${wanted.length} frames loaded from assets/`);

  /* --------------------------------------------------------- the panels --- */
  // The status chips are the ONLY place several effects are visible at all —
  // frozen, reversed, whose Dudu that is — and on the two-phone build they
  // survive a round trip through packChips/unpackChips before anything is
  // drawn. A chip lost on the wire is an effect the player cannot see.
  const panel = await import('./js/panel.js');
  const rich = {
    id: 'p1', char: 'bubu', hp: 5, coins: 7,
    power: { type: 'baril', ammo: 4, until: Infinity },
    fairy: { left: 2, next: 1, healAt: -1, leaving: false, wave: 0, phase: 0 },
    frozenUntil: 9e9, reversedUntil: 9e9, invulnUntil: 9e9,
  };
  const made = [
    { mark: 'gem', label: '7/10', colour: '#ffc83d', pct: 70, bad: false, bump: true },
    { mark: 'yelo', label: 'frozen', colour: '#7fd4ff', pct: 40, bad: true, bump: false },
    { mark: 'safe', label: 'safe', colour: '#9fd8ff', pct: 10, bad: false, bump: false },
  ];
  const back = panel.unpackChips(panel.packChips(made));
  const same = back.length === made.length &&
    back.every((c, i) => c.label === made[i].label && c.colour === made[i].colour &&
                         c.mark === made[i].mark &&
                         c.pct === made[i].pct && c.bad === made[i].bad && c.bump === made[i].bump);
  if (!same) fail('chips', 'packChips/unpackChips did not round-trip: ' + JSON.stringify(back));

  panel.paintPanels(
    [{ ...rich, id: 'p1', abilityAt: 0, hops: 0, skillN: 3, skillAt: 0 },
     { ...rich, id: 'p2', char: 'yhon', hp: 2, abilityAt: 0, hops: 0, skillN: 3, skillAt: 0 }],
    { p1: back, p2: [] }, 1/60, 99);
  const drawn = document.querySelectorAll('#players [data-p="p1"] .chip').length;
  const hearts = document.querySelectorAll('#players [data-p="p1"] .phearts svg').length;
  /* Captured HERE, beside the others, and not queried further down — the
     skill check below repaints the card with a three-heart actor, so a live
     query at that point is asking about a different fixture. Which is what
     it did, and it failed on a card that was perfectly correct. */
  const heartRows = document.querySelectorAll('#players [data-p="p1"] .phearts .hrow').length;
  const pulsing = document.querySelectorAll('#players [data-p="p1"] .chip.bad').length;
  // ...and the symbol on each chip actually reached the DOM. It is an inline
  // <svg> now, and markSVG() of an id it does not know is an empty string —
  // a chip that quietly loses its icon looks fine and says less.
  const icons = document.querySelectorAll('#players [data-p="p1"] .chip svg.mk').length;
  if (icons !== made.length) fail('panel', `painted ${icons} chip marks, expected ${made.length}`);
  /* And the skill badge, which on a laptop is the ONLY place the move's state
     is shown — there is no pad button there, the move is a key.
     *
     * Checked in BOTH states, and in that order. The rich actor above is
     * deliberately frozen solid to exercise every chip at once, and a frozen
     * player genuinely cannot use their move — so asserting "ready" against
     * that fixture tested nothing and failed correctly. The second paint is a
     * clean actor, which is the one that must light up. */
  const skill = document.querySelector('#players [data-p="p1"] .pskill');
  if (!skill || !skill.querySelector("svg.mk")) fail('panel', 'no skill badge on the card');
  else if (skill.classList.contains("ready")) fail('panel', 'skill badge reads ready while frozen');
  else {
    // skillN, because a bare object has never been through a tick and the
    // charge stack is filled by one. A real actor always has it.
    const clean = { id: 'p1', char: 'bubu', hp: 3, coins: 0, abilityAt: 0, hops: 0,
                    skillN: 3, skillAt: 0 };
    panel.paintPanels([clean, { ...clean, id: 'p2', char: 'dudu' }], { p1: [], p2: [] }, 1/60, 99);
    if (!skill.classList.contains("ready")) fail('panel', 'skill badge never reads ready');
    else log.push(`skill     ok — badge on both cards, spent and ready`);
  }
  if (drawn !== made.length) fail('panel', `painted ${drawn} chips, expected ${made.length}`);
  else if (hearts !== 5) fail('panel', `painted ${hearts} heart slots for hp 5, expected 5`);
  // ...across TWO rows: three you start with, spares beneath. One row that
  // simply grew pushed a five-heart bar off the side of the card.
  else if (heartRows !== 2)
    fail('panel', `five hearts made ${heartRows} row(s), expected 2 — spares belong under, not trailing right`);
  else if (pulsing !== 1) fail('panel', `${pulsing} chips marked bad, expected 1`);
  else log.push(`panel     ok — ${drawn} chips + ${hearts} hearts, round-tripped through the wire`);

  /* ------------------------------------------------------------ the wire --- */
  // The guest phone sees ONLY what survives snapshot() -> hydrate(). Nothing
  // above this line touches that path, which is how a crash in it shipped:
  // an empty helpers list is truthy, so "no Dudu on the field" was rebuilt as
  // one helper made of nothing and hydrate threw — on most frames of most
  // rounds. A throw there means the guest applies no frame at all.
  const net = await import('./js/netstate.js');
  {
    const bad = [];
    const mkBody = (id, x) => { const a = makeActor(x, 10, id); a.char = id === 'dudu' ? 'dudu' : 'bubu'; a.hp = 3; return a; };
    const scene = (helpers, minis) => ({
      time: 3, level: g.level, grid: g.grid, actors: [mkBody('p1', 10), mkBody('p2', 20)],
      powers: [], coins: [], shots: [], bursts: [], pops: [], lostHearts: [],
      minis, helpers, wildFairy: null,
    });
    const H = (a) => ({ actor: a, ally: 'p1', bad: false, leaving: false, wave: 0,
                        locked: false, waiting: false, until: 9, betrayAt: null,
                        thrown: false, victim: null });
    const M = (a) => ({ actor: a, owner: 'p1', home: a.x, until: 9, jumpAt: 0, leaving: false, wave: 0 });

    for (const [name, helpers, minis] of [
      ['no helpers, no minis', [], []],
      ['one helper',           [H(mkBody('dudu', 14))], []],
      ['two helpers',          [H(mkBody('dudu', 14)), H(mkBody('dudu', 30))], []],
      ['minis only',           [], [M(mkBody('bubu', 26))]],
    ]) {
      try {
        const out = net.hydrate(net.snapshot(scene(helpers, minis)));
        if (out.helpers.length !== helpers.length)
          bad.push(`${name}: ${out.helpers.length} helpers back, sent ${helpers.length}`);
        if (out.minis.length !== minis.length)
          bad.push(`${name}: ${out.minis.length} minis back, sent ${minis.length}`);
        // Stats have to survive: the guest predicts its own movement with
        // them, and an EMPTY stats object is truthy, so physics' own fallback
        // never fires and the first step produces NaN.
        for (const a of out.actors) {
          if (!a.stats || typeof a.stats.speed !== 'number')
            bad.push(`${name}: ${a.id} came back with no usable stats`);
        }
      } catch (e) {
        bad.push(`${name}: threw — ${e && e.message}`);
      }
    }

    // ...and the prediction the guest actually runs on what it was handed.
    const me = net.hydrate(net.snapshot(scene([], []))).actors[1];
    for (let i = 0; i < 12; i++)
      stepActor(me, { left: false, right: true, jumpDown: false, jumpHeld: false, dropDown: false },
                g.grid, 1/60, [], {});
    if (!Number.isFinite(me.x) || !Number.isFinite(me.vx))
      bad.push(`prediction went non-finite on the first press: x=${me.x} vx=${me.vx}`);

    if (bad.length) for (const b of bad) fail('wire', b);
    else log.push(`wire      ok — snapshot round-trips, and prediction stays finite`);
  }

  /* ---- the whole point: layers that failed quietly are failures anyway ---- */
  const bad = faults();
  if (bad.length) for (const f of bad) fail('draw layer', f);
  else log.push(`layers    ok — no draw layer threw`);

  // leave a representative frame up
  clearFaults();
  for (let i=0;i<60;i++) draw(r,g,1/60);
} catch(e) { fail('boot', e); }

const bad = log.some(l=>l.startsWith('FAIL'));
document.title = bad ? 'SELFTEST FAIL' : 'SELFTEST OK';
document.getElementById('out').textContent = log.join('\n');
</script></body></html>
