<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Critters 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@700;900&display=swap" rel="stylesheet">
<style>
  /* Each critter sets --c1/--c2/--deep from its theme in critters.json. */
  :root { --c1: #ff5c8a; --c2: #ff9ab3; --deep: #7a1638; --ink: #2a1420; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body { background: var(--c1); color: #fff; font-family: Nunito, system-ui, sans-serif; }
  /* The sunburst: two theme colours in alternating rays, turning slowly, with
     a dark vignette so the critter in the middle is the brightest thing. */
  #burst {
    position: fixed; left: 50%; top: 56%; width: 220vmax; height: 220vmax; margin: -110vmax 0 0 -110vmax;
    background: repeating-conic-gradient(from 0deg, var(--c1) 0deg 9deg, var(--c2) 9deg 18deg);
    animation: turn 90s linear infinite; transition: background .4s;
  }
  #vignette { position: fixed; inset: 0; background: radial-gradient(circle at 50% 56%, transparent 22%, color-mix(in srgb, var(--deep) 75%, transparent) 95%); }
  @keyframes turn { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { #burst { animation: none; } }
  canvas { display: block; touch-action: none; position: fixed; inset: 0; width: 100%; height: 100%; }
  #flat { display: none; }
  body.flat #flat { display: block; }
  body.flat #gl { display: none; }
  body.flat .only3d, body:not(.flat) .only2d { display: none; }
  header { position: fixed; top: 16px; left: 16px; right: 16px; display: flex; flex-direction: column; gap: 12px; z-index: 1; }
  .top { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  h1 {
    margin: 0; font: 400 34px/1 "Lilita One", system-ui, sans-serif; letter-spacing: .01em; color: #fff;
    -webkit-text-stroke: 7px var(--ink); paint-order: stroke fill; text-shadow: 0 5px 0 var(--ink);
    transform: rotate(-2deg); transform-origin: left;
  }
  .tag {
    font: 400 15px "Lilita One", system-ui, sans-serif; background: var(--ink); color: var(--c2);
    padding: 3px 10px 4px; border-radius: 8px; transform: rotate(-2deg);
  }
  .row { display: flex; flex-wrap: wrap; gap: 8px; }
  .bottom { position: fixed; bottom: calc(16px + env(safe-area-inset-bottom)); left: 16px; right: 16px; justify-content: center; z-index: 1; }
  /* Chunky game buttons: thick ink border and a hard drop shadow that the
     button sinks into when pressed. */
  button, a.btn {
    font: 400 16px "Lilita One", system-ui, sans-serif; letter-spacing: .02em; color: var(--ink); text-decoration: none;
    background: #fff; border: 3px solid var(--ink); border-radius: 14px; padding: 7px 14px; cursor: pointer;
    box-shadow: 0 4px 0 var(--ink); transition: transform .06s, box-shadow .06s;
  }
  button:active, a.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
  button[aria-pressed="true"] { background: #ffd23f; }
  .seg { display: inline-flex; gap: 6px; }
  #status { position: fixed; inset: 0; display: grid; place-items: center; color: #fff; font: 400 20px "Lilita One", sans-serif; pointer-events: none; -webkit-text-stroke: 4px var(--ink); paint-order: stroke fill; }
</style>
</head>
<body>
<div id="burst"></div>
<div id="vignette"></div>
<canvas id="gl"></canvas>
<canvas id="flat"></canvas>
<div id="status"></div>

<header>
  <div class="top"><h1 id="title">Yhon Yhon</h1><span class="tag" id="tag"></span></div>
  <div class="row" id="who"></div>
  <div><span class="seg" id="mode"><button data-mode="3d">3D</button><button data-mode="2d">2D</button></span></div>
</header>
<div class="row bottom">
  <button id="spin" class="only3d" aria-pressed="true">Spin</button>
  <button id="walk" class="only2d" aria-pressed="false">Walk</button>
  <button id="alive" aria-pressed="true">Idle</button>
  <button id="hop">Hop!</button>
  <a id="stl" class="btn only3d" download>STL</a>
</div>

<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
               "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/" } }
</script>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
import { OutlineEffect } from "three/addons/effects/OutlineEffect.js";
import { FLAT } from "./flat.js";

// All four 2D drawings come from flat.js. Yhon Yhon's there is a styled
// cousin of the game's drawYhon; the game's own is untouched.
const CRITTERS = {
  yhon: { ...FLAT.yhon, stride: 0.78 },
  axolotl: { ...FLAT.axolotl, stride: 0.9 },
  capybara: { ...FLAT.capybara, stride: 1.1 },
  hedgehog: { ...FLAT.hedgehog, stride: 0.7 },
};

// ------------------------------------------------------------ state + UI ---
const [hashWho, hashMode] = location.hash.slice(1).split("/");
const state = { who: CRITTERS[hashWho] ? hashWho : "yhon", mode: hashMode === "2d" ? "2d" : "3d" };

const who = document.getElementById("who");
for (const id in CRITTERS) {
  const b = document.createElement("button");
  b.textContent = CRITTERS[id].name;
  b.dataset.id = id;
  b.onclick = () => { state.who = id; apply(); };
  who.append(b);
}
document.querySelectorAll("#mode button").forEach((b) => (b.onclick = () => { state.mode = b.dataset.mode; apply(); }));

const toggle = (id) => {
  const b = document.getElementById(id);
  b.onclick = () => b.setAttribute("aria-pressed", b.getAttribute("aria-pressed") !== "true");
  return () => b.getAttribute("aria-pressed") === "true";
};
const spinning = toggle("spin"), walking = toggle("walk"), idle = toggle("alive");
let hopAt = -9;
document.getElementById("hop").onclick = () => { hopAt = clock.getElapsedTime(); };

function apply() {
  history.replaceState(null, "", `#${state.who}/${state.mode}`);
  const c = CRITTERS[state.who];
  document.getElementById("title").textContent = c.name;
  document.getElementById("tag").textContent = c.tag;
  const root = document.documentElement.style;
  [["--c1", 0], ["--c2", 1], ["--deep", 2]].forEach(([k, i]) => root.setProperty(k, c.theme[i]));
  document.body.classList.toggle("flat", state.mode === "2d");
  who.querySelectorAll("button").forEach((b) => b.setAttribute("aria-pressed", b.dataset.id === state.who));
  document.querySelectorAll("#mode button").forEach((b) => b.setAttribute("aria-pressed", b.dataset.mode === state.mode));
  document.getElementById("stl").href = `${state.who}_print.stl`;
  if (state.mode === "3d") show3d(state.who);
}

// The hop, shared by both views: `rise` runs +1 at take-off, 0 at the top,
// -1 on landing, and `squash` is a stretch going up and a squash coming down.
function hop(t) {
  const h = (t - hopAt) / 0.7;
  if (h >= 0 && h < 1) {
    const rise = Math.cos(h * Math.PI);
    return { air: 1, rise, lift: Math.sin(h * Math.PI), squash: h < 0.12 ? -0.15 * (1 - h / 0.12) : 0 };
  }
  if (h >= 1 && h < 1.5) return { air: 0, rise: 0, lift: 0, squash: 0.2 * (1 - (h - 1) / 0.5) };
  return { air: 0, rise: 0, lift: 0, squash: 0 };
}

// ------------------------------------------------------------------- 3D ---
const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById("gl"), antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight, false);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.NeutralToneMapping;
renderer.toneMappingExposure = 1.0;
// Cartoon ink lines round every part — the one change that most moves it
// from "plastic toy render" toward game art.
const effect = new OutlineEffect(renderer, { defaultThickness: 0.006, defaultColor: [0.16, 0.08, 0.12] });
const NO_OUTLINE = new Set(["blush", "belly", "glint", "tongue", "lens"]);

const scene = new THREE.Scene();
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.45; // less grey fill, so the colours stay saturated
const cam = new THREE.PerspectiveCamera(32, innerWidth / innerHeight, 1, 2000);
cam.position.set(60, 60, 190);
const ctl = new OrbitControls(cam, renderer.domElement);
ctl.enableDamping = true;
ctl.target.set(0, 32, 0);
ctl.minDistance = 90; ctl.maxDistance = 600;
ctl.maxPolarAngle = Math.PI * 0.53;
ctl.autoRotateSpeed = 1.4;
// Back the camera off on a tall screen so he fits the width, not just the height.
const fit = () => {
  const off = cam.position.clone().sub(ctl.target).setLength(240 / Math.min(1, cam.aspect * 1.15));
  cam.position.copy(ctl.target).add(off);
};
fit();

const sun = new THREE.DirectionalLight(0xfff2e0, 2.3);
sun.position.set(60, 140, 90);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
Object.assign(sun.shadow.camera, { left: -80, right: 80, top: 80, bottom: -80, near: 10, far: 400 });
sun.shadow.radius = 6;
// A cool rim light from behind picks the silhouette out of the busy background.
const rim = new THREE.DirectionalLight(0xdff4ff, 2.2);
rim.position.set(-80, 90, -140);
scene.add(sun, rim, new THREE.HemisphereLight(0xffffff, 0x886070, 0.9));
const floor = new THREE.Mesh(new THREE.CircleGeometry(100, 64), new THREE.ShadowMaterial({ opacity: 0.16 }));
floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true;
floor.material.userData.outlineParameters = { visible: false };
floor.material.opacity = 0.28;
scene.add(floor);

// Each GLB mesh is baked in model space. Re-centre every part on its own
// middle so the idle animation can turn a part about itself, the way the
// canvas version does with ctx.translate/rotate per part.
const rigs = {};
const loader = new GLTFLoader();
let rig = null;
const status = document.getElementById("status");
function show3d(id) {
  if (rig) scene.remove(rig);
  rig = rigs[id] || null;
  if (rig) { scene.add(rig); return; }
  status.textContent = "loading…";
  loader.load(`${id}.glb`, (g) => {
    const group = new THREE.Group();
    group.userData.P = {};
    g.scene.updateMatrixWorld(true);
    const meshes = [];
    g.scene.traverse((o) => { if (o.isMesh) meshes.push(o); });
    for (const o of meshes) {
      const geo = o.geometry.clone().applyMatrix4(o.matrixWorld);
      geo.computeBoundingBox();
      const c = geo.boundingBox.getCenter(new THREE.Vector3());
      geo.translate(-c.x, -c.y, -c.z);
      geo.computeVertexNormals();
      if (NO_OUTLINE.has(o.material.name)) o.material.userData.outlineParameters = { visible: false };
      const mesh = new THREE.Mesh(geo, o.material);
      mesh.position.copy(c);
      mesh.userData.rest = c.clone();
      mesh.castShadow = mesh.receiveShadow = true;
      group.add(mesh);
      group.userData.P[o.name] = mesh;
    }
    // Inner ears and gill tips ride on their parent, so they turn together.
    const P = group.userData.P;
    for (const name in P) {
      const parent = name.startsWith("innerEar") ? P["ear" + name.slice(8)] : name.startsWith("gillTip") ? P["gill" + name.slice(7)] : null;
      if (parent) { P[name].position.sub(parent.position); parent.add(P[name]); }
    }
    rigs[id] = group;
    status.textContent = "";
    if (state.mode === "3d" && state.who === id) { if (rig) scene.remove(rig); rig = group; scene.add(group); }
  }, undefined, () => { status.textContent = `could not load ${id}.glb`; });
}

function animate3d(t) {
  ctl.autoRotate = spinning();
  if (rig) {
    const on = idle();
    const j = hop(t);
    const sq = j.air ? -Math.abs(j.rise) * 0.14 + j.squash : j.squash + (on ? Math.sin(t * 2.2) * 0.025 : 0);
    const k = 1 - sq;
    rig.scale.set(1 / Math.sqrt(k), k, 1 / Math.sqrt(k));
    rig.position.y = j.lift * 38;
    const cycle = (t % 3.7) / 3.7;
    const blink = on && cycle > 0.965 ? 1 - Math.abs(cycle - 0.982) / 0.017 : 0;
    const P = rig.userData.P;
    for (const name in P) {
      const m = P[name], sx = Math.sign(m.userData.rest.x) || 1;
      if ((name.startsWith("eye") || name.startsWith("glint")) && state.who !== "capybara") m.scale.y = 1 - blink * 0.88;
      else if (/^ear[LR]$/.test(name)) m.rotation.z = sx * (j.rise * 0.35 + (on ? Math.sin(t * 2.2 + 0.6) * 0.05 : 0));
      else if (/^arm[LR]$/.test(name)) {
        m.position.y = m.userData.rest.y + j.rise * 4;
        m.rotation.z = sx * (j.rise * 0.6 + (on ? Math.sin(t * 2.2) * 0.08 : 0));
      } else if (/^gill[LR]\d$/.test(name)) {
        m.rotation.z = sx * ((on ? Math.sin(t * 2.6 + +name.slice(5) * 1.3) * 0.08 : 0) + j.rise * 0.3);
      }
    }
  }
  ctl.update();
  effect.render(scene, cam);
}

// ------------------------------------------------------------------- 2D ---
const flat = document.getElementById("flat");
const fx = flat.getContext("2d");
let walkDist = 0, still = 0, last = 0;
function animate2d(t) {
  const dpr = Math.min(devicePixelRatio, 2);
  const W = innerWidth, H = innerHeight;
  if (flat.width !== Math.round(W * dpr) || flat.height !== Math.round(H * dpr)) {
    flat.width = Math.round(W * dpr); flat.height = Math.round(H * dpr);
  }
  fx.setTransform(dpr, 0, 0, dpr, 0, 0);
  fx.clearRect(0, 0, W, H);
  const dt = Math.min(0.05, t - last);
  const on = idle();
  if (on) still += dt;
  const c = CRITTERS[state.who];
  const size = Math.min(W / 2.3, H / 3.2);
  const run = walking() ? 1 : 0;
  walkDist += run * dt * 2.2;
  const j = hop(t);
  const gx = W / 2, gy = H * 0.64;
  // ground shadow, shrinking as he rises
  fx.fillStyle = "rgba(42, 20, 32, 0.3)";
  fx.beginPath();
  fx.ellipse(gx, gy + 2, size * 0.55 * (1 - j.lift * 0.35), size * 0.08 * (1 - j.lift * 0.35), 0, 0, Math.PI * 2);
  fx.fill();
  c.draw(fx, gx, gy - j.lift * size * 0.75, size, size, {
    face: 1, run, air: j.air, squash: j.squash, rise: j.rise, t: on ? still : 0,
    walk: walkDist, stride: c.stride,
  });
}

// ----------------------------------------------------------------- loop ---
const clock = new THREE.Clock();
function frame() {
  const t = clock.getElapsedTime();
  if (state.mode === "3d") animate3d(t); else animate2d(t);
  last = t;
  requestAnimationFrame(frame);
}
addEventListener("resize", () => {
  cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix(); fit();
  renderer.setSize(innerWidth, innerHeight, false);
});
apply();
frame();
</script>
</body>
</html>
