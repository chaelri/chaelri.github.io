<!doctype html><meta charset="utf-8"><title>box</title>
<!--
  Everything a mystery box can be, and everything that comes out of one, drawn
  side by side. These are rare in play — a box every nineteen seconds and the
  King two chances in nine of one — so waiting for the game to show you each
  state is not a way to look at them.
-->
<style>
  body{margin:0;background:#dff0fb;font:12px ui-monospace,monospace;color:#21313f}
  h1{font:600 13px system-ui;margin:12px}
  .row{display:flex;flex-wrap:wrap;gap:6px;padding:0 12px 14px;align-items:flex-start}
  figure{margin:0}
  canvas{display:block;border-radius:8px}
  figcaption{padding:3px 6px;text-align:center;opacity:.7}
</style>
<h1>the box, as it gives way</h1><div class="row" id="boxes"></div>
<h1>what comes out</h1><div class="row" id="drops"></div>
<h1>King Yhon Yhon, and the crown he leaves</h1><div class="row" id="king"></div>
<script type="module">
import { createRenderer, draw, resize } from "./js/render.js";
import { makeArena, solidGrid } from "./js/levels.js";
import { makeActor } from "./js/physics.js";
import { BOX, KING, POWERUPS } from "./js/config.js";

const CW = 300, CH = 210;
function world() {
  const level = makeArena(4242);
  const g = { level, grid: solidGrid(level), time: 1.2, shrink: 0,
    actors: [], powers: [], coins: [], shots: [], pops: [], bursts: [],
    helpers: [], minis: [], lostHearts: [], quakes: [], boxes: [], king: null,
    wildFairy: null, freeze: 0, slow: 0, slowRate: 1, winner: 0 };
  const a = makeActor(24, 10, "p1"); a.char = "bubu"; a.hp = 3; a.label = "p1"; a.face = 1;
  // The world init sets these on the real players, not makeActor — and the
  // crown is sized off them.
  a.baseW = a.w; a.baseH = a.h; a.speedMul = 1; a.jumpMul = 1;
  g.actors.push(a);
  return g;
}
function floorY(g, x) {
  for (let ty = 0; ty < g.level.h; ty++) if (g.grid.rows[ty][Math.round(x)] === "#") return ty;
  return g.level.h - 2;
}
function cell(host, cap, fill, zoom = 46) {
  const fig = document.createElement("figure");
  const c = document.createElement("canvas");
  const f = document.createElement("figcaption");
  f.textContent = cap;
  fig.append(c, f); host.append(fig);
  const g = world();
  fill(g, floorY(g, 24));
  const r = createRenderer(c);
  resize(r, CW, CH);
  r.cam.x = 24; r.cam.y = floorY(g, 24) - 2.4; r.cam.zoom = zoom;
  draw(r, g, 1 / 60);
}

const boxes = document.getElementById("boxes");
for (const hits of [3, 2, 1]) {
  cell(boxes, `${hits} bump${hits === 1 ? "" : "s"} left`, (g, fy) => {
    for (const q of g.actors) q.x = 60;   // out of shot, not deleted —
                                          // updateCamera needs them
    g.boxes.push({ x: 24, y: fy - 3, hits, bumpAt: -9 });
  }, 130);
}
for (const [cap, ago] of [["struck, 20ms", 0.02], ["struck, 90ms", 0.09]]) {
  cell(boxes, cap, (g, fy) => {
    for (const q of g.actors) q.x = 60;
    g.boxes.push({ x: 24, y: fy - 3, hits: 2, bumpAt: g.time - ago });
  }, 130);
}
cell(boxes, "two at once", (g, fy) => {
  g.boxes.push({ x: 22, y: fy - 3, hits: 3, bumpAt: -9 });
  g.boxes.push({ x: 27, y: fy - 4, hits: 1, bumpAt: -9 });
});

// The shell in flight, at a few headings — it steers, so it must look right
// pointing anywhere, not just left and right.
const fly = document.createElement("div");
fly.className = "row";
const fhh = document.createElement("h1");
fhh.textContent = "the shell in flight";
document.body.append(fhh, fly);
for (const [cap, vx, vy] of [["flat →", 26, 0], ["climbing", 20, -16],
                             ["diving", 20, 16], ["flat ←", -26, 0]]) {
  cell(fly, cap, (g, fy) => {
    for (const q of g.actors) q.x = 60;
    g.shots.push({ x: 24, y: fy - 2.4, vx, vy, owner: "p1", life: 1,
                   born: g.time - 0.5, homing: true, lethal: true });
  }, 90);
}

// The bazooka going off, frame by frame — the fireball is under a second.
const booms = document.createElement("div");
booms.className = "row";
const bh = document.createElement("h1");
bh.textContent = "the bazooka going off";
document.body.append(bh, booms);
for (const ms of [20, 60, 140, 300, 500, 680]) {
  cell(booms, `${ms}ms`, (g, fy) => {
    g.quakes.push({ x: 24, y: fy - 2.2, at: g.time - ms / 1000, force: 1, kind: 1 });
  }, 30);
}

const drops = document.getElementById("drops");
for (const type of ["puso", "bazuka"]) {
  cell(drops, type, (g, fy) => { g.powers.push({ x: 24, y: fy - 2.2, type, born: 0 }); });
}

const kingRow = document.getElementById("king");
for (const hp of [3, 2, 1]) {
  cell(kingRow, `king, ${hp} hearts`, (g, fy) => {
    const a = makeActor(24, fy, "yhon");
    a.char = "yhon"; a.w *= KING.scale; a.h *= KING.scale; a.hp = hp; a.face = -1;
    a.grounded = true;
    g.king = { actor: a, hp, born: 0, hurtUntil: 0, leaving: false };
  }, 34);
}
/* The hit, frame by frame.
 *
 * The whole point of the rework is what the first 200ms look like, and the
 * live game will not hold still for them — G.freeze stops the clock but the
 * loop keeps drawing, so a screenshot lands wherever it lands. */
for (const ms of [20, 60, 120, 250, 500]) {
  cell(kingRow, `struck ${ms}ms ago`, (g, fy) => {
    const a = makeActor(24, fy, "yhon");
    a.char = "yhon"; a.w *= KING.scale; a.h *= KING.scale; a.hp = 2; a.face = -1;
    // Knocked back and off his feet, as hurtKing leaves him.
    a.grounded = false; a.vx = 7.5; a.vy = -6 + 30 * (ms / 1000);
    a.x = 24 + 7.5 * (ms / 1000);
    a.y = fy - Math.max(0, 6 * (ms / 1000) - 15 * (ms / 1000) ** 2);
    g.king = { actor: a, hp: 2, born: 0, leaving: false,
               hurtUntil: g.time + KING.hurtInvulnMs / 1000 - ms / 1000 };
    g.quakes.push({ x: 24, y: fy, at: g.time - ms / 1000, force: 0.45 });
    for (let i = 0; i < 12; i++) {
      const ang = (i / 12) * Math.PI * 2;
      g.bursts.push({ x: a.x + Math.cos(ang) * a.w * 0.4,
                      y: a.y - a.h * 0.5 + Math.sin(ang) * a.h * 0.3,
                      at: g.time - ms / 1000, colour: i % 3 ? KING.colour : "#ff4d6d" });
    }
  }, 34);
}
for (const [cap, left] of [["crowned player", 9], ["crown, about to lapse", 0.7]]) {
  cell(kingRow, cap, (g) => {
    const a = g.actors[0];
    a.char = "yhon";            // draws properly in this harness
    for (const q of g.actors) if (q !== a) q.x = 60;   // out of shot
    // Exactly what givePower does for it — the crown is an ordinary power-up.
    a.power = { type: "korona", until: g.time + left, ammo: 0 };
    a.w = a.baseW * POWERUPS.korona.scale;
    a.h = a.baseH * POWERUPS.korona.scale;
  }, 80);
}
document.title = "box sheet";
</script>
