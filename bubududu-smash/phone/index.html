<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>BUBU DUDU SMASH — controller</title>
<meta name="theme-color" content="#1a2433">
<meta name="apple-mobile-web-app-capable" content="yes">
<link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/phone.css">
<!-- Last, so it out-orders the pad rules above it at equal specificity. -->
<link rel="stylesheet" href="../css/fire.css">
</head>
<body>
<input type="checkbox" switch id="haptic" aria-hidden="true" tabindex="-1">

<section id="join">
  <h1>BUBU DUDU SMASH</h1>
  <label class="field">
    <span>Room code</span>
    <input id="code" inputmode="text" autocapitalize="characters" autocomplete="off" spellcheck="false" maxlength="4" placeholder="····">
  </label>

  <div class="label">Who are you</div>
  <div class="whos">
    <button data-who="p1">Charlie</button>
    <button data-who="p2">Karla</button>
  </div>

  <div class="label">Pick your character</div>
  <div id="chars" class="chars"></div>

  <button id="joinBtn" disabled>Pick a side</button>
  <p id="err"></p>
</section>

<section id="pad" class="hidden">
  <div id="state" class="pill">connecting…</div>
  <button id="swap" class="swap">—</button>
  <div class="dpad">
    <button id="left" aria-label="left">◀</button>
    <button id="right" aria-label="right">▶</button>
  </div>
  <div class="actions">
    <button id="skill" aria-label="special"></button>
    <button id="shoot" aria-label="shoot">➜</button>
    <button id="down" aria-label="drop">▼</button>
    <button id="jump" aria-label="jump">JUMP</button>
  </div>
</section>

<script type="module" src="../js/phone.js"></script>
</body>
</html>
