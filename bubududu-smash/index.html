<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BUBU DUDU SMASH</title>
<meta name="description" content="A 2D platformer for two phones and one screen. Co-op, or against each other.">
<meta name="theme-color" content="#8fd4ff">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/screen.css">
</head>
<body>

<canvas id="stage"></canvas>
<div id="hud"></div>

<!-- Smash-style panels: who you are, how you are doing, and what is currently
     being done to you. See paintPlayers() in screen.js. -->
<div id="players">
  <div class="pcard" data-p="p1">
    <canvas class="face" width="132" height="132"></canvas>
    <div class="pinfo">
      <div class="pname">Charlie</div>
      <div class="pchar"></div>
      <div class="phearts"></div>
      <div class="pskill"></div>
      <div class="pchips"></div>
    </div>
  </div>
  <div class="pcard right" data-p="p2">
    <canvas class="face" width="132" height="132"></canvas>
    <div class="pinfo">
      <div class="pname">Karla</div>
      <div class="pchar"></div>
      <div class="phearts"></div>
      <div class="pskill"></div>
      <div class="pchips"></div>
    </div>
  </div>
</div>
<!-- The way back into a match. Enter does the same thing, but a phone has
     no Enter key, which is why this exists. See rematch() in screen.js. -->
<div id="afterwards">
  <button id="rematch" type="button">Rematch</button>
  <!-- Back to the lobby, which is where the characters and the QR codes are.
       A rematch keeps whoever you were; this is how you stop being them. -->
  <button id="recast" type="button">Change character</button>
</div>
<!-- Knocks the arena back behind a result, so the text on top of it can
     actually be read. See setResult() in screen.js. -->
<div id="scrim"></div>
<div id="banner"></div>

<!-- The 3-2-1. Its own layer so nothing else has to move to make room. -->
<div id="count"></div>
<div id="sound">click anywhere for sound</div>

<!-- Pickup notices, one edge per player. See showPickup() in screen.js. -->
<div id="toastL" class="toast"></div>
<div id="toastR" class="toast right"></div>

<canvas id="scene"></canvas>

<div id="lobby">
  <h1 class="logo" data-text="BUBU DUDU SMASH"><span>BUBU DUDU SMASH</span></h1>


  <!-- Two seats, and in each one the character you are holding, life size.
       The QR codes are gone (the room is joined from the page now) and what
       replaced them is the one thing you actually come here to do: see who
       you are picking. See paintPick in js/screen.js — the card is built
       there and the figure inside it is drawn every frame. -->
  <div class="slots">
    <div class="slot" data-slot="p1">
      <div class="who">Charlie</div>
      <div class="pick"></div>
      <div class="state"></div>
    </div>
    <div class="slot" data-slot="p2">
      <div class="who">Karla</div>
      <div class="pick"></div>
      <div class="state"></div>
    </div>
  </div>

  <!-- Both of them are stood at one keyboard here, so the picker answers to
       the keys they already own. Said out loud because an arrow button on
       screen does not suggest it. -->
  <p class="pickhint"><b>A</b> <b>D</b> and <b>&larr;</b> <b>&rarr;</b> pick your character</p>

  <div class="orline"><span>or</span></div>

  <button id="localBtn" class="local">
    Play on this computer
    <small>Charlie <b>W A S D</b> &middot; <b>F</b> power-up &middot; <b>Q</b> skill<br>Karla <b>arrow keys</b> &middot; <b>/</b> power-up &middot; <b>.</b> skill</small>
  </button>

</div>

<script type="module" src="js/screen.js"></script>
</body>
</html>
