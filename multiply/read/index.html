<!DOCTYPE html>
<html lang="en" class="antialiased">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EFEEEA">
<title>MULTIPLY 2026 — Notes</title>
<meta name="description" content="Notes from MULTIPLY 2026 — The Courage to Multiply · CCF East Ortigas, July 31 – August 1, 2026.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<!-- Absolute, not "../notes.css": on Vercel this page is rewritten to the site
     root, where a relative "../" would climb above the root and 404. Both hosts
     serve the repo from the domain root, so /multiply/… is correct on each. -->
<link rel="stylesheet" href="/multiply/notes.css">

<style type="text/tailwindcss">
  @theme {
    --color-paper:  #EFEEEA;
    --color-panel:  #F7F6F3;
    --color-ink:    #121212;
    --color-muted:  #6E6E6B;
    --color-faint:  #9A9A96;
    --color-line:   #DCDBD5;
    --color-lime:   #B7E43F;
    --color-yellow: #F0E14D;
    --font-sans:    'Inter', ui-sans-serif, system-ui, sans-serif;
  }
</style>

<style>
  /* Reading view: the notes ARE the page, so they get the full column with no
     panel chrome around them. */
  #preview { border: 0; background: transparent; padding: 0; max-height: none; }
</style>
</head>

<body class="bg-paper text-ink">

<header class="border-b border-line">
  <div class="mx-auto max-w-3xl px-5 sm:px-8 pt-7 pb-6">
    <div class="flex items-start justify-between gap-4">
      <div class="min-w-0">
        <p class="tracked-sm text-[10px] sm:text-[11px] font-semibold text-muted uppercase">CCF East Ortigas</p>
        <p class="tracked text-[9px] sm:text-[11px] font-semibold text-ink/70 uppercase mt-3">The Courage To</p>
        <h1 class="wordmark text-[3.4rem] sm:text-[5rem] mt-1">MULTIPLY</h1>
        <p class="tracked text-[9px] sm:text-[11px] font-semibold text-ink/70 uppercase mt-3">Joshua 1:9</p>
      </div>
      <button id="btnShare" title="Share"
        class="shrink-0 mt-1 grid place-items-center w-9 h-9 rounded-full border border-line hover:bg-panel active:scale-95 transition">
        <span class="ms text-[19px]">ios_share</span>
      </button>
    </div>
    <p class="mt-5 text-[13px] text-muted">July 31 – August 1, 2026 · 3F Parking Level, SM East Ortigas</p>
  </div>
</header>

<nav class="sticky top-0 z-20 bg-paper/92 backdrop-blur border-b border-line">
  <div class="mx-auto max-w-3xl px-5 sm:px-8">
    <div id="rail" class="flex gap-1.5 overflow-x-auto py-2.5 -mx-1 px-1 scrollbar-none"></div>
  </div>
</nav>

<main class="mx-auto max-w-3xl px-5 sm:px-8 py-7">
  <p id="sessDay" class="tracked-sm text-[10px] font-semibold text-muted uppercase"></p>
  <h2 id="sessTitle" class="text-[1.6rem] sm:text-[2.1rem] font-extrabold tracking-tight leading-tight mt-1.5"></h2>
  <p id="speaker" class="mt-2 text-[13px] text-muted italic"></p>

  <section id="pointsBox" class="hidden mt-6 mb-7 rounded-2xl border border-line bg-panel/60 px-4 py-3.5">
    <p class="tracked-sm text-[10px] font-semibold text-muted uppercase mb-2.5">Points</p>
    <ol id="pointsList" class="space-y-1.5"></ol>
  </section>

  <article id="preview" class="doc text-[15px] leading-[1.75]"></article>
  <p id="empty" class="hidden text-[14px] text-faint py-10">No notes for this session yet.</p>
</main>

<footer class="mx-auto max-w-3xl px-5 sm:px-8 pb-12 pt-4 border-t border-line">
  <p class="text-[11px] text-faint">Scripture from NASB 2020 · Notes by Charlie Cayno</p>
</footer>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
import { getAuth, signInAnonymously, onAuthStateChanged }
  from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";
import { getDatabase, ref, onValue }
  from "https://www.gstatic.com/firebasejs/11.0.2/firebase-database.js";
// Absolute for the same reason as the stylesheet — the Vercel rewrite serves
// this page at "/", where "../notes.js" would resolve above the site root.
import { SESSIONS, FIREBASE, DBURL, ROOT, renderNotes, pointsHTML } from "/multiply/notes.js";

// Read-only by construction: this page never writes. There is no editor, no
// input bound to state, and no code path that calls set() — so a shared link
// can't be used to change the notes, however it's opened.
const app  = initializeApp(FIREBASE);
const db   = getDatabase(app);
const auth = getAuth(app);

const $ = (s) => document.querySelector(s);
const el = { rail: $("#rail"), day: $("#sessDay"), title: $("#sessTitle"), speaker: $("#speaker"),
             preview: $("#preview"), empty: $("#empty"), box: $("#pointsBox"), list: $("#pointsList") };

const state = {};
const openRefs = new Set();
// ?s=s2 deep-links a session, so a shared link can point at one talk.
let current = new URLSearchParams(location.search).get("s") || "s1";
if (!SESSIONS.some((s) => s.id === current)) current = "s1";

function paintRail() {
  el.rail.innerHTML = SESSIONS.map((s) => `
    <button data-id="${s.id}"
      class="railBtn shrink-0 px-3.5 py-1.5 rounded-full text-[12px] font-semibold border transition whitespace-nowrap
             ${s.id === current ? "bg-ink text-paper border-ink"
                                : "bg-transparent text-muted border-line hover:border-ink/40"}">
      ${s.short} · ${s.title}
    </button>`).join("");
  el.rail.querySelectorAll(".railBtn").forEach((b) =>
    b.addEventListener("click", () => select(b.dataset.id)));
}

async function select(id) {
  current = id;
  const s = SESSIONS.find((x) => x.id === id);
  const d = state[id] || {};
  el.day.textContent   = `${s.day} · ${s.time}`;
  el.title.textContent = `Session ${s.short.slice(1)}: ${s.title}`;
  el.speaker.textContent = d.speaker || "";
  paintRail();

  // Keep the URL shareable at whatever session is being read.
  history.replaceState(null, "", id === "s1" ? location.pathname : `?s=${id}`);

  const text = (d.notes || "").trim();
  el.empty.classList.toggle("hidden", !!text);
  el.preview.classList.toggle("hidden", !text);
  if (!text) { el.box.classList.add("hidden"); el.preview.innerHTML = ""; return; }

  const points = await renderNotes(el.preview, text, openRefs);
  el.box.classList.toggle("hidden", points.length === 0);
  if (points.length) {
    el.list.innerHTML = pointsHTML(points);
    el.list.querySelectorAll(".ptBtn").forEach((b) => b.addEventListener("click", () => {
      el.preview.querySelector(`#pt-${b.dataset.pt}`)
        ?.scrollIntoView({ behavior: "smooth", block: "center" });
    }));
  }
}

$("#btnShare").addEventListener("click", async () => {
  const url = location.href;
  try {
    if (navigator.share) await navigator.share({ title: "MULTIPLY 2026 — Notes", url });
    else await navigator.clipboard.writeText(url);
  } catch (e) { if (e?.name !== "AbortError") { try { await navigator.clipboard.writeText(url); } catch {} } }
});

// Plain HTTP first: RTDB's live channel is a WebSocket, and restrictive wifi can
// block it while ordinary requests still work. Without this the page would just
// sit empty for anyone on such a network.
async function hydrate() {
  try {
    const r = await fetch(`${DBURL}/${ROOT}.json`, { cache: "no-store" });
    if (!r.ok) return;
    Object.assign(state, (await r.json()) || {});
  } catch { /* the live listener below is the fallback */ }
  select(current);
}

paintRail();
select(current);
hydrate();

onAuthStateChanged(auth, (user) => {
  if (!user) return;
  for (const s of SESSIONS) {
    onValue(ref(db, `${ROOT}/${s.id}`), (snap) => {
      const remote = snap.val();
      if (!remote) return;
      state[s.id] = remote;
      if (s.id === current) select(current);          // live-updates while Charlie types
    });
  }
});
signInAnonymously(auth).catch(() => {});
</script>
</body>
</html>
