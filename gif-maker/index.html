<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0E1218">
<meta name="description" content="Turn a video into a 135x240 portrait GIF for the Aula S75 Pro keyboard screen.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="icon" href="icons/favicon.ico" sizes="48x48">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="GIF Maker">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>gif maker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
/* techy / dark. paper #0E1218, text #E6ECF2, primary #4FE3A1, shape #1A222D, accent #FFB347, muted #93A3B5 */
:root{
  --paper:#0E1218; --ink:#E6ECF2; --primary:#4FE3A1; --shape:#1A222D; --accent:#FFB347; --muted:#93A3B5; --line:#2C3746;
  --s1:20px; --s2:32px; --s3:52px;
  --r1:8px; --r2:13px; --r3:21px;
  --u:8px;
  --font:"Space Grotesk",system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,monospace;
}
@media(min-width:1024px){html{zoom:.8}}
*{box-sizing:border-box;margin:0}
body{background:var(--paper);color:var(--ink);font:400 var(--s1)/1.4 var(--font);min-height:100vh}
.wrap{max-width:1680px;margin:0 auto;padding:32px 16px 48px}
header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:24px}
header > div{display:flex;flex-direction:column;gap:8px}
h1{font:700 var(--s3)/.95 var(--font);letter-spacing:-.02em}
h1 span{color:var(--primary)}
header p{color:var(--muted);font:400 var(--s1)/1.4 var(--mono)}
main{display:grid;gap:24px;grid-template-columns:minmax(0,1fr)}
@media(min-width:1024px){main{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);align-items:start}}
.panel{background:var(--shape);border:1px solid var(--line);border-radius:var(--r3);padding:24px}
h2{font:700 var(--s2)/1 var(--font);letter-spacing:-.01em;margin-bottom:16px}

/* stage */
#drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;min-height:320px;border:2px dashed var(--line);border-radius:var(--r2);padding:32px 16px;cursor:pointer;transition:border-color .15s,background .15s}
#drop.over{border-color:var(--primary);background:rgba(79,227,161,.08)}
#drop strong{font:700 var(--s2)/1.1 var(--font)}
#drop small{color:var(--muted);font:400 var(--s1)/1.4 var(--mono)}
.btn{white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;min-height:56px;padding:0 24px;border-radius:999px;border:2px solid var(--primary);background:var(--primary);color:var(--paper);font:700 var(--s1)/1 var(--font);cursor:pointer;transition:transform .1s,box-shadow .1s;text-decoration:none}
.btn:hover{transform:translate(-2px,-2px);box-shadow:4px 4px 0 var(--ink)}
.btn:active{transform:none;box-shadow:none}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--ink);box-shadow:none;transform:none}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none}
.btn:focus-visible,input:focus-visible,.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#editor{display:none}
#editor.on{display:block}
#stageBox{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;border-radius:var(--r2);background:var(--paper);border:1px solid var(--line);padding:16px}
#frame{position:relative;margin:0 auto;overflow:hidden;border-radius:var(--r2);background:#000;touch-action:none;user-select:none}
#frame video{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none}
#crop{position:absolute;border:2px solid var(--accent);box-shadow:0 0 0 9999px rgba(14,18,24,.66);cursor:grab}
#crop:active{cursor:grabbing}
#crop::after{content:"";position:absolute;inset:0;background:
  linear-gradient(var(--accent),var(--accent)) 33.33% 0/1px 100% no-repeat,
  linear-gradient(var(--accent),var(--accent)) 66.66% 0/1px 100% no-repeat,
  linear-gradient(var(--accent),var(--accent)) 0 33.33%/100% 1px no-repeat,
  linear-gradient(var(--accent),var(--accent)) 0 66.66%/100% 1px no-repeat;opacity:.35}
.row{display:flex;flex-direction:column;gap:8px;margin-top:24px}
.row label{display:flex;justify-content:space-between;align-items:baseline;font:700 var(--s1)/1.4 var(--font)}
.row label b{font:400 var(--s1)/1.4 var(--mono);color:var(--primary)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:48px;background:transparent;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:8px;background:var(--line);border-radius:999px}
input[type=range]::-moz-range-track{height:8px;background:var(--line);border-radius:999px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;margin-top:-8px;border-radius:50%;background:var(--primary);border:2px solid var(--paper);box-shadow:0 0 0 2px var(--primary)}
input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:var(--primary);border:2px solid var(--paper);box-shadow:0 0 0 2px var(--primary)}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.seg button{min-height:56px;border-radius:var(--r1);border:1px solid var(--line);background:transparent;color:var(--ink);font:400 var(--s1)/1 var(--mono);cursor:pointer}
.seg button.on{border-color:var(--primary);color:var(--primary);background:rgba(79,227,161,.1)}
#tl{position:relative;height:48px;border-radius:var(--r1);background:var(--paper);border:1px solid var(--line);touch-action:none;cursor:pointer}
#win{position:absolute;top:0;bottom:0;left:0;min-width:16px;background:rgba(255,179,71,.28);border:2px solid var(--accent);border-radius:var(--r1);cursor:grab}
#win:active{cursor:grabbing}
.tlrow{display:grid;grid-template-columns:60px 60px 76px minmax(0,1fr) 76px 60px 60px;gap:8px}
.btn.sm{min-height:56px;padding:0}
#fname,#startT{min-height:56px;border-radius:var(--r1);border:1px solid var(--line);background:var(--paper);color:var(--ink);font:400 var(--s1)/1 var(--mono);text-align:center}
.note{color:var(--muted);font:400 var(--s1)/1.4 var(--font);margin-top:8px}
.note.hand{color:var(--accent)}

/* preview */
.meta{display:flex;justify-content:space-between;gap:16px;margin-top:16px;color:var(--muted);font:400 var(--s1)/1.4 var(--mono)}
.meta b{color:var(--ink);font-weight:400}
.bar{height:8px;border-radius:999px;background:var(--line);overflow:hidden;margin-top:16px;display:none}
.bar.on{display:block}
.bar i{display:block;height:100%;width:0;background:var(--primary)}
.actions{display:flex;flex-direction:column;gap:16px;margin-top:24px}
.row.first{margin-top:0}
.locked{opacity:.45;pointer-events:none}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:16px;width:100%;max-width:304px;margin:0 auto}
#pCtl{margin-top:16px}
#pCtl .row{margin-top:8px}
#pCtl .row.first{margin-top:0}
figure{margin:0;display:flex;flex-direction:column;gap:8px}
figcaption{font:700 var(--s1)/1.4 var(--font);white-space:nowrap}
#pv,#outBox{display:block;width:100%;aspect-ratio:9/16;border-radius:var(--r1);border:1px solid var(--line);background:#000;image-rendering:pixelated}
#outBox{position:relative;display:flex;align-items:center;justify-content:center;border-style:dashed;background:var(--paper);color:var(--muted);text-align:center;padding:16px}
#out{display:none;position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;border-radius:var(--r1)}
#result.on #out{display:block}
#result.on #outBox{border-style:solid}
#result.on #outBox span{display:none}
.meta{margin-top:16px}
.meta + .meta{margin-top:8px}
.meta b{white-space:nowrap}
.over{color:var(--accent)!important}
.panel{display:flex;flex-direction:column}
#editor.on{display:flex;flex-direction:column;flex:1}
#frame{margin:auto}
#editor .row{margin-top:24px}
.panel > .actions,.panel > .bar{margin-top:auto}
.panel > .actions{padding-top:16px}
.panel > .bar + .actions{margin-top:24px}
.panel > .row + .bar{margin-top:24px}
.panel > .meta:last-of-type{margin-bottom:0}
@media(min-width:1024px){
  /* compact cards, centred in the screen with equal breathing room above and below */
  .wrap{min-height:calc(100vh / .8);display:flex;flex-direction:column;justify-content:center;padding-top:40px;padding-bottom:40px}
  main{flex:none;grid-template-rows:auto;align-items:stretch}
  .pair{flex:1;align-content:center}
  #stageBox{padding:0;border:0;background:none}
  #editor.on{justify-content:center}
}

#prog{display:flex;align-items:center;gap:16px}
#progBar{flex:1;height:8px;border-radius:999px;background:var(--line);overflow:hidden}
#progI{display:block;height:100%;width:0;background:var(--primary)}
#progT{font:400 var(--s1)/1 var(--mono);color:var(--muted);white-space:nowrap}
.namerow{display:flex;align-items:center;gap:8px}
#fname{flex:1;min-width:0;padding:0 16px;text-align:left}
.namerow span{font:400 var(--s1)/1 var(--mono);color:var(--muted)}
/* upload screen: just the title and the drop zone */
.empty main{grid-template-columns:minmax(0,720px);justify-content:center}
.empty main > .panel + .panel{display:none}
.empty header{width:100%;max-width:720px;margin-left:auto;margin-right:auto}
.empty #drop{min-height:360px}
/* motion */
:root{--ease:cubic-bezier(.2,.7,.2,1)}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
html.anim header{animation:rise .5s var(--ease) both}
html.anim main > .panel{animation:rise .6s var(--ease) both}
html.anim main > .panel:nth-child(2){animation-delay:.08s}
#result.on #out{animation:pop .45s var(--ease) both}
.seg button,.btn,input[type=text]{transition:background-color .15s,border-color .15s,color .15s,transform .1s,box-shadow .1s}
.bar{transition:opacity .2s}
.bar i{transition:width .2s linear}
/* inner pieces of each screen come in one after another, so a screen builds instead of popping */
html.anim #editor.on > *, html.anim main > .panel:nth-child(2) > *{animation:rise .5s var(--ease) both}
html.anim #editor.on > :nth-child(1), html.anim main > .panel:nth-child(2) > :nth-child(1){animation-delay:.10s}
html.anim #editor.on > :nth-child(2), html.anim main > .panel:nth-child(2) > :nth-child(2){animation-delay:.16s}
html.anim #editor.on > :nth-child(3), html.anim main > .panel:nth-child(2) > :nth-child(3){animation-delay:.22s}
html.anim #editor.on > :nth-child(4), html.anim main > .panel:nth-child(2) > :nth-child(4){animation-delay:.28s}
html.anim #editor.on > :nth-child(5), html.anim main > .panel:nth-child(2) > :nth-child(5){animation-delay:.34s}
#pCtl{transition:opacity .4s var(--ease)}
html.anim .empty #drop{animation:rise .6s var(--ease) both}

/* loading-screen curtain that wipes between screens; the veil hides the old page behind the curved edge so no page text peeks out */
#veil{position:fixed;inset:0;z-index:99;background:var(--paper);opacity:0;pointer-events:none}
#curtain{position:fixed;top:-160px;left:0;right:0;bottom:0;padding-top:160px;box-sizing:border-box;z-index:100;background:var(--primary);color:var(--paper);display:flex;align-items:center;justify-content:center;transform:translateY(101%);pointer-events:none;border-radius:50% 50% 0 0 / 96px 96px 0 0;will-change:transform}
#curtain .cw{display:flex;flex-direction:column;align-items:center;gap:16px}
#curtain strong{font:700 var(--s3)/1 var(--font);letter-spacing:-.02em}
#curtain strong span{opacity:.62}
#curtain .cbar{width:240px;height:8px;border-radius:999px;background:rgba(14,18,24,.2);overflow:hidden}
#curtain .cbar i{display:block;height:100%;width:0;background:var(--paper);border-radius:999px}
#curtain small{font:400 var(--s1)/1 var(--mono)}
/* phone: no scrolling, the app is a 4-step flow with a progress bar (upload > crop > settings > export) */
#steps{display:none}
@media(max-width:1023.98px){
  html,body{height:100%;overflow:hidden}
  body{display:flex;flex-direction:column;height:100dvh}
  .wrap{order:1;flex:1;width:100%;min-width:0;min-height:0;padding:16px;display:flex;flex-direction:column}
  header{margin-bottom:16px;flex:none}
  h1{font-size:var(--s2)}
  main{flex:1;min-height:0;display:block}
  main > .panel{height:100%;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;padding:12px 16px}
  main > .panel::-webkit-scrollbar{display:none}
  .empty main{display:flex;align-items:center}
  .empty main > .panel{height:auto;width:100%}
  #again{display:none!important}
  body:not([data-step="4"]) main > .panel:nth-child(2){display:none}
  body[data-step="4"] main > .panel:nth-child(1){display:none}
  .row2col{display:block}
  #editor .row2col > .row{margin-top:8px}
  .row2col{margin-top:0}
  body[data-step="2"] #rowZoom, body[data-step="2"] #prog{display:none}
  body[data-step="2"] #stageBox{padding:0}
  #tl{height:40px}
  .seg button{min-height:48px}
  body[data-step="3"] #rowStart, body[data-step="3"] #rowLen, body[data-step="3"] #rowFps{display:none}
  body[data-step="3"] .row2col{display:block}
  body[data-step="3"] .cropPrev{display:flex}
  body[data-step="4"] .pair + .meta{display:none}
  #steps{order:2;flex:none;display:block;position:relative;z-index:20;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:var(--paper);border-top:1px solid var(--line)}
  .empty #steps{display:none}
  .shead{display:flex;align-items:center;gap:16px;margin-bottom:12px}
  .sbar{flex:1;height:8px;border-radius:999px;background:var(--line);overflow:hidden}
  #sbarI{display:block;height:100%;width:25%;background:var(--primary);border-radius:999px;transition:width .45s var(--ease)}
  .srow{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  #sLbl{font:400 16px/1 var(--mono);color:var(--muted);white-space:nowrap}
  #steps .btn{min-height:56px;padding:0 16px}
  .pair{max-width:200px}
  #stageBox{padding:8px}
  #editor .row{margin-top:8px}
  #editor .note{display:none}
  .tlrow{gap:8px}
  .tlrow .btn.sm,#startT{min-height:48px}
  #stageBox{gap:8px}
  .tlrow{grid-template-columns:repeat(6,minmax(0,1fr))}
  .tlrow .btn.sm{padding:0;font-size:16px}
  #startT{grid-column:1/-1;order:-1}
  #pCtl{margin-top:0}
  #pCtl .row{margin-top:16px}
  #pCtl .row.first{margin-top:0}
}
@media(max-width:400px){.tlrow{grid-template-columns:repeat(3,minmax(0,1fr))}}
/* confirm modal */
#modal{position:fixed;inset:0;z-index:200;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(14,18,24,.72)}
#modal.on{display:flex}
.mcard{width:100%;max-width:440px;background:var(--shape);border:1px solid var(--line);border-radius:var(--r3);padding:24px}
.mcard h3{font:700 var(--s2)/1.1 var(--font);letter-spacing:-.01em;margin-bottom:8px}
.mcard p{color:var(--muted);font:400 var(--s1)/1.4 var(--font)}
.mbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:24px}
.btn.danger{background:var(--accent);border-color:var(--accent)}
/* length + fps live with the video controls so they are set while configuring the clip */
.row2col{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:24px}
#editor .row2col > .row{margin-top:0}
.cropPrev{display:none;flex-direction:column;align-items:center;gap:8px;margin:8px 0 0}
#pv2{width:90px;aspect-ratio:9/16;border-radius:var(--r1);border:1px solid var(--line);background:#000;image-rendering:pixelated}
@media(min-width:1024px){.pair{max-width:440px}}
/* the rendered gif only exists after an export: before that, only the live preview is shown */
#result:not(.on){display:none}
#result.on{animation:pop .5s var(--ease) both}
.pair{grid-template-columns:1fr;max-width:220px;transition:max-width .5s var(--ease)}
.pair:has(#result.on){grid-template-columns:1fr 1fr;max-width:440px}
body:not(:has(#result.on)) .meta span:has(#outInfo){visibility:hidden}
@media(max-width:1023.98px){
  .pair{max-width:100px}.pair:has(#result.on){max-width:200px}
  .row2col{display:block;margin-top:0}
  #editor .row2col > .row{margin-top:8px}
}
.row label b{white-space:nowrap}
.row label{gap:16px}
</style>
</head>
<body class="empty" data-step="1">
<div id="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle"><div class="mcard"><h3 id="mTitle">discard this video?</h3><p id="mText">your crop, timing and settings for the current video will be lost.</p><div class="mbtns"><button class="btn ghost" id="mKeep">keep editing</button><button class="btn danger" id="mGo">discard</button></div></div></div>
<div id="veil"></div>
<div id="curtain" aria-hidden="true"><div class="cw"><strong>gif <span>maker</span></strong><div class="cbar"><i id="cbarI"></i></div><small id="cmsg">loading your video</small></div></div>
<nav id="steps" aria-label="progress"><div class="shead"><span id="sLbl"></span><div class="sbar"><i id="sbarI"></i></div></div><div class="srow"><button class="btn ghost" id="sBack">back</button><button class="btn" id="sNext">next</button></div></nav>
<div class="wrap">
  <header>
    <div>
      <h1>gif <span>maker</span></h1>
      <p>for aula s75 pro</p>
    </div>
    <button class="btn ghost" id="again" style="display:none">new video</button>
  </header>

  <main>
    <section class="panel" aria-label="video">
      <label id="drop" for="file" tabindex="0">
        <strong>drop a video here</strong>
        <span class="btn">choose file</span>
        <small>mp4 / mov / webm. it stays on your pc.</small>
      </label>
      <input id="file" type="file" accept="video/*" hidden>

      <div id="editor">
        <div id="stageBox">
          <div id="frame">
            <video id="vid" muted playsinline loop></video>
            <div id="crop" role="img" aria-label="crop frame, drag to move"></div>
          </div>
          <div id="prog"><div id="progBar"><i id="progI"></i></div><span id="progT">0.0s / 5.0s</span></div>
        </div>
        <div class="row" id="rowStart">
          <label for="startT">start at <b id="startV">0:00.0</b></label>
          <div id="tl" aria-label="timeline, drag the amber window"><div id="win"></div></div>
          <div class="tlrow">
            <button class="btn ghost sm" id="mm" aria-label="back 5 seconds">-5s</button>
            <button class="btn ghost sm" id="m1" aria-label="back 1 second">-1s</button>
            <button class="btn ghost sm" id="m5" aria-label="back half a second">-0.5s</button>
            <input id="startT" type="text" value="0:00" inputmode="decimal" aria-label="start time, like 2:35 or 155">
            <button class="btn ghost sm" id="p5" aria-label="forward half a second">+0.5s</button>
            <button class="btn ghost sm" id="p1" aria-label="forward 1 second">+1s</button>
            <button class="btn ghost sm" id="pp" aria-label="forward 5 seconds">+5s</button>
          </div>
          <p class="note"><span id="totV"></span> total</p>
        </div>
        <div class="row2col">
        <div class="row" id="rowZoom">
          <label for="zoom">zoom <b id="zoomV">1.0×</b></label>
          <input id="zoom" type="range" min="1" max="8" step="0.05" value="1">
        </div>
        <div class="row" id="rowLen">
          <label for="dur">length <b id="durV">5.0s</b></label>
          <input id="dur" type="range" min="1" max="10" step="0.5" value="5">
        </div>
        </div>
        <div class="row" id="rowFps">
          <label>frames per second</label>
          <div class="seg" id="fps" role="group" aria-label="frames per second">
            <button data-fps="10">10</button>
            <button data-fps="15">15</button>
            <button data-fps="20" class="on">20</button>
            <button data-fps="30">30</button>
          </div>
        </div>
        <figure class="cropPrev"><figcaption>preview</figcaption><canvas id="pv2" width="135" height="240"></canvas></figure>
      </div>
    </section>

    

    <section class="panel" aria-label="result">
      <div class="pair">
        <figure>
          <figcaption>preview</figcaption>
          <canvas id="pv" width="135" height="240"></canvas>
        </figure>
        <figure id="result">
          <figcaption>rendered</figcaption>
          <div id="outBox"><img id="out" alt="exported gif" width="135" height="240"><span>export to see it here</span></div>
        </figure>
      </div>
      <div class="meta"><span>loops <b id="loopV">5.0s</b></span><span><b id="estV">-</b></span></div>
      <div class="meta"><span>est. file <b id="mbV">-</b></span><span>actual file <b id="outInfo">-</b></span></div>
      <div id="pCtl" class="locked">
        <div class="row first" id="rowName">
          <label for="fname">file name</label>
          <div class="namerow"><input id="fname" type="text" value="keyboard" spellcheck="false" maxlength="60" autocomplete="off"><span>.gif</span></div>
        </div>
      </div>
      <div class="bar" id="bar"><i id="barI"></i></div>
      <div class="actions">
        <button class="btn" id="go" disabled>export gif</button>
      </div>
    </section>
  </main>
</div>

<script type="module">
import {GIFEncoder, quantize, applyPalette} from './gifenc.esm.js';
const $ = id => document.getElementById(id);
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  const hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.register('sw.js', {updateViaCache: 'none'}).catch(() => {});
  // a new version took over: pick it up right away, but only while nothing is loaded (never lose someone's video)
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (hadController && document.body.classList.contains('empty')) location.reload(); });
}

// screen changes: a loading-screen curtain wipes up, the screens swap behind it, then it lifts away and the new screen builds in.
// (Web Animations API on purpose: it ignores the OS "reduce motion" setting, which is ON on Charlie's PC.)
const root = document.documentElement;
function playIntro(ms){ root.classList.add('anim'); setTimeout(() => root.classList.remove('anim'), ms || 900); }
let wiping = false;
// confirm before anything that throws the current video away
let askDone = null;
function ask(title, text, goLabel){
  return new Promise(res => {
    $('mTitle').textContent = title || 'discard this video?';
    $('mText').textContent = text || 'your crop, timing and settings for the current video will be lost.';
    $('mGo').textContent = goLabel || 'discard';
    const m = $('modal'); m.classList.add('on');
    m.animate([{opacity: 0}, {opacity: 1}], {duration: 160});
    $('modal').firstElementChild.animate([{opacity: 0, transform: 'translateY(16px) scale(.96)'}, {opacity: 1, transform: 'none'}], {duration: 300, easing: 'cubic-bezier(.2,.7,.2,1)'});
    $('mKeep').focus(); askDone = res;
  });
}
function closeAsk(v){ $('modal').classList.remove('on'); if (askDone) { askDone(v); askDone = null; } }
$('mKeep').addEventListener('click', () => closeAsk(false));
$('mGo').addEventListener('click', () => closeAsk(true));
$('modal').addEventListener('pointerdown', e => { if (e.target === $('modal')) closeAsk(false); });
window.addEventListener('keydown', e => { if (e.key === 'Escape' && $('modal').classList.contains('on')) closeAsk(false); });
const wait = ms => new Promise(r => setTimeout(r, ms));
async function go(fn, msg){
  if (wiping) { fn(); return; }
  wiping = true;
  const c = $('curtain'), bar = $('cbarI'), EASE = 'cubic-bezier(.7,0,.2,1)';
  $('cmsg').textContent = msg || 'loading your video'; bar.style.width = '0';
  const veil = $('veil');
  veil.animate([{opacity: 0}, {opacity: 1}], {duration: 300, easing: 'ease-out', fill: 'forwards'});
  await c.animate([{transform: 'translateY(101%)'}, {transform: 'translateY(0)'}], {duration: 520, easing: EASE, fill: 'forwards'}).finished;
  fn();                                                    // swap screens while covered
  bar.animate([{width: '0%'}, {width: '100%'}], {duration: 700, easing: 'cubic-bezier(.3,.6,.3,1)', fill: 'forwards'});
  await wait(780);                                         // let layout settle, loader visible
  playIntro(1500);                                         // new screen starts building as the curtain lifts
  veil.animate([{opacity: 1}, {opacity: 0}], {duration: 200, easing: 'ease-in', fill: 'forwards'});
  await c.animate([{transform: 'translateY(0)'}, {transform: 'translateY(-101%)'}], {duration: 600, easing: EASE, fill: 'forwards'}).finished;
  c.getAnimations().forEach(a => a.cancel()); veil.getAnimations().forEach(a => a.cancel()); bar.getAnimations().forEach(a => a.cancel()); bar.style.width = '0';
  wiping = false;
}
playIntro();
const W = 135, H = 240;
const STEP_NAMES = ['upload', 'timing', 'crop', 'export'];
const vid = $('vid'), frame = $('frame'), crop = $('crop'), pv = $('pv'), pctx = pv.getContext('2d', {willReadFrequently:true});
const p2ctx = $('pv2').getContext('2d');
const S = {step:1, url:null, vw:0, vh:0, cw:0, cx:0, cy:0, start:0, dur:5, fps:20, busy:false, dispW:0, dispH:0, outUrl:null};
pctx.imageSmoothingQuality = 'high';

/* ---------- load ---------- */
const drop = $('drop'), file = $('file');
drop.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); file.click(); } });
['dragenter','dragover'].forEach(t => window.addEventListener(t, e => { e.preventDefault(); drop.classList.add('over'); }));
['dragleave','drop'].forEach(t => window.addEventListener(t, e => { e.preventDefault(); if (t === 'dragleave' && e.relatedTarget) return; drop.classList.remove('over'); }));
window.addEventListener('drop', async e => {
  const f = e.dataTransfer.files[0]; if (!f) return;
  if (!document.body.classList.contains('empty') && !(await ask('replace this video?', 'your crop, timing and settings for the current video will be lost.', 'replace'))) return;
  load(f);
});
file.addEventListener('change', () => { if (file.files[0]) load(file.files[0]); });
$('again').addEventListener('click', async () => { if (!(await ask('discard this video?', 'your crop, timing and settings for the current video will be lost.', 'discard'))) return; go(() => { document.body.classList.add('empty'); S.step = 1; syncStep(); vid.pause(); $('editor').classList.remove('on'); drop.style.display = ''; $('again').style.display = 'none'; $('go').disabled = true; $('pCtl').classList.add('locked'); $('result').classList.remove('on'); file.value = ''; }, 'back to the start'); });

const qs = new URLSearchParams(location.search).get('src'); if (qs) queueMicrotask(() => { vid.src = qs; });
function load(f){
  if (S.url) URL.revokeObjectURL(S.url);
  S.url = URL.createObjectURL(f);
  $('fname').value = f.name.replace(/\.[^.]+$/, '').replace(/[\/:*?"<>|]+/g, '').slice(0, 60) || 'keyboard';
  vid.src = S.url;
}
vid.addEventListener('error', () => alert('this browser cannot read that video. try mp4 (h.264) or webm.'));
vid.addEventListener('loadedmetadata', () => go(() => {
  document.body.classList.remove('empty'); S.step = 2; syncStep();
  S.vw = vid.videoWidth; S.vh = vid.videoHeight;
  drop.style.display = 'none'; $('editor').classList.add('on'); $('again').style.display = ''; $('go').disabled = false; $('pCtl').classList.remove('locked');
  S.start = 0; setDur(Math.min(5, vid.duration)); $('startT').value = '0:00';
  { const t = Math.round(vid.duration), m = Math.floor(t / 60), sec = t % 60; $('totV').textContent = m + ':' + (sec < 10 ? '0' : '') + sec; }
  clampDur();
  $('zoom').value = 1;
  S.cw = maxCw(); S.cx = (S.vw - S.cw) / 2; S.cy = (S.vh - S.cw * H / W) / 2;
  layout(); label(); startLoop();
}));
const maxCw = () => Math.min(S.vw, S.vh * W / H);

/* ---------- layout + crop box ---------- */
const desk = matchMedia('(min-width:1024px)');
function syncStep(){
  document.body.dataset.step = S.step;
  $('sbarI').style.width = (S.step / 4 * 100) + '%';
  $('sLbl').textContent = S.step + ' of 4 · ' + STEP_NAMES[S.step - 1];
  $('sBack').textContent = S.step === 2 ? 'new video' : 'back';
  $('sNext').style.visibility = S.step >= 4 ? 'hidden' : 'visible';
}
// phone steps: the current card slides out, the next one slides in from the side
function toStep(n, dir){
  const main = document.querySelector('main'), EASE = 'cubic-bezier(.7,0,.2,1)';
  const out = main.animate([{opacity: 1, transform: 'none'}, {opacity: 0, transform: `translateX(${-dir * 32}px)`}], {duration: 180, easing: 'ease-in', fill: 'forwards'});
  out.finished.then(() => {
    S.step = n; syncStep(); layout();
    out.cancel();
    main.animate([{opacity: 0, transform: `translateX(${dir * 32}px)`}, {opacity: 1, transform: 'none'}], {duration: 360, easing: 'cubic-bezier(.2,.7,.2,1)'});
  });
}
$('sNext').addEventListener('click', () => { if (S.step < 4) toStep(S.step + 1, 1); });
$('sBack').addEventListener('click', () => { if (S.step === 2) $('again').click(); else if (S.step > 2) toStep(S.step - 1, -1); });
// phone: the video takes every pixel the other controls on this step leave free (no dead space, never overflows)
function phoneFrameMaxH(){
  const panel = $('editor').closest('.panel'), pcs = getComputedStyle(panel);
  const inner = panel.clientHeight - parseFloat(pcs.paddingTop) - parseFloat(pcs.paddingBottom);
  let other = 0;
  for (const k of $('editor').children) {
    if (k === $('stageBox') || !k.offsetParent) continue;
    const m = getComputedStyle(k); other += k.offsetHeight + parseFloat(m.marginTop) + parseFloat(m.marginBottom);
  }
  const sb = getComputedStyle($('stageBox'));
  const extra = parseFloat(sb.paddingTop) * 2 + parseFloat(sb.borderTopWidth) * 2 + ($('prog').offsetParent ? $('prog').offsetHeight + parseFloat(sb.rowGap || 0) : 0);
  return Math.max(96, Math.min(360, inner - other - extra - 8));
}
function layout(){
  const sb = $('stageBox'), cs = getComputedStyle(sb);
  const box = $('editor').clientWidth - parseFloat(cs.paddingLeft) * 2 - parseFloat(cs.borderLeftWidth) * 2; if (box <= 0) return;
  // desktop: the viewer box fills the panel, the video sits inside it (contain). phone: width-bound.
  const maxH = matchMedia('(max-width:1023.98px)').matches ? phoneFrameMaxH() : 260;
  let w = box, h = w * S.vh / S.vw;
  if (h > maxH) { h = maxH; w = h * S.vw / S.vh; }
  frame.style.width = w + 'px'; frame.style.height = h + 'px'; $('prog').style.width = w + 'px';
  S.dispW = w; S.dispH = h; paintCrop();
}
window.addEventListener('resize', layout);
new ResizeObserver(layout).observe($('stageBox'));
function paintCrop(){
  const k = S.dispW / S.vw, ch = S.cw * H / W;
  crop.style.left = S.cx * k + 'px'; crop.style.top = S.cy * k + 'px';
  crop.style.width = S.cw * k + 'px'; crop.style.height = ch * k + 'px';
}
function clampCrop(){
  const ch = S.cw * H / W;
  S.cx = Math.min(Math.max(0, S.cx), S.vw - S.cw);
  S.cy = Math.min(Math.max(0, S.cy), S.vh - ch);
}
let drag = null;
crop.addEventListener('pointerdown', e => { drag = {x:e.clientX, y:e.clientY, cx:S.cx, cy:S.cy}; crop.setPointerCapture(e.pointerId); });
crop.addEventListener('pointermove', e => {
  if (!drag) return;
  const k = S.vw / S.dispW; // note: html zoom scales client coords equally, so use the element ratio
  const r = frame.getBoundingClientRect(), kk = S.vw / r.width;
  S.cx = drag.cx + (e.clientX - drag.x) * kk; S.cy = drag.cy + (e.clientY - drag.y) * kk;
  clampCrop(); paintCrop(); resetEst();
});
crop.addEventListener('pointerup', () => drag = null);
crop.addEventListener('pointercancel', () => drag = null);
frame.addEventListener('wheel', e => { e.preventDefault(); const z = $('zoom'); z.value = +z.value + (e.deltaY < 0 ? .25 : -.25); setZoom(); }, {passive:false});
function setZoom(){
  resetEst();
  const z = +$('zoom').value, ocx = S.cx + S.cw / 2, ocy = S.cy + S.cw * H / W / 2;
  S.cw = maxCw() / z; S.cx = ocx - S.cw / 2; S.cy = ocy - S.cw * H / W / 2;
  clampCrop(); paintCrop(); label();
}
$('zoom').addEventListener('input', setZoom);

/* ---------- time ---------- */
function setDur(d){ S.dur = d; }
const fmt = t => { const m = Math.floor(t / 60), s = t - m * 60; return m + ':' + (s < 10 ? '0' : '') + s.toFixed(1); };
const parseT = v => { const p = v.trim().split(':').map(Number); if (p.some(isNaN) || !v.trim()) return NaN; return p.reduce((a, x) => a * 60 + x, 0); };
const LIMIT_B = 14.5 * 1024 * 1024; // keep a little under the 15 MB driver limit
S.samples = {}; S.actual = 0;
// bytes per frame: the real render if we have one, else sampled across the whole loop (one sample per half second of the window) + 15% safety
const avgB = () => { if (S.actual) return S.actual; const v = Object.values(S.samples); return v.length ? v.reduce((a, b) => a + b, 0) / v.length * 1.15 : 0; };
const maxFrames = () => { const a = avgB(); return Math.max(1, Math.min(255, a ? Math.floor(LIMIT_B / a) : 255)); };
const resetEst = () => { S.samples = {}; S.actual = 0; };
function sampleSize(){
  if (S.busy || !S.vw || vid.paused || S.actual) return;
  const d = pctx.getImageData(0, 0, W, H).data, pal = quantize(d, 256), g = GIFEncoder();
  g.writeFrame(applyPalette(d, pal), W, H, {palette: pal}); g.finish();
  S.samples[Math.floor((vid.currentTime - S.start) * 2)] = g.bytes().length - 20;
  const before = $('dur').max; clampDur(); if ($('dur').max !== before) setStart(S.start); else label();
}
setInterval(sampleSize, 400);
function clampDur(){
  const mx = Math.max(.5, Math.min(25, Math.floor(vid.duration * 2) / 2, Math.floor(maxFrames() / S.fps * 2) / 2));
  $('dur').max = mx; $('dur').min = Math.min(1, mx); S.dur = Math.min(S.dur, mx); $('dur').value = S.dur;
}
function setStart(t){
  if (S.actual && t !== S.start) resetEst();
  S.start = Math.min(Math.max(0, t), Math.max(0, vid.duration - S.dur));
  S.start = Math.round(S.start * 10) / 10;
  $('startT').value = fmt(S.start).replace(/\.0$/, ''); vid.currentTime = S.start; label();
}
$('startT').addEventListener('change', () => { const t = parseT($('startT').value); if (!isNaN(t)) setStart(t); else setStart(S.start); });
$('startT').addEventListener('keydown', e => { if (e.key === 'Enter') e.target.blur(); });
$('m1').addEventListener('click', () => setStart(S.start - 1));
$('p1').addEventListener('click', () => setStart(S.start + 1));
$('mm').addEventListener('click', () => setStart(S.start - 5));
$('pp').addEventListener('click', () => setStart(S.start + 5));
$('m5').addEventListener('click', () => setStart(S.start - .5));
$('p5').addEventListener('click', () => setStart(S.start + .5));
const tl = $('tl');
let tdrag = null;
const tlT = e => { const r = tl.getBoundingClientRect(); return (e.clientX - r.left) / r.width * vid.duration; };
tl.addEventListener('pointerdown', e => {
  tl.setPointerCapture(e.pointerId);
  const inWin = e.target === $('win'); tdrag = {off: inWin ? tlT(e) - S.start : S.dur / 2}; setStart(tlT(e) - tdrag.off);
});
tl.addEventListener('pointermove', e => { if (tdrag) setStart(tlT(e) - tdrag.off); });
tl.addEventListener('pointerup', () => tdrag = null);
tl.addEventListener('pointercancel', () => tdrag = null);
$('dur').addEventListener('input', () => { S.dur = +$('dur').value; setStart(S.start); });
document.querySelectorAll('#fps button').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('#fps button').forEach(x => x.classList.remove('on')); b.classList.add('on'); S.fps = +b.dataset.fps; clampDur(); setStart(S.start);
}));
function label(){
  const end = Math.min(S.start + S.dur, vid.duration || 0);
  $('startV').textContent = fmt(S.start);
  const dd = vid.duration || 1, w = $('win'); w.style.left = (S.start / dd * 100) + '%'; w.style.width = ((end - S.start) / dd * 100) + '%';
  $('durV').textContent = S.dur.toFixed(1) + 's';
  $('loopV').textContent = (end - S.start).toFixed(1) + 's';
  $('zoomV').textContent = (S.vw / S.cw / (S.vw / maxCw())).toFixed(1) + '×';
  const frames = Math.round((end - S.start) * S.fps);
  const mf = maxFrames(), mb = avgB() * frames / 1048576, over = frames > mf;
  $('estV').textContent = frames + ' / ' + mf + ' frames';
  $('mbV').textContent = avgB() ? '~' + mb.toFixed(1) + ' MB' : '...';
  $('estV').classList.toggle('over', over); $('mbV').classList.toggle('over', mb > 15);
  $('durV').textContent = S.dur.toFixed(1) + 's / ' + (mf / S.fps).toFixed(1) + 's max';
}

/* ---------- live loop preview ---------- */
let raf = 0;
function startLoop(){
  cancelAnimationFrame(raf);
  vid.currentTime = S.start; vid.play().catch(() => {});
  const tick = () => {
    if (!S.busy) {
      const end = Math.min(S.start + S.dur, vid.duration);
      if (vid.currentTime >= end || vid.currentTime < S.start - .05) vid.currentTime = S.start;
      draw();
      const len = Math.max(.1, end - S.start), el = Math.min(len, Math.max(0, vid.currentTime - S.start));
      $('progI').style.width = (el / len * 100) + '%';
      $('progT').textContent = el.toFixed(1) + 's / ' + len.toFixed(1) + 's';
    }
    raf = requestAnimationFrame(tick);
  };
  tick();
}
// clearer downscale: high-quality 2x pass, then 1x pass, then a light sharpen (same for preview and export)
const mid = document.createElement('canvas'); mid.width = W * 2; mid.height = H * 2;
const mctx = mid.getContext('2d'); mctx.imageSmoothingQuality = 'high';
const SHARP = .25;
function draw(){
  mctx.drawImage(vid, S.cx, S.cy, S.cw, S.cw * H / W, 0, 0, W * 2, H * 2);
  pctx.drawImage(mid, 0, 0, W, H);
  const im = pctx.getImageData(0, 0, W, H), s = im.data, o = new Uint8ClampedArray(s);
  for (let y = 1; y < H - 1; y++) for (let x = 1; x < W - 1; x++) {
    const i = (y * W + x) * 4;
    for (let c = 0; c < 3; c++) {
      const k = i + c;
      o[k] = s[k] * (1 + 4 * SHARP) - SHARP * (s[k - 4] + s[k + 4] + s[k - W * 4] + s[k + W * 4]);
    }
  }
  im.data.set(o); pctx.putImageData(im, 0, 0);
  if ($('pv2').offsetParent) p2ctx.drawImage(pv, 0, 0);
}

/* ---------- export ---------- */
const seek = t => new Promise(res => { const f = () => { vid.removeEventListener('seeked', f); res(); }; vid.addEventListener('seeked', f); vid.currentTime = t; });
$('go').addEventListener('click', async () => {
  if (S.busy) return;
  S.busy = true; vid.pause(); $('go').disabled = true; $('result').classList.remove('on');
  const bar = $('bar'), bi = $('barI'); bar.classList.add('on'); bi.style.width = '0';
  const end = Math.min(S.start + S.dur, vid.duration), n = Math.min(maxFrames(), 255, Math.max(1, Math.round((end - S.start) * S.fps))), step = 1 / S.fps;
  const frames = [];
  for (let i = 0; i < n; i++) {
    await seek(Math.min(S.start + i * step, vid.duration - .05));
    draw(); frames.push(pctx.getImageData(0, 0, W, H).data.slice());
    bi.style.width = (i / n * 70) + '%'; $('go').textContent = 'rendering ' + Math.round(i / n * 70) + '%';
    if (i % 4 === 0) await new Promise(r => setTimeout(r));
  }
  // own 256-colour palette per frame: truer colours and skin tones than one shared palette
  const gif = GIFEncoder();
  for (let i = 0; i < n; i++) {
    const palette = quantize(frames[i], 256);
    gif.writeFrame(applyPalette(frames[i], palette), W, H, {palette, delay: (Math.round((i + 1) * 100 / S.fps) - Math.round(i * 100 / S.fps)) * 10, repeat: 0});
    bi.style.width = (70 + i / n * 30) + '%'; $('go').textContent = 'rendering ' + Math.round(70 + i / n * 30) + '%';
    if (i % 8 === 0) await new Promise(r => setTimeout(r));
  }
  gif.finish();
  const blob = new Blob([gif.bytes()], {type:'image/gif'});
  if (S.outUrl) URL.revokeObjectURL(S.outUrl);
  S.outUrl = URL.createObjectURL(blob);
  $('out').src = S.outUrl; S.actual = blob.size / n; label();
  const a = document.createElement('a'); a.href = S.outUrl; a.download = (($('fname').value || '').replace(/\.gif$/i, '').replace(/[\/:*?"<>|]+/g, '').trim() || 'keyboard') + '.gif';
  $('outInfo').textContent = `${(blob.size / 1024 / 1024).toFixed(2)} MB` + (blob.size > 15 * 1024 * 1024 ? ' (over 15 MB)' : '');
  $('result').classList.add('on'); bar.classList.remove('on');
  S.busy = false; $('go').disabled = false; $('go').textContent = 'export gif';
  a.click(); // download straight away; the button stays for a second copy
  startLoop();
});
</script>
</body>
</html>
