<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Karla's Applications</title>
<style>
:root{--bg:#f6f5f2;--card:#fff;--ink:#1d1d1b;--mute:#6b6a66;--line:#e4e2dc;--acc:#2f6f5e;--warn:#a0522d;--bad:#9b2c2c;--chip:#eef3f1}
@media (prefers-color-scheme:dark){:root{--bg:#141413;--card:#1e1e1c;--ink:#ecebe7;--mute:#9a9893;--line:#2e2d2a;--acc:#6fbfa6;--warn:#e0a070;--bad:#e08080;--chip:#24302c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:720px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:8px 0 4px}
.sub{color:var(--mute);font-size:13px;margin-bottom:14px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tabs button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer}
.tabs button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px}
.t{font-weight:600;font-size:16px}
.co{color:var(--mute);font-size:13px}
.row{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{background:var(--chip);border-radius:6px;padding:2px 8px;font-size:12px}
.chip.warn{color:var(--warn)}
.why{font-size:14px;margin:6px 0}
.gap{font-size:13px;color:var(--warn)}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.acts button,.acts a{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:8px;padding:7px 12px;font:inherit;font-size:13px;cursor:pointer;text-decoration:none}
.acts .go{background:var(--acc);border-color:var(--acc);color:#fff}
.st{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.st.queued{color:var(--warn)}.st.approved,.st.applied{color:var(--acc)}.st.interview,.st.offer{color:var(--acc)}.st.skipped,.st.rejected,.st.closed{color:var(--mute)}
.empty{color:var(--mute);text-align:center;padding:30px 0}
#gate{text-align:center;padding:60px 0}
#gate button{background:var(--acc);color:#fff;border:0;border-radius:10px;padding:12px 20px;font:inherit;cursor:pointer}
.note{width:100%;margin-top:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:6px 8px;font:inherit;font-size:13px}
</style>
</head>
<body>
<main>
  <div id="gate" hidden><h1>Karla's Applications</h1><p class="sub">Sign in with Google to continue.</p><button id="signin">Sign in</button><p id="gerr" class="gap"></p></div>
  <div id="app" hidden>
    <h1>Karla's Applications</h1>
    <div class="sub" id="run"></div>
    <div class="tabs" id="tabs"></div>
    <div id="list"></div>
  </div>
</main>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
import {getAuth,GoogleAuthProvider,signInWithPopup,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";
import {getDatabase,ref,onValue,update} from "https://www.gstatic.com/firebasejs/11.0.2/firebase-database.js";
const app=initializeApp({apiKey:"AIzaSyB8ahT56WbEUaGAymsRNNA-DrfZnUnWIwk",authDomain:"test-database-55379.firebaseapp.com",databaseURL:"https://test-database-55379-default-rtdb.asia-southeast1.firebasedatabase.app",projectId:"test-database-55379",appId:"1:933688602756:web:392a3a4ce040cb9d4452d1"});
const auth=getAuth(app),db=getDatabase(app);
const ALLOWED=["charliecayno@gmail.com","kasromantico@gmail.com"];
const $=id=>document.getElementById(id);
const TABS=[["queued","To approve"],["approved","Approved"],["applied","Applied"],["interview","Interview"],["all","All"]];
let tab="queued",jobs={},who="";
$("signin").onclick=async()=>{try{const p=new GoogleAuthProvider();p.setCustomParameters({prompt:"select_account"});await signInWithPopup(auth,p)}catch(e){$("gerr").textContent=e.message}};
onAuthStateChanged(auth,u=>{
  if(!u||!ALLOWED.includes(u.email)){$("gate").hidden=false;$("app").hidden=true;if(u){$("gerr").textContent=u.email+" isn't allowed. Sign in with Charlie's or Karla's Google account.";signOut(auth)}return}
  who=u.email.startsWith("charlie")?"charlie":"karla";
  $("gate").hidden=true;$("app").hidden=false;
  onValue(ref(db,"karlaJobs/jobs"),s=>{jobs=s.val()||{};render()});
  onValue(ref(db,"karlaJobs/lastRun"),s=>{const r=s.val();$("run").textContent=r?`Last search: ${new Date(r.at).toLocaleString("en-PH",{dateStyle:"medium",timeStyle:"short"})} - ${r.found} checked, ${r.queued} new${r.error?" - problem: "+r.error:""}`:"No search has run yet."});
});
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function set(id,status){update(ref(db,"karlaJobs/jobs/"+id),{status,updatedAt:Date.now(),updatedBy:who})}
function render(){
  const arr=Object.values(jobs).sort((a,b)=>(b.queuedAt||0)-(a.queuedAt||0));
  const count=k=>k==="all"?arr.length:arr.filter(j=>j.status===k).length;
  $("tabs").innerHTML=TABS.map(([k,l])=>`<button data-k="${k}" class="${k===tab?"on":""}">${l} (${count(k)})</button>`).join("");
  $("tabs").querySelectorAll("button").forEach(b=>b.onclick=()=>{tab=b.dataset.k;render()});
  const show=tab==="all"?arr:arr.filter(j=>j.status===tab);
  if(!show.length){$("list").innerHTML=`<div class="empty">Nothing here yet.</div>`;return}
  $("list").innerHTML=show.map(j=>`<div class="card">
    <div class="st ${esc(j.status)}">${esc(j.status)}${j.appliedAt?" - "+new Date(j.appliedAt).toLocaleDateString("en-PH",{dateStyle:"medium"}):""}</div>
    <div class="t">${esc(j.title)}</div><div class="co">${esc(j.company)}</div>
    <div class="row"><span class="chip">${esc(j.pay||"Salary undisclosed")}</span><span class="chip">${esc(j.shift||"hours not stated")}</span><span class="chip">${esc(j.type||"")}</span>${j.cv?`<span class="chip">CV: ${esc(j.cv)}</span>`:""}</div>
    ${j.why?`<div class="why">${esc(j.why)}</div>`:""}
    ${j.gaps?`<div class="gap">Check: ${esc(j.gaps)}</div>`:""}
    ${j.note?`<div class="co">Note: ${esc(j.note)}</div>`:""}
    <div class="acts">
      <a href="${esc(j.url)}" target="_blank" rel="noopener">Open ad</a>
      ${j.status==="queued"?`<button class="go" data-a="approved" data-i="${esc(j.id)}">Approve</button><button data-a="skipped" data-i="${esc(j.id)}">Skip</button>`:""}
      ${j.status==="approved"?`<button data-a="applied" data-i="${esc(j.id)}">I applied myself</button><button data-a="queued" data-i="${esc(j.id)}">Undo</button>`:""}
      ${j.status==="applied"?`<button class="go" data-a="interview" data-i="${esc(j.id)}">Got interview</button><button data-a="rejected" data-i="${esc(j.id)}">Rejected</button>`:""}
      ${j.status==="interview"?`<button class="go" data-a="offer" data-i="${esc(j.id)}">Got offer</button><button data-a="rejected" data-i="${esc(j.id)}">Rejected</button>`:""}
      ${j.status==="skipped"?`<button data-a="queued" data-i="${esc(j.id)}">Undo</button>`:""}
    </div></div>`).join("");
  $("list").querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>{
    const extra=b.dataset.a==="applied"?{appliedAt:Date.now()}:{};
    set(b.dataset.i,b.dataset.a);if(extra.appliedAt)update(ref(db,"karlaJobs/jobs/"+b.dataset.i),extra);
  });
}
</script>
</body>
</html>
