<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0f0805">
<title>Karla's Applications</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
@font-face{font-family:"Editors Note";src:url("../devo/assets/EditorsNote-Italic.ttf") format("truetype");font-display:swap}
:root{
  --bg1:#1f120c;--bg2:#0f0805;--sheet:#2A1A14;--card:#2A1A14;--inner:#1a0f0a;--hover:#34221a;--sel:#3e291f;
  --text:#FFF3E9;--body:rgba(255,243,233,.92);--mute:rgba(255,243,233,.6);--label:rgba(255,243,233,.5);--line:rgba(255,243,233,.08);
  --pink:#D97757;--pink-glow:rgba(217,119,87,.35);--pink-hover:#c4643f;--gold:#D97757;--green:#FFF3E9;--amber:#D97757;
  --ease:cubic-bezier(.22,1,.36,1);--ease-out:cubic-bezier(.4,0,.2,1);
}
@media (prefers-color-scheme:light){:root{
  --bg1:#FFF8F2;--bg2:#FFF3E9;--sheet:#fffaf6;--card:#fffaf6;--inner:#f8e9dd;--hover:#f6e2d3;--sel:#f3d9c7;
  --text:#2A1A14;--body:rgba(42,26,20,.9);--mute:rgba(42,26,20,.6);--label:rgba(42,26,20,.5);--line:rgba(42,26,20,.08);--pink-glow:rgba(217,119,87,.28);--green:#2A1A14}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{min-height:100vh;background:radial-gradient(circle at top,var(--bg1),var(--bg2)) fixed;color:var(--text);
  font:400 15px/22px Nunito,system-ui,-apple-system,sans-serif;padding:env(safe-area-inset-top) 0 calc(24px + env(safe-area-inset-bottom))}
main{max-width:640px;margin:0 auto;padding:28px 16px}
button{font:inherit;color:inherit;border:0;cursor:pointer;background:none}
a{color:inherit}

/* header */
.hi{font-family:"Editors Note",Georgia,serif;font-style:italic;font-size:34px;line-height:1.1;margin:0;font-weight:400}
.hi b{color:var(--pink);font-weight:400}
.sub{color:var(--mute);font-size:13px;margin:6px 0 22px;display:flex;align-items:center;gap:6px}
.dot{width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green)}
.dot.err{background:var(--amber);box-shadow:0 0 8px var(--amber)}

/* stats as tabs */
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:22px}
.tab{background:var(--card);border-radius:14px;padding:12px 10px;text-align:left;transition:background .2s}
.tab:hover{background:var(--hover)}
.tab.on{background:var(--sel)}
.tab .n{font-size:22px;font-weight:800;line-height:1}
.tab .l{font-size:10.5px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--label);margin-top:6px;white-space:nowrap}
.tab.on .n{color:var(--pink)}
@media (max-width:420px){.tab .l{letter-spacing:.6px;font-size:10px}.tab .n{font-size:20px}}

/* cards: devo Quick Context shape */
.card{background:var(--card);border-radius:14px;margin-bottom:12px;overflow:hidden;display:grid;grid-template-rows:1fr;
  animation:rise .42s var(--ease) both;transition:grid-template-rows .3s var(--ease-out),opacity .3s var(--ease-out),margin .3s var(--ease-out)}
.card>.in{min-height:0;overflow:hidden}
.card.out{grid-template-rows:0fr;opacity:0;margin-bottom:0}
@keyframes rise{from{opacity:0;transform:translateY(10px) scale(.96)}to{opacity:1;transform:none}}
.body{padding:16px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.lbl{font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--label)}
.st{font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--label)}
.st.queued{color:var(--pink)}
.t{font-size:16px;line-height:22px;font-weight:700;margin:0;color:var(--text)}
.co{color:var(--mute);font-size:14px;line-height:20px}
.txt{font-size:15px;line-height:22px;color:var(--body);margin:10px 0 0}
.txt strong{font-weight:800;color:var(--text)}
.h{font-size:16px;font-weight:700;margin:14px 0 4px;color:var(--text)}
.bl{display:flex;margin-bottom:6px;padding-left:4px;font-size:15px;line-height:22px;color:var(--body)}
.bl .d{width:16px;font-weight:700;color:var(--label);flex-shrink:0}
.psub{font-size:12px;color:var(--mute)}
.note{font-size:13px;color:var(--mute);margin-top:10px}
/* footer band, like devo's DIG DEEPER row */
.foot{display:flex;background:var(--inner)}
.foot>*{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;padding:14px 8px;font-size:11px;font-weight:700;letter-spacing:1.5px;
  text-transform:uppercase;color:var(--mute);text-decoration:none;transition:background .15s,color .15s;min-height:46px}
.foot>*:hover{background:var(--hover);color:var(--text)}
.foot>*+*{box-shadow:-1px 0 0 var(--line)}
.foot .go{color:var(--pink);flex:1.4}
.foot .go .ic{font-size:13px}
.foot .chev{font-size:16px;opacity:.4;letter-spacing:0}
/* states */
.empty{text-align:center;padding:48px 16px;color:var(--mute)}
.empty .big{font-family:"Editors Note",Georgia,serif;font-style:italic;font-size:24px;color:var(--text);margin-bottom:6px}
.sparkles{display:flex;justify-content:center;gap:8px;color:var(--gold);font-size:16px;margin-bottom:10px}
.sparkles span{animation:pulse 1.2s ease-in-out infinite}
.sparkles span:nth-child(2){animation-delay:.2s}.sparkles span:nth-child(3){animation-delay:.4s}
@keyframes pulse{0%,100%{opacity:.25;transform:scale(.85)}50%{opacity:1;transform:scale(1)}}

/* gate */
#gate{min-height:70vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:6px}
.btn{border-radius:12px;font-weight:700;font-size:14px;display:inline-flex;align-items:center;gap:8px;transition:background .2s}
#gate .btn{margin-top:18px;background:var(--card);height:48px;padding:0 22px}
#gate .btn:hover{background:var(--hover)}
#gate .err{color:var(--amber);font-size:13px;max-width:320px;margin-top:10px}

/* toast */
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translate(-50%,20px);opacity:0;pointer-events:none;
  background:var(--sheet);color:var(--text);border-radius:14px;padding:10px 10px 10px 16px;display:flex;gap:14px;align-items:center;font-weight:600;font-size:14px;
  box-shadow:0 12px 32px rgba(0,0,0,.35);transition:transform .35s var(--ease),opacity .35s var(--ease);max-width:calc(100% - 32px)}
.toast.show{transform:translate(-50%,0);opacity:1;pointer-events:auto}
.toast button{color:var(--pink);font-weight:800;padding:6px 10px;border-radius:8px}
.toast button:hover{background:var(--inner)}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main>
  <section id="gate" hidden>
    <h1 class="hi">Karla's <b>Applications</b></h1>
    <p class="sub" style="justify-content:center">Sign in to see your job queue.</p>
    <button class="btn" id="signin">Continue with Google</button>
    <p class="err" id="gerr"></p>
  </section>
  <section id="app" hidden>
    <h1 class="hi">Hi <b>Karla</b></h1>
    <p class="sub" id="run"></p>
    <nav class="tabs" id="tabs"></nav>
    <div id="list"></div>
  </section>
</main>
<div class="toast" id="toast"><span id="tmsg"></span><button id="tundo">Undo</button></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
import {getAuth,GoogleAuthProvider,signInWithPopup,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";
import {getDatabase,ref,onValue,update} from "https://www.gstatic.com/firebasejs/11.0.2/firebase-database.js";
const app=initializeApp({apiKey:"AIzaSyB8ahT56WbEUaGAymsRNNA-DrfZnUnWIwk",authDomain:"test-database-55379.firebaseapp.com",databaseURL:"https://test-database-55379-default-rtdb.asia-southeast1.firebasedatabase.app",projectId:"test-database-55379",appId:"1:933688602756:web:392a3a4ce040cb9d4452d1"});
const auth=getAuth(app),db=getDatabase(app);
const ALLOWED=["charliecayno@gmail.com","kasromantico@gmail.com"];
const $=id=>document.getElementById(id);
const TABS=[["queued","To review"],["approved","Approved"],["applied","Applied"],["interview","Interviews"]];
const LABEL={queued:"New",approved:"Approved",applied:"Applied",interview:"Interview",offer:"Offer",rejected:"Closed",skipped:"Skipped"};
let tab="queued",jobs={},who="",loaded=false,toastT;

$("signin").onclick=async()=>{try{const p=new GoogleAuthProvider();p.setCustomParameters({prompt:"select_account"});await signInWithPopup(auth,p)}catch(e){$("gerr").textContent=e.message}};
onAuthStateChanged(auth,u=>{
  if(!u||!ALLOWED.includes(u.email)){$("gate").hidden=false;$("app").hidden=true;
    if(u){$("gerr").textContent=u.email+" can't open this page. Use Charlie's or Karla's Google account.";signOut(auth)}return}
  who=u.email.startsWith("charlie")?"charlie":"karla";
  if(who==="charlie")document.querySelector("#app .hi").innerHTML="Karla's <b>queue</b>";
  $("gate").hidden=true;$("app").hidden=false;render();
  onValue(ref(db,"karlaJobs/jobs"),s=>{jobs=s.val()||{};loaded=true;render()});
  onValue(ref(db,"karlaJobs/lastRun"),s=>{const r=s.val();
    $("run").innerHTML=r?`<span class="dot${r.error?" err":""}"></span>${r.error?"Last search had a problem":"Searched "+ago(r.at)} · ${r.found} jobs checked, ${r.queued} picked`:"The first search runs at 6 AM.";});
});

const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function ago(t){const m=Math.round((Date.now()-t)/60000);if(m<60)return m<=1?"just now":m+" min ago";const h=Math.round(m/60);if(h<24)return h+"h ago";
  return new Date(t).toLocaleDateString("en-PH",{month:"short",day:"numeric"})}
const source=j=>/onlinejobs/.test(j.url||"")?"OnlineJobs.ph":/indeed/.test(j.url||"")?"Indeed":/linkedin/.test(j.url||"")?"LinkedIn":"JobStreet";
const clean=s=>String(s||"").replace(/\s*\((top of range|exact hours)[^)]*\)/i,"").trim();
function payInfo(raw){
  const p=clean(raw);if(!p||/undisclosed|not shown|tbd/i.test(p))return {main:"Not shown"};
  const usd=/\$|usd/i.test(p),nums=(p.replace(/,/g,"").match(/\d+(\.\d+)?k?/gi)||[]).map(n=>/k$/i.test(n)?parseFloat(n)*1000:parseFloat(n)).filter(n=>n>0);
  if(!nums.length)return {main:p};
  const per=/hour|hr\b|\/h\b/i.test(p)?"h":/week|wk/i.test(p)?"w":/year|annum|yr/i.test(p)?"y":/day/i.test(p)?"d":"m";
  const mult={h:8*22,d:22,w:52/12,y:1/12,m:1}[per]*(usd?56:1);
  if(per==="m"&&!usd)return {main:p.replace(/^PHP\s*/i,"₱").replace(/ per month/i," / mo")};
  const fmt=n=>{const v=n*mult;return "₱"+(v>=10000?(Math.round(v/100)/10)+"k":Math.round(v).toLocaleString())};
  const lo=nums[0],hi=nums[1];
  return {main:(hi?fmt(lo)+" – "+fmt(hi):fmt(lo))+" / mo",sub:p+(per==="h"?" · 8h × 22 days":"")+(usd?" · $1 = ₱56":"")};
}
const GROUP={queued:["queued"],approved:["approved"],applied:["applied","rejected"],interview:["interview","offer"]};
const inTab=(j,k)=>GROUP[k].includes(j.status);

function toast(msg,undo){$("tmsg").textContent=msg;$("toast").classList.add("show");$("tundo").onclick=()=>{undo();hideToast()};
  clearTimeout(toastT);toastT=setTimeout(hideToast,5000)}
function hideToast(){$("toast").classList.remove("show")}

function set(id,status,msg){
  const prev=jobs[id]?.status,card=document.querySelector(`[data-card="${id}"]`);
  const go=()=>{const extra=status==="applied"?{appliedAt:Date.now()}:{};update(ref(db,"karlaJobs/jobs/"+id),{status,updatedAt:Date.now(),updatedBy:who,...extra})};
  if(card&&!matchMedia("(prefers-reduced-motion:reduce)").matches){card.classList.add("out");setTimeout(go,280)}else go();
  if(msg)toast(msg,()=>update(ref(db,"karlaJobs/jobs/"+id),{status:prev,updatedAt:Date.now(),updatedBy:who}));
}

function render(){
  const arr=Object.values(jobs).sort((a,b)=>(b.queuedAt||0)-(a.queuedAt||0));
  $("tabs").innerHTML=TABS.map(([k,l])=>`<button class="tab${k===tab?" on":""}" data-k="${k}"><div class="n">${arr.filter(j=>inTab(j,k)).length}</div><div class="l">${l}</div></button>`).join("");
  $("tabs").querySelectorAll(".tab").forEach(b=>b.onclick=()=>{tab=b.dataset.k;render()});
  if(!loaded){$("list").innerHTML=`<div class="empty"><div class="sparkles"><span>✦</span><span>✦</span><span>✦</span></div>Loading your jobs…</div>`;return}
  const show=arr.filter(j=>inTab(j,tab));
  if(!show.length){$("list").innerHTML=`<div class="empty"><div class="big">${{queued:"All caught up",approved:"Nothing approved yet",applied:"No applications yet",interview:"No interviews yet"}[tab]}</div>${{queued:"New jobs arrive every morning at 6.",approved:"Approve a job and it waits here until it's sent.",applied:"Sent applications show up here.",interview:"When an employer replies, mark it here."}[tab]}</div>`;return}
  $("list").innerHTML=show.map(card).join("");
  $("list").querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>set(b.dataset.i,b.dataset.a,b.dataset.m));
}

function card(j){
  const checks=String(j.gaps||"").split(/;\s*/).map(x=>x.trim()).filter(Boolean);
  const id=esc(j.id),pi=payInfo(j.pay);
  const A=(a,label,cls,msg)=>`<button class="${cls||""}" data-a="${a}" data-i="${id}" data-m="${esc(msg||"")}">${label}</button>`;
  const GO=l=>`<span class="ic">✦</span>${l}<span class="chev">›</span>`;
  let acts="";
  if(j.status==="queued")acts=A("skipped","Skip","","Skipped")+A("approved",GO("Approve"),"go","Approved");
  else if(j.status==="approved")acts=A("queued","Undo","")+A("applied",GO("I applied"),"go","Marked as applied");
  else if(j.status==="applied")acts=A("rejected","Closed","","Marked as closed")+A("interview",GO("Interview"),"go","Moved to Interviews");
  else if(j.status==="interview")acts=A("rejected","Closed","","Marked as closed")+A("offer",GO("Offer"),"go","Congrats!");
  const cap=x=>x.charAt(0).toUpperCase()+x.slice(1);
  return `<article class="card" data-card="${id}"><div class="in">
    <div class="body">
      <div class="top"><span class="lbl">${source(j)}${j.queuedAt?" · "+ago(j.queuedAt):""}</span><span class="st ${esc(j.status)}">${LABEL[j.status]||esc(j.status)}</span></div>
      <h2 class="t">${esc(j.title)}</h2>
      <div class="co">${esc(j.company)}</div>
      <p class="txt"><strong>${esc(pi.main)}</strong>${j.type?" · "+esc(j.type):""}<br>${esc(j.shift||"Hours not stated")}</p>
      ${pi.sub?`<div class="psub">${esc(pi.sub)}</div>`:""}
      ${j.why?`<p class="txt">${esc(j.why)}</p>`:""}
      ${checks.length?`<div class="h">Check in the ad</div>${checks.map(c=>`<div class="bl"><span class="d">•</span><span>${esc(cap(c))}</span></div>`).join("")}`:""}
      ${j.note?`<div class="note">${esc(j.note)}</div>`:""}
    </div>
    <div class="foot">${acts}<a href="${esc(j.url)}" target="_blank" rel="noopener">Open ad ↗</a></div>
  </div></article>`;
}

</script>
</body>
</html>
