<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Peter &amp; Angelica · Wedding Binder</title>
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#0a0b14" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              ink: {
                900: "#0a0b14",
                800: "#10121f",
                700: "#1a1c2e",
                600: "#242740",
              },
              amber: {
                glow: "#fbbf24",
              },
              rose: {
                glow: "#fda4af",
              },
            },
            fontFamily: {
              display: ['"Playfair Display"', "serif"],
              sans: ['"Quicksand"', "system-ui", "sans-serif"],
            },
            boxShadow: {
              glow: "0 0 40px rgba(251, 191, 36, 0.15)",
              "glow-rose": "0 0 40px rgba(253, 164, 175, 0.15)",
            },
          },
        },
      };
    </script>

    <link
      href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,700;1,500;1,700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/icon?family=Material+Icons+Round"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <script>
      // When this binder is embedded in the wedding-costs page it must not
      // paint its own background — the parent's fireflies show through.
      if (window.self !== window.top) {
        document.documentElement.classList.add("embedded");
      }
    </script>
  </head>

  <body class="font-sans text-stone-300 antialiased">
    <!-- Ambient backdrop -->
    <div class="backdrop-layer" aria-hidden="true">
      <div class="backdrop-grad"></div>
      <div class="backdrop-blob backdrop-blob-amber"></div>
      <div class="backdrop-blob backdrop-blob-rose"></div>
      <div class="backdrop-noise"></div>
    </div>

    <!-- Sticky glass header -->
    <header class="app-header">
      <div class="header-inner">
        <div class="header-brand">
          <span class="header-kicker">
            <span class="material-icons-round text-[12px]">auto_awesome</span>
            The Main Story
          </span>
          <h1 class="header-title">
            Peter <span class="amp">&amp;</span> Angelica
          </h1>
        </div>
        <div class="header-meta">
          <div id="sync-indicator" class="sync-chip">
            <span class="material-icons-round text-[14px] animate-spin">sync</span>
            <span>Syncing</span>
          </div>
          <div class="date-chip">
            <span class="material-icons-round text-amber-glow text-[14px]">event</span>
            <span>07 · 02 · 2026</span>
          </div>
        </div>
      </div>
    </header>

    <main class="page-main">
      <!-- Hero dashboard -->
      <section id="hero" class="hero-card">
        <div class="hero-top">
          <div class="hero-countdown">
            <span class="hero-kicker">Days until forever</span>
            <div class="hero-countdown-num">
              <span id="countdown-days">—</span>
              <span class="hero-countdown-unit">days</span>
            </div>
            <span id="countdown-sub" class="hero-sub">—</span>
          </div>

          <div class="hero-ring-wrap">
            <svg class="hero-ring" viewBox="0 0 120 120" aria-hidden="true">
              <defs>
                <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#fcd34d" />
                  <stop offset="55%" stop-color="#fbbf24" />
                  <stop offset="100%" stop-color="#fda4af" />
                </linearGradient>
              </defs>
              <circle class="ring-track" cx="60" cy="60" r="52" />
              <circle id="ring-progress" class="ring-progress" cx="60" cy="60" r="52" />
            </svg>
            <div class="hero-ring-inner">
              <span id="progress-pct" class="hero-ring-pct">0%</span>
              <span class="hero-ring-label">complete</span>
            </div>
          </div>
        </div>

        <div id="now-card" class="now-card" onclick="window.openFromNow()">
          <div class="now-left">
            <span class="now-kicker">
              <span class="now-dot"></span> Currently on
            </span>
            <span id="now-title" class="now-title">—</span>
            <span id="now-period" class="now-period">—</span>
          </div>
          <div class="now-cta">
            <span class="material-icons-round">arrow_forward</span>
          </div>
        </div>

      </section>

      <!-- View toggle only -->
      <section class="controls-bar">
        <div class="view-toggle">
          <button class="vtoggle is-active" data-view="grid" title="Grid view">
            <span class="material-icons-round text-[18px]">dashboard</span>
          </button>
          <button class="vtoggle" data-view="timeline" title="Timeline view">
            <span class="material-icons-round text-[18px]">view_timeline</span>
          </button>
        </div>
      </section>

      <!-- Chapter gallery -->
      <section id="chapter-gallery" class="chapter-grid">
        <!-- rendered by script.js -->
      </section>

      <footer class="page-footer">
        <span class="footer-mark">Peter <span class="heart">♡</span> Angelica</span>
        <span class="footer-date">February 2027</span>
      </footer>
    </main>

    <!-- Detail Sheet (bottom sheet on mobile, modal on desktop) -->
    <div id="modal" class="sheet-overlay hidden" onclick="window.onOverlayClick(event)">
      <div id="modal-container" class="sheet-panel" role="dialog" aria-modal="true">
        <div class="sheet-handle" aria-hidden="true"></div>

        <button id="planner-back-btn" class="planner-back-btn" onclick="window.closeModal()" title="Back to main">
          <span class="material-icons-round">arrow_back</span>
          <span>Main</span>
        </button>

        <div id="modal-banner" class="sheet-banner">
          <div class="banner-glow"></div>
          <span id="modal-badge" class="banner-badge"></span>
          <div class="banner-actions">
            <button
              id="toggleAddObjects"
              onclick="window.toggleAddShapes()"
              class="icon-btn hidden"
              title="Add shape"
            >
              <span class="material-icons-round">add</span>
            </button>
            <button
              onclick="window.closeModal()"
              class="icon-btn"
              title="Close"
            >
              <span class="material-icons-round">close</span>
            </button>
          </div>
        </div>

        <div id="modal-scroll-area" class="sheet-scroll no-scrollbar">
          <div id="modal-header-content" class="sheet-header">
            <input
              type="text"
              id="modal-title-input"
              class="sheet-title-input"
              placeholder="Chapter title"
            />
            <input
              type="text"
              id="modal-date-input"
              class="sheet-period-input"
              placeholder="Date range or label"
            />
          </div>

          <div id="modal-body" class="sheet-body">
            <!-- rendered by script.js -->
          </div>
        </div>

        <!-- Planner toolbar -->
        <div id="planner-toolbar" class="planner-toolbar hidden">
          <button onclick="window.addTable('circle')" class="ptool">
            <span class="material-icons-round">circle</span><span>Circle</span>
          </button>
          <button onclick="window.addTable('square')" class="ptool">
            <span class="material-icons-round">check_box_outline_blank</span><span>Square</span>
          </button>
          <button onclick="window.addTable('rect')" class="ptool">
            <span class="material-icons-round">view_stream</span><span>Rect</span>
          </button>
          <button onclick="window.addTable('corner')" class="ptool">
            <span class="material-icons-round">border_style</span><span>Corner</span>
          </button>
          <button onclick="window.addTable('text')" class="ptool">
            <span class="material-icons-round">text_fields</span><span>Text</span>
          </button>
          <button onclick="window.addTable('vip')" class="ptool">
            <span class="material-icons-round">reorder</span><span>VIP</span>
          </button>
          <div class="ptool-divider"></div>
          <button onclick="window.importSeating()" class="ptool">
            <span class="material-icons-round">group_add</span><span>Import</span>
          </button>
          <button onclick="window.resetView()" class="ptool">
            <span class="material-icons-round">filter_center_focus</span><span>Center</span>
          </button>
          <button onclick="window.exportLayout()" class="ptool">
            <span class="material-icons-round">print</span><span>Export</span>
          </button>
          <button onclick="window.toggleAddShapes()" class="ptool">
            <span class="material-icons-round">keyboard_arrow_down</span><span>Hide</span>
          </button>
        </div>

        <!-- Sticky footer (Add Entry etc) -->
        <div id="modal-footer" class="sheet-footer">
          <button
            id="add-row-btn"
            onclick="window.addRow()"
            class="add-entry-btn"
          >
            <span class="material-icons-round text-[16px]">add_circle</span>
            Add Entry
          </button>
        </div>
      </div>
    </div>

    <!-- Seat Assignment Modal -->
    <div id="seat-modal" class="seat-overlay hidden">
      <div class="seat-panel">
        <div class="seat-left">
          <div id="table-zoom-container" class="seat-zoom">
            <!-- zoom table + bubbles -->
          </div>
          <div class="seat-hint">
            <span class="material-icons-round text-[12px]">pan_tool</span>
            Drag initials to set position
          </div>
        </div>

        <div class="seat-right">
          <div class="seat-right-head">
            <h3 id="seat-modal-title" class="seat-title">Assign Seats</h3>
            <button onclick="window.closeSeatModal()" class="icon-btn-sm">
              <span class="material-icons-round">close</span>
            </button>
          </div>

          <div class="seat-assigned">
            <span class="seat-assigned-head">Inscribed in Table</span>
            <div id="assigned-names-list" class="seat-assigned-list"></div>
          </div>

          <div class="seat-search-wrap">
            <span class="material-icons-round text-[16px] text-stone-500">search</span>
            <input
              type="text"
              id="guest-search"
              class="seat-search"
              placeholder="Search guests…"
              oninput="window.filterGuestList()"
            />
          </div>
          <div id="guest-selection-list" class="seat-picker no-scrollbar"></div>
        </div>
      </div>
    </div>

    <!-- Custom Confirm Modal -->
    <div id="confirm-modal" class="confirm-overlay hidden" onclick="window.onConfirmBackdrop(event)">
      <div class="confirm-panel" role="alertdialog" aria-modal="true">
        <div class="confirm-icon">
          <span class="material-icons-round">warning_amber</span>
        </div>
        <h3 id="confirm-title" class="confirm-title">Are you sure?</h3>
        <p id="confirm-body" class="confirm-body"></p>
        <div class="confirm-actions">
          <button type="button" class="confirm-cancel" onclick="window.resolveConfirm(false)">
            Cancel
          </button>
          <button type="button" class="confirm-ok" onclick="window.resolveConfirm(true)">
            <span id="confirm-ok-label">Delete</span>
          </button>
        </div>
      </div>
    </div>

    <script type="module" src="script.js"></script>
  </body>
</html>
